<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peirastes - Knowledge Base Explorer</title>
  <meta name="description" content="Interactive force-directed graph of the epistemological knowledge base — claims, evidence, dependencies, and their connections.">
  <meta property="og:title" content="Peirastes - Knowledge Base Explorer">
  <meta property="og:description" content="Interactive visualization of the epistemological knowledge base.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://peirastes.com/kb-explorer/">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0c0e18;
      --bg-panel: rgba(14, 16, 26, 0.96);
      --bg-toolbar: rgba(12, 14, 24, 0.95);
      --bg-input: #1a1e30;
      --border: #1a1e30;
      --border-hover: #4a5580;
      --text: #c8d0e0;
      --text-dim: #506080;
      --text-muted: #3a4560;
      --accent-green: #50c878;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --accent-blue: #6ea8fe;
      --accent-purple: #c084fc;
      --accent-orange: #e07050;
      --accent-steel: #8090b0;
      --accent-gray: #607080;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* --- Toolbar ---------------------------------------------------------- */
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 40px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .tb-section { display: flex; align-items: center; gap: 6px; }
    .tb-section.search { margin-left: auto; }

    /* --- Filter Sidebar --------------------------------------------------- */
    #filter-panel {
      position: fixed;
      top: 40px; left: 0;
      width: 150px;
      bottom: 26px;
      background: var(--bg-toolbar);
      border-right: 1px solid var(--border);
      padding: 12px 14px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(8px);
      overflow-y: auto;
    }

    .filter-heading {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .mode-btn {
      background: var(--bg-input);
      border: 1px solid #2a3050;
      color: var(--text-dim);
      padding: 3px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
    }

    .mode-btn.active { background: #2a3560; color: var(--text); border-color: var(--border-hover); }
    .mode-btn:hover { background: #252a40; }

    .layer-btn {
      background: var(--bg-input);
      border: 1px solid #2a3050;
      color: var(--text-dim);
      padding: 3px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
    }

    .layer-btn.active { background: #1a4a40; color: #00d4aa; border-color: #2a6a5a; }
    .layer-btn:hover { background: #1a3a35; }

    .domain-filter {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text-dim);
    }

    .domain-filter input { display: none; }
    .domain-filter input:not(:checked) + .fdot { opacity: 0.15; }
    .fdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; transition: opacity 0.15s; }

    .search-input {
      background: var(--bg-input);
      border: 1px solid #2a3050;
      color: var(--text);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      width: 160px;
      outline: none;
    }

    .search-input:focus { border-color: var(--border-hover); }

    .act-btn {
      background: var(--bg-input);
      border: 1px solid #2a3050;
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }

    .act-btn:hover { background: #252a40; }

    /* --- Graph ------------------------------------------------------------ */
    #graph {
      position: fixed;
      top: 40px; left: 150px; right: 0;
      bottom: 26px;
      width: calc(100vw - 150px);
      height: calc(100vh - 66px);
    }

    /* --- Side Panel ------------------------------------------------------- */
    #panel {
      position: fixed;
      top: 40px;
      right: -400px;
      width: 380px;
      height: calc(100vh - 66px);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      transition: right 0.25s ease;
      z-index: 90;
      backdrop-filter: blur(12px);
    }

    #panel.open { right: 0; }

    .p-header { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); position: relative; }
    .p-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
    .p-close:hover { color: var(--text); }
    .p-title { font-size: 16px; font-weight: 600; color: #e0e4f0; line-height: 1.35; margin-bottom: 4px; }
    .p-id { font-family: 'Consolas', 'Fira Code', monospace; font-size: 11px; font-weight: 400; margin-bottom: 6px; opacity: 0.6; }
    .p-id-edit {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 11px;
      background: var(--bg-input);
      border: 1px solid #2a3050;
      color: inherit;
      padding: 2px 6px;
      border-radius: 3px;
      outline: none;
      width: auto;
      min-width: 60px;
    }
    .p-id-edit:focus { border-color: var(--border-hover); }
    .p-id-reset {
      font-size: 9px;
      color: var(--text-dim);
      cursor: pointer;
      margin-left: 6px;
      opacity: 0.5;
    }
    .p-id-reset:hover { opacity: 1; }
    .p-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { font-size: 9px; padding: 1px 7px; border-radius: 3px; background: var(--bg-input); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-established { background: #50c87818; color: var(--accent-green); }
    .badge-hypothesized { background: #fbbf2418; color: var(--accent-amber); }
    .badge-speculative { background: #f8717118; color: var(--accent-red); }
    .badge-layer-human { background: #8090b015; color: #8090b0; border: 1px solid #8090b030; }
    .badge-layer-ai { background: #00d4aa15; color: #00d4aa; border: 1px solid #00d4aa30; }
    .badge-active { background: #00d4aa20; color: #00d4aa; }
    .badge-draft { background: #77aaff20; color: #77aaff; }

    .p-body { padding: 12px 16px; }
    .p-section { margin-bottom: 14px; }
    .s-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
    .s-text { font-size: 12px; line-height: 1.5; color: #b0b8c8; }
    .s-text.evidence { color: #90b8a0; }
    .s-text.counter { color: #c8a090; }
    .s-text.notes { color: #a0a8b8; font-style: italic; }
    .s-text.flagged { color: var(--accent-red); }

    .bullet { padding: 2px 0 2px 10px; border-left: 2px solid #2a3050; margin-bottom: 3px; font-size: 11px; }

    .p-meta { font-size: 11px; color: #707888; margin-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
    .mk { color: var(--text-dim); font-weight: 600; }

    .dep-list { display: flex; flex-wrap: wrap; gap: 3px; }
    .dep-link {
      font-family: monospace; font-size: 10px; padding: 1px 6px;
      background: var(--bg-input); border: 1px solid #2a3050; border-radius: 3px;
      cursor: pointer; color: var(--text-dim); transition: all 0.15s;
    }
    .dep-link:hover { background: #2a3560; color: var(--text); border-color: var(--border-hover); }

    /* --- Stats ------------------------------------------------------------ */
    #stats {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 26px;
      background: var(--bg-toolbar);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      font-size: 10px;
      color: var(--text-dim);
      font-family: monospace;
      z-index: 100;
    }

    #stats .sep { color: #2a3050; }

    /* --- Tooltip ---------------------------------------------------------- */
    #tooltip {
      position: fixed;
      display: none;
      background: var(--bg-panel);
      border: 1px solid #2a3050;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.4;
      pointer-events: none;
      z-index: 300;
      max-width: 260px;
    }

    .tt-meta { color: var(--text-dim); font-size: 10px; }

    /* --- Legend ----------------------------------------------------------- */
    #legend {
      position: fixed;
      bottom: 34px; left: 160px;
      background: rgba(14, 16, 26, 0.88);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      font-size: 9px;
      color: var(--text-dim);
      z-index: 80;
      line-height: 1.8;
    }

    .lg-row { display: flex; align-items: center; gap: 5px; }
    .lg-shape { width: 9px; height: 9px; display: inline-block; }
    .lg-shape.diamond { transform: rotate(45deg); background: var(--accent-steel); }
    .lg-shape.square { background: var(--accent-steel); border-radius: 1px; }
    .lg-shape.circle { border-radius: 50%; background: var(--accent-steel); }
    .lg-shape.tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 9px solid var(--accent-gray); }
    .lg-shape.ring { border-radius: 50%; border: 1.5px solid #a08850; }
    .lg-shape.hexagon { background: #00d4aa; clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); }
    .lg-shape.pentagon { background: #77aaff; clip-path: polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%); }
    .lg-shape.tool-sq { background: #7a8a9a; border-radius: 3px; }

    @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2.5s ease-in-out infinite; }

    .p-placeholder { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

<div id="toolbar"></div>
<div id="filter-panel"></div>
<svg id="graph"></svg>
<div id="panel"><div class="p-placeholder">Click a node to inspect</div></div>
<div id="stats"></div>
<div id="tooltip"></div>

<div id="legend">
  <div class="lg-row"><span class="lg-shape diamond"></span> First Principle</div>
  <div class="lg-row"><span class="lg-shape square"></span> Domain Axiom</div>
  <div class="lg-row"><span class="lg-shape circle"></span> Claim</div>
  <div class="lg-row"><span class="lg-shape tri"></span> TES Concept</div>
  <div class="lg-row"><span class="lg-shape ring"></span> Quote</div>
  <div style="margin-top:3px;border-top:1px solid #1a1e30;padding-top:3px;font-size:8px;color:#3a4560;text-transform:uppercase;letter-spacing:1px">AI KB</div>
  <div class="lg-row"><span class="lg-shape diamond" style="background:#90a8c0"></span> Agent Principle</div>
  <div class="lg-row"><span class="lg-shape hexagon"></span> SOP</div>
  <div class="lg-row"><span class="lg-shape pentagon"></span> Skill</div>
  <div class="lg-row"><span class="lg-shape tool-sq"></span> Tool</div>
  <div style="margin-top:3px;border-top:1px solid #1a1e30;padding-top:3px;">
    <div>Solid = Established</div>
    <div>Pulsing = Hypothesized</div>
    <div>Faint = Speculative</div>
  </div>
  <div style="margin-top:3px;color:#2a3050">Keys: 1/2 mode &middot; 3/4/5 layer &middot; F fit &middot; Esc close</div>
</div>
<script>
// --- Constants ----------------------------------------------------------------
const COLORS = {
  foundation:'#8090b0', EPI:'#6ea8fe', ECDO:'#e07050', TF:'#50c878',
  DSL:'#c084fc', PED:'#fbbf24', ARCH:'#f87171', tes:'#607080', quotes:'#a08850', unknown:'#555',
  ai_foundation:'#90a8c0', ai_shared:'#7a8a9a',
  CE:'#00d4aa', CD:'#ff8866', PM:'#77aaff', RA:'#ffcc44', SA:'#cc88ff', TA:'#88ddaa'
};
const DOMAIN_NAMES = {
  foundation:'Foundation', EPI:'Epistemology', ECDO:'ECDO Theory', TF:'Thermofluidic Finance',
  DSL:'Dynamical Systems', PED:'Pedagogy', ARCH:'Archaeoastronomy', tes:'TES Concepts', quotes:'Quotes', unknown:'Unknown',
  ai_foundation:'Agent Principles', ai_shared:'Shared', CE:'CE Agent', CD:'CD Agent', PM:'PM Agent', RA:'RA Agent', SA:'SA Agent', TA:'TA Agent'
};
const STATUS_OP = { Established:1, Hypothesized:0.85, Speculative:0.45, Unknown:0.3, Retracted:0.15,
  Active:1, Draft:0.6, Deprecated:0.25, Proposed:0.7 };
const PROFICIENCY_OP = { Expert:1, Competent:0.75, Learning:0.5 };

const CLUSTER_HUMAN = {
  foundation:{x:0,y:-120}, EPI:{x:-160,y:-50}, ECDO:{x:160,y:-50},
  TF:{x:-120,y:80}, DSL:{x:-30,y:120}, PED:{x:120,y:80}, ARCH:{x:180,y:30},
  tes:{x:0,y:0}, quotes:{x:0,y:200}
};
const CLUSTER_AI = {
  ai_foundation:{x:0,y:-120}, ai_shared:{x:0,y:0},
  CE:{x:-160,y:-50}, CD:{x:160,y:-50}, PM:{x:0,y:-80},
  RA:{x:-120,y:80}, SA:{x:120,y:80}, TA:{x:0,y:120}
};

function getClusterPos(d) {
  const dom = d.domain;
  if (layerMode === 'both') {
    if (CLUSTER_HUMAN[dom]) return { x: CLUSTER_HUMAN[dom].x - 200, y: CLUSTER_HUMAN[dom].y };
    if (CLUSTER_AI[dom]) return { x: CLUSTER_AI[dom].x + 200, y: CLUSTER_AI[dom].y };
    return { x: 0, y: 0 };
  }
  return CLUSTER_HUMAN[dom] || CLUSTER_AI[dom] || { x: 0, y: 0 };
}

function nColor(n) { return COLORS[n.domain] || COLORS.unknown; }
function nOpacity(n) {
  if (n.type==='fp') return 1; if (n.type==='da') return 0.95;
  if (n.type==='tes') return 0.6; if (n.type==='quote') return 0.4;
  if (n.type==='ap') return 1.0;
  if (n.type==='tool') return 0.85;
  if (n.type==='ifc') return 0.7;
  if (n.type==='sop') return STATUS_OP[n.status] || 0.8;
  if (n.type==='skl') return PROFICIENCY_OP[n.proficiency] || 0.5;
  return STATUS_OP[n.status] || 0.5;
}
function nRadius(n) {
  if (n.type==='tes') return 3;
  if (n.type==='quote') return 2.5;
  if (n.type==='fp') return 6 + Math.sqrt(n.fanOut)*2.5;
  if (n.type==='da') return 5 + Math.sqrt(n.fanOut)*2;
  if (n.type==='ap') return 6 + Math.sqrt(n.fanOut)*2.5;
  if (n.type==='sop') return 6 + Math.sqrt(n.fanOut)*2;
  if (n.type==='skl') return 4 + Math.sqrt(n.fanOut)*2;
  if (n.type==='tool') return 4 + Math.sqrt(n.fanOut)*2;
  if (n.type==='ifc') return 3.5;
  return 5 + Math.sqrt(n.fanOut)*3;
}

function hexPath(r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/3)*i - Math.PI/2;
    pts.push(`${r*Math.cos(a)},${r*Math.sin(a)}`);
  }
  return `M${pts.join('L')}Z`;
}
function pentPath(r) {
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = (2*Math.PI/5)*i - Math.PI/2;
    pts.push(`${r*Math.cos(a)},${r*Math.sin(a)}`);
  }
  return `M${pts.join('L')}Z`;
}

// --- State --------------------------------------------------------------------
let mode = 'survey';
let layerMode = 'both';
let focusedIds = new Set();
let simulation, nodeEls, linkEls, labelEls, zoomBehavior;
let graphData;
let quotesByNode = new Map();

// --- ID Rename System ---------------------------------------------------------
const idRenames = JSON.parse(localStorage.getItem('kb-id-renames') || '{}');

function displayId(originalId) {
  return idRenames[originalId] || originalId;
}

function saveRename(originalId, newName) {
  if (!newName || newName === originalId) {
    delete idRenames[originalId];
  } else {
    idRenames[originalId] = newName;
  }
  localStorage.setItem('kb-id-renames', JSON.stringify(idRenames));
}

// --- Visible Data Filter ------------------------------------------------------
function getVisibleData() {
  let vn = graphData.nodes;
  if (layerMode === 'human') vn = vn.filter(n => n.layer === 'human');
  else if (layerMode === 'ai') vn = vn.filter(n => n.layer === 'ai');
  const ids = new Set(vn.map(n => n.id));
  const vl = graphData.links.filter(l => {
    const s = typeof l.source === 'string' ? l.source : l.source.id;
    const t = typeof l.target === 'string' ? l.target : l.target.id;
    return ids.has(s) && ids.has(t);
  });
  return { nodes: vn, links: vl };
}

// --- Load & Render ------------------------------------------------------------
async function init() {
  const resp = await fetch('kb-data.json');
  graphData = await resp.json();
  const { nodes, links } = graphData;

  console.log(`KB: ${nodes.length} nodes, ${links.length} links`);

  // Build reverse lookup: which quotes link to each node
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  for (const l of links) {
    if (l.type === 'quote-resonance') {
      const srcId = typeof l.source === 'string' ? l.source : l.source.id;
      const tgtId = typeof l.target === 'string' ? l.target : l.target.id;
      const quoteNode = nodeById.get(tgtId);
      if (quoteNode) {
        if (!quotesByNode.has(srcId)) quotesByNode.set(srcId, []);
        quotesByNode.get(srcId).push(quoteNode);
      }
    }
  }

  buildToolbar();
  buildStats();
  const vis = getVisibleData();
  renderGraph(vis.nodes, vis.links);
  setTimeout(fitAll, 2000);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') { closePanel(); clearFocus(); }
    if (e.key === 'f' || e.key === 'F') fitAll();
    if (e.key === '1') setMode('survey');
    if (e.key === '2') setMode('focus');
    if (e.key === '3') setLayer('human');
    if (e.key === '4') setLayer('both');
    if (e.key === '5') setLayer('ai');
  });
}

function graphSize() {
  const r = d3.select('#graph').node().getBoundingClientRect();
  return { width: r.width || (window.innerWidth - 150), height: r.height || (window.innerHeight - 66) };
}

function renderGraph(nodes, links) {
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();
  const { width, height } = graphSize();

  // Defs
  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id','arr').attr('viewBox','0 -4 8 8').attr('refX',12).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-3L7,0L0,3').attr('fill','#445');
  defs.append('marker')
    .attr('id','arr-ai').attr('viewBox','0 -4 8 8').attr('refX',12).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-3L7,0L0,3').attr('fill','#2a5a50');

  const container = svg.append('g');

  // Zoom
  zoomBehavior = d3.zoom().scaleExtent([0.15,5])
    .on('zoom', e => {
      container.attr('transform', e.transform);
      if (labelEls) {
        const k = e.transform.k;
        labelEls.attr('fill-opacity', d => {
          if (focusedIds.size > 0) return focusedIds.has(d.id) ? 1 : 0.04;
          if (labelVisible(d)) return 0.9;
          return k > 1.2 ? Math.min((k - 1.2) * 1.5, 0.75) : 0;
        });
      }
    });
  svg.call(zoomBehavior);

  svg.on('click', e => {
    if (e.target === svg.node()) { closePanel(); clearFocus(); }
  });

  // Links
  linkEls = container.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d => {
      if (d.type==='quote-resonance') return '#3a3520';
      if (d.type==='tes-reference') return '#2a3040';
      if (d.type==='ai-dependency') return '#1a4a40';
      if (d.type==='ai-supports') return '#2a4a50';
      if (d.type==='ai-interface') return '#3a3a50';
      return '#3a4560';
    })
    .attr('stroke-width', d => {
      if (d.type==='tes-reference' || d.type==='quote-resonance') return 0.5;
      if (d.type==='ai-interface') return 0.5;
      return 1;
    })
    .attr('stroke-opacity', d => {
      if (d.type==='quote-resonance') return 0.12;
      if (d.type==='tes-reference') return 0.3;
      if (d.type==='ai-dependency') return 0.5;
      if (d.type==='ai-supports') return 0.5;
      if (d.type==='ai-interface') return 0.35;
      return 0.5;
    })
    .attr('marker-end', d => {
      if (d.type==='dependency') return 'url(#arr)';
      if (d.type==='ai-dependency' || d.type==='ai-supports') return 'url(#arr-ai)';
      return null;
    });

  // Nodes
  nodeEls = container.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor','pointer')
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) simulation.alphaTarget(0.1).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; })
    )
    .on('click', (e,d) => { e.stopPropagation(); if(mode==='focus') setFocus(d); showPanel(d); })
    .on('mouseenter', (e,d) => {
      showTooltip(d,e);
      labelEls.filter(ld => ld.id === d.id).attr('fill-opacity', 0.9);
    })
    .on('mouseleave', (e,d) => {
      hideTooltip();
      if (focusedIds.size === 0 && !labelVisible(d)) {
        labelEls.filter(ld => ld.id === d.id).attr('fill-opacity', 0);
      }
    });

  nodeEls.each(function(d) {
    const g = d3.select(this); const r = nRadius(d);
    if (d.type==='fp' || d.type==='ap') {
      g.append('path').attr('d',`M0,${-r} L${r},0 L0,${r} L${-r},0 Z`)
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d)).attr('stroke-width',1.5).attr('stroke-opacity',0.8);
    } else if (d.type==='da') {
      g.append('rect').attr('x',-r).attr('y',-r).attr('width',r*2).attr('height',r*2).attr('rx',2)
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d)).attr('stroke-width',1.5).attr('stroke-opacity',0.8);
    } else if (d.type==='tool') {
      g.append('rect').attr('x',-r).attr('y',-r).attr('width',r*2).attr('height',r*2).attr('rx',3)
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d)).attr('stroke-width',1.5).attr('stroke-opacity',0.8);
    } else if (d.type==='sop') {
      g.append('path').attr('d', hexPath(r))
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d)).attr('stroke-width',1.5).attr('stroke-opacity',0.8);
    } else if (d.type==='skl') {
      g.append('path').attr('d', pentPath(r))
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d)).attr('stroke-width',1.5).attr('stroke-opacity',0.8);
    } else if (d.type==='ifc') {
      const tr = r;
      g.append('path').attr('d',`M0,${-tr} L${tr},${tr*0.7} L${-tr},${tr*0.7} Z`)
        .attr('fill', COLORS.ai_shared).attr('fill-opacity',nOpacity(d)).attr('stroke', COLORS.ai_shared).attr('stroke-width',0.5).attr('stroke-opacity',0.8);
    } else if (d.type==='quote') {
      g.append('circle').attr('r',r)
        .attr('fill','none').attr('stroke',nColor(d)).attr('stroke-width',1).attr('stroke-opacity',nOpacity(d));
    } else {
      g.append('circle').attr('r',r)
        .attr('fill',nColor(d)).attr('fill-opacity',nOpacity(d)).attr('stroke',nColor(d))
        .attr('stroke-width',d.type==='tes'?0.5:1.5).attr('stroke-opacity',0.8);
    }
  });

  nodeEls.filter(d => d.status==='Hypothesized').select('circle,path,rect').classed('pulse',true);

  // Labels
  function labelText(d) {
    if (d.type==='quote') return d.author || d.id;
    const name = d.title || d.concept || d.id;
    const max = (d.type==='fp'||d.type==='ap') ? 22 : (d.type==='da'||d.type==='sop') ? 18 : 16;
    return name.length > max ? name.slice(0, max-1) + '\u2026' : name;
  }
  function labelVisible(d) {
    if (d.type==='tes' || d.type==='quote' || d.type==='ifc') return false;
    if (d.type==='fp' || d.type==='da' || d.type==='ap' || d.type==='sop') return true;
    return d.fanOut >= 2;
  }
  // Expose for hover/focus use outside renderGraph
  window._labelVisible = labelVisible;

  labelEls = container.append('g').selectAll('text')
    .data(nodes.filter(d => d.type!=='tes' && d.type!=='ifc')).join('text')
    .text(d => labelText(d))
    .attr('font-size', d => (d.type==='fp'||d.type==='ap') ? 10 : (d.type==='da'||d.type==='sop') ? 9 : d.type==='quote' ? 7 : 8)
    .attr('fill', d => nColor(d))
    .attr('fill-opacity', d => labelVisible(d) ? 0.9 : 0)
    .attr('text-anchor','middle')
    .attr('dy', d => -nRadius(d)-5)
    .attr('pointer-events','none')
    .attr('font-family',"'Segoe UI', system-ui, sans-serif")
    .attr('font-weight', d => (d.type==='fp'||d.type==='ap') ? 600 : 400);

  // Force
  const cx = width/2, cy = height/2;
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id)
      .distance(d => {
        if (d.type==='quote-resonance') return 100;
        if (d.type==='tes-reference') return 80;
        if (d.type==='ai-supports') return 40;
        if (d.type==='ai-interface') return 70;
        return 50;
      })
      .strength(d => {
        if (d.type==='quote-resonance') return 0.04;
        if (d.type==='tes-reference') return 0.1;
        if (d.type==='ai-supports') return 0.4;
        if (d.type==='ai-interface') return 0.15;
        return 0.3;
      }))
    .force('charge', d3.forceManyBody().strength(d => {
      if (d.type==='quote') return -15;
      if (d.type==='tes' || d.type==='ifc') return -30;
      return -120 - d.fanOut*20;
    }))
    .force('center', d3.forceCenter(cx,cy).strength(0.05))
    .force('cx', d3.forceX(d => cx + getClusterPos(d).x).strength(d => (d.type==='quote'||d.type==='ifc') ? 0.04 : 0.07))
    .force('cy', d3.forceY(d => cy + getClusterPos(d).y).strength(d => (d.type==='quote'||d.type==='ifc') ? 0.04 : 0.07))
    .force('collide', d3.forceCollide().radius(d => {
      if (d.type==='quote') return 3;
      if (d.type==='tes' || d.type==='ifc') return 5;
      return 8 + Math.sqrt(d.fanOut)*3;
    }).strength(0.7))
    .alphaDecay(0.02).velocityDecay(0.3)
    .on('tick', () => {
      linkEls.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeEls.attr('transform',d=>`translate(${d.x},${d.y})`);
      labelEls.attr('x',d=>d.x).attr('y',d=>d.y-nRadius(d)-4);
    });
}

// --- Focus Mode ---------------------------------------------------------------
function setFocus(node) {
  focusedIds = getChain(node.id);
  applyFocusStyles();
}

function clearFocus() {
  focusedIds = new Set();
  applyFocusStyles();
}

function getChain(id) {
  const ids = new Set([id]);
  const { links } = graphData;
  const depTypes = new Set(['dependency','ai-dependency','ai-supports']);
  // Ancestors
  let q = [id];
  while (q.length) {
    const c = q.shift();
    for (const l of links) {
      const s = typeof l.source==='string'?l.source:l.source.id;
      const t = typeof l.target==='string'?l.target:l.target.id;
      if (t===c && !ids.has(s) && depTypes.has(l.type)) { ids.add(s); q.push(s); }
    }
  }
  // Descendants
  q = [id];
  while (q.length) {
    const c = q.shift();
    for (const l of links) {
      const s = typeof l.source==='string'?l.source:l.source.id;
      const t = typeof l.target==='string'?l.target:l.target.id;
      if (s===c && !ids.has(t) && depTypes.has(l.type)) { ids.add(t); q.push(t); }
    }
  }
  // Include quotes linked to any node in the chain (1-hop)
  for (const l of links) {
    if (l.type==='quote-resonance') {
      const s = typeof l.source==='string'?l.source:l.source.id;
      const t = typeof l.target==='string'?l.target:l.target.id;
      if (ids.has(s)) ids.add(t);
    }
  }
  return ids;
}

function labelVisible(d) {
  return window._labelVisible ? window._labelVisible(d) : false;
}

function applyFocusStyles() {
  const f = focusedIds;
  const active = f.size > 0;
  nodeEls.transition().duration(300).style('opacity', d => active ? (f.has(d.id)?1:0.06) : 1);
  linkEls.transition().duration(300).attr('stroke-opacity', d => {
    if (!active) {
      if (d.type==='quote-resonance') return 0.12;
      if (d.type==='tes-reference') return 0.3;
      if (d.type==='ai-dependency') return 0.5;
      if (d.type==='ai-supports') return 0.5;
      if (d.type==='ai-interface') return 0.35;
      return 0.5;
    }
    const s=typeof d.source==='string'?d.source:d.source.id;
    const t=typeof d.target==='string'?d.target:d.target.id;
    if (!(f.has(s)&&f.has(t))) return 0.02;
    return d.type==='quote-resonance'?0.35:0.8;
  });
  labelEls.transition().duration(300).attr('fill-opacity', d => {
    if (!active) return labelVisible(d)?0.9:(d.type==='quote'||d.type==='tes'||d.type==='ifc')?0:0.45;
    return f.has(d.id)?1:0.04;
  });
}

function renderClaimQuotes(claim) {
  const seen = new Set();
  const quotes = [];
  for (const depId of (claim.dependencies || [])) {
    for (const q of (quotesByNode.get(depId) || [])) {
      if (!seen.has(q.id)) { seen.add(q.id); quotes.push(q); }
    }
  }
  if (quotes.length === 0) return '';
  const shown = quotes.sort((a,b) => a.text.length - b.text.length).slice(0, 3);
  return `<div class="p-section"><div class="s-label">Related Quotes</div>
    ${shown.map(q => `<div class="quote-item" onclick="navTo('${q.id}')" style="cursor:pointer;padding:6px 10px;margin-bottom:6px;border-left:2px solid #a08850;font-size:11px;line-height:1.5">
      <span style="color:#a08850;font-style:italic">\u201C${q.text.length>100?q.text.slice(0,97)+'...':q.text}\u201D</span>
      <br><span style="color:#807050;font-size:10px">\u2014 ${q.author}</span>
    </div>`).join('')}
  </div>`;
}

function renderQuotesSection(nodeId) {
  const quotes = quotesByNode.get(nodeId);
  if (!quotes || quotes.length === 0) return '';
  return `<div class="p-section"><div class="s-label">Resonant Quotes</div>
    ${quotes.map(q => `<div class="quote-item" onclick="navTo('${q.id}')" style="cursor:pointer;padding:6px 10px;margin-bottom:6px;border-left:2px solid #a08850;font-size:11px;line-height:1.5">
      <span style="color:#a08850;font-style:italic">\u201C${q.text.length>100?q.text.slice(0,97)+'...':q.text}\u201D</span>
      <br><span style="color:#807050;font-size:10px">\u2014 ${q.author}</span>
    </div>`).join('')}
  </div>`;
}

function idEditHtml(originalId, color) {
  const current = displayId(originalId);
  const isRenamed = idRenames[originalId];
  return `<div class="p-id" style="color:${color}">
    <input class="p-id-edit" style="color:${color}" value="${current}" data-original="${originalId}"
      onblur="commitIdRename(this)" onkeydown="if(event.key==='Enter')this.blur()">
    ${isRenamed ? `<span class="p-id-reset" onclick="resetIdRename('${originalId}')" title="Reset to ${originalId}">reset</span>` : ''}
  </div>`;
}

function commitIdRename(input) {
  const originalId = input.dataset.original;
  const newName = input.value.trim();
  saveRename(originalId, newName);
  refreshLabels();
  const wrapper = input.parentElement;
  const existing = wrapper.querySelector('.p-id-reset');
  if (idRenames[originalId] && !existing) {
    const span = document.createElement('span');
    span.className = 'p-id-reset';
    span.title = 'Reset to ' + originalId;
    span.onclick = () => resetIdRename(originalId);
    span.textContent = 'reset';
    wrapper.appendChild(span);
  } else if (!idRenames[originalId] && existing) {
    existing.remove();
  }
}

function resetIdRename(originalId) {
  delete idRenames[originalId];
  localStorage.setItem('kb-id-renames', JSON.stringify(idRenames));
  const node = graphData.nodes.find(n => n.id === originalId);
  if (node) showPanel(node);
  refreshLabels();
}

function refreshLabels() {
  if (!labelEls) return;
  labelEls.text(d => {
    if (d.type === 'quote') return d.author || d.id;
    const name = d.title || d.concept || displayId(d.id);
    const max = (d.type==='fp'||d.type==='ap') ? 22 : (d.type==='da'||d.type==='sop') ? 18 : 16;
    return name.length > max ? name.slice(0, max-1) + '\u2026' : name;
  });
}

function closePanel() { document.getElementById('panel').classList.remove('open'); }

function navTo(id) {
  const node = graphData.nodes.find(n => n.id === id);
  if (node) { showPanel(node); if (mode==='focus') setFocus(node); }
}

function fmtBullets(text) {
  return (text||'').split('\n').filter(l=>l.trim()).map(l=>`<div class="bullet">${l.replace(/^[-\d.]+\s*/,'')}</div>`).join('');
}

// --- Tooltip ------------------------------------------------------------------
function showTooltip(n, e) {
  const t = document.getElementById('tooltip');
  const c = nColor(n);
  let h;
  if (n.type==='quote') {
    const snippet = n.text.length > 120 ? n.text.slice(0,117) + '...' : n.text;
    h = `<span style="color:${c};font-style:italic">\u201C${snippet}\u201D</span>`;
    h += `<br><span style="color:${c};font-weight:600">\u2014 ${n.author}</span>`;
    h += `<br><span class="tt-meta">${n.tags.join(' \u00b7 ')}</span>`;
  } else {
    const name = n.title || n.concept || n.id;
    h = `<span style="color:${c};font-weight:600">${name}</span>`;
    h += `<br><span class="tt-meta">${displayId(n.id)}</span>`;
    if (n.type==='claim') h += `<span class="tt-meta"> \u00b7 ${DOMAIN_NAMES[n.domain]||n.domain} \u00b7 ${n.status}</span>`;
    else if (n.type==='fp') h += `<span class="tt-meta"> \u00b7 First Principle</span>`;
    else if (n.type==='da') h += `<span class="tt-meta"> \u00b7 ${DOMAIN_NAMES[n.domain]||n.domain} Axiom \u00b7 ${n.status}</span>`;
    else if (n.type==='tes') h += `<span class="tt-meta"> \u00b7 TES Concept</span>`;
    else if (n.type==='ap') h += `<span class="tt-meta"> \u00b7 Agent Principle</span>`;
    else if (n.type==='sop') h += `<span class="tt-meta"> \u00b7 SOP \u00b7 ${n.owner||''} \u00b7 ${n.status||''}</span>`;
    else if (n.type==='skl') h += `<span class="tt-meta"> \u00b7 Skill \u00b7 ${n.owner||''} \u00b7 ${n.proficiency||''}</span>`;
    else if (n.type==='tool') h += `<span class="tt-meta"> \u00b7 ${n.category||'Tool'} \u00b7 Used by: ${n.usedBy||''}</span>`;
    else if (n.type==='ifc') h += `<span class="tt-meta"> \u00b7 ${n.ifcSource||''} \u2192 ${n.ifcTarget||''}</span>`;
    if (n.fanOut) h += `<br><span class="tt-meta">${n.fanOut} dependent(s)</span>`;
  }
  t.innerHTML = h;
  t.style.display = 'block';
  t.style.left = (e.clientX+12)+'px';
  t.style.top = (e.clientY-10)+'px';
}

function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

// --- Toolbar ------------------------------------------------------------------
function buildToolbar() {
  const tb = document.getElementById('toolbar');
  tb.innerHTML = `
    <div class="tb-section">
      <button class="mode-btn active" onclick="setMode('survey')">Survey</button>
      <button class="mode-btn" onclick="setMode('focus')">Focus</button>
    </div>
    <div class="tb-section">
      <button class="layer-btn" onclick="setLayer('human')">Human</button>
      <button class="layer-btn active" onclick="setLayer('both')">Both</button>
      <button class="layer-btn" onclick="setLayer('ai')">AI</button>
    </div>
    <div class="tb-section search">
      <input type="text" class="search-input" placeholder="Search ideas..." oninput="onSearch(this.value)">
    </div>
    <div class="tb-section"><button class="act-btn" onclick="fitAll()">Fit</button></div>
  `;

  buildFilterPanel();
}

function buildFilterPanel() {
  const fp = document.getElementById('filter-panel');
  const humanDomains = [
    ['foundation','Foundation'], ['EPI','Epistemology'], ['ECDO','ECDO Theory'], ['TF','Thermofluidic Finance'],
    ['DSL','Dynamical Systems'], ['PED','Pedagogy'], ['ARCH','Archaeoastronomy'], ['tes','TES Concepts'], ['quotes','Quotes']
  ];
  const aiDomains = [
    ['ai_foundation','Agent Principles'], ['CE','CE Agent'], ['CD','CD Agent'], ['PM','PM Agent'],
    ['RA','RA Agent'], ['SA','SA Agent'], ['TA','TA Agent'], ['ai_shared','Shared']
  ];

  let html = '';
  if (layerMode !== 'ai') {
    html += `<div class="filter-heading">Human</div>`;
    html += humanDomains.map(([d,l])=>`<label class="domain-filter" style="color:${COLORS[d]}">
      <input type="checkbox" checked onchange="toggleDomain('${d}',this.checked)">
      <span class="fdot" style="background:${COLORS[d]}"></span>${l}</label>`).join('');
  }
  if (layerMode !== 'human') {
    html += `<div class="filter-heading" style="${layerMode!=='ai'?'margin-top:8px':''}">AI</div>`;
    html += aiDomains.map(([d,l])=>`<label class="domain-filter" style="color:${COLORS[d]}">
      <input type="checkbox" checked onchange="toggleDomain('${d}',this.checked)">
      <span class="fdot" style="background:${COLORS[d]}"></span>${l}</label>`).join('');
  }
  fp.innerHTML = html;
}

function setMode(m) {
  mode = m;
  if (m==='survey') clearFocus();
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase()===m));
}

function setLayer(m) {
  layerMode = m;
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase()===m));
  // Re-render the filter sidebar
  buildFilterPanel();
  // Stop existing simulation
  if (simulation) simulation.stop();
  // Clear and re-render graph
  const vis = getVisibleData();
  renderGraph(vis.nodes, vis.links);
  buildStats();
  setTimeout(fitAll, 800);
}

function toggleDomain(domain, visible) {
  const hidden = !visible;
  nodeEls.style('display', d => (d.domain===domain && hidden) ? 'none' : null);
  labelEls.style('display', d => (d.domain===domain && hidden) ? 'none' : null);
  linkEls.style('display', d => {
    const sd = (typeof d.source==='object'?d.source:graphData.nodes.find(n=>n.id===d.source))?.domain;
    const td = (typeof d.target==='object'?d.target:graphData.nodes.find(n=>n.id===d.target))?.domain;
    return ((sd===domain||td===domain) && hidden) ? 'none' : null;
  });
}

function onSearch(q) {
  if (!q) {
    nodeEls.transition().duration(200).style('opacity',1);
    labelEls.transition().duration(200).attr('fill-opacity', d => labelVisible(d) ? 0.9 : 0);
    clearFocus(); return;
  }
  const ql = q.toLowerCase();
  const isMatch = d => d.id.toLowerCase().includes(ql) || (d.title||d.concept||'').toLowerCase().includes(ql) ||
    (d.text||'').toLowerCase().includes(ql) || (d.author||'').toLowerCase().includes(ql) ||
    (d.description||'').toLowerCase().includes(ql);
  nodeEls.transition().duration(200).style('opacity', d => isMatch(d) ? 1 : 0.08);
  labelEls.transition().duration(200).attr('fill-opacity', d => isMatch(d) ? 0.9 : 0.04);
  const matches = graphData.nodes.filter(isMatch);
  if (matches.length===1) { showPanel(matches[0]); if(mode==='focus') setFocus(matches[0]); }
}

// --- Fit All ------------------------------------------------------------------
function fitAll() {
  const svg = d3.select('#graph');
  const { width, height } = graphSize();
  const vis = getVisibleData();
  const ns = vis.nodes;
  if (!ns.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const d of ns) {
    if (d.x===undefined) continue;
    if(d.x<x0)x0=d.x; if(d.y<y0)y0=d.y; if(d.x>x1)x1=d.x; if(d.y>y1)y1=d.y;
  }
  if (!isFinite(x0)) return;
  const pad=60, dx=x1-x0+pad*2, dy=y1-y0+pad*2;
  const scale = Math.min(width/dx, height/dy, 2);
  const tx = width/2-(x0+x1)/2*scale, ty = height/2-(y0+y1)/2*scale;
  svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx,ty).scale(scale));
}

// --- Stats --------------------------------------------------------------------
function buildStats() {
  const s = graphData.stats;
  const vis = getVisibleData();
  let html = `
    <span>${vis.nodes.length} nodes</span><span>${vis.links.length} edges</span><span class="sep">|</span>
    <span>${s.claims} claims</span>
    <span style="color:var(--accent-green)">${s.established} established</span>
    <span style="color:var(--accent-amber)">${s.hypothesized} hypothesized</span>
    <span style="color:var(--accent-red)">${s.speculative} speculative</span>
    <span class="sep">|</span><span style="color:#a08850">${s.quotes||0} quotes</span>`;
  if (s.sops || s.skills || s.tools) {
    html += `<span class="sep">|</span>
      <span style="color:#00d4aa">${s.sops||0} SOPs</span>
      <span style="color:#77aaff">${s.skills||0} skills</span>
      <span style="color:#7a8a9a">${s.tools||0} tools</span>`;
  }
  html += `<span class="sep">|</span>
    <span>Generated ${new Date(graphData.generated).toLocaleDateString()}</span>`;
  document.getElementById('stats').innerHTML = html;
}

// --- Boot ---------------------------------------------------------------------
init().catch(err => {
  document.body.innerHTML = `<div style="color:var(--accent-red);padding:2em;font-family:monospace">
    Failed to load: ${err.message}</div>`;
});
</script>
</body>
