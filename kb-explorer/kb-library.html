<!doctype html>
<meta charset="utf-8"><title>KB — the library</title>
<style>
  :root{
    --ground:#0b0d11; --ink:#e6edf3; --dim:#8b949e; --rule:#20262e;
    --author:#f0b72f; --ex0:#58d3f7; --ex1:#c792ea; --anon:#9fb0c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);
    font:13px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
  .panel{position:fixed;z-index:3;background:rgba(11,13,17,.82);
    border:1px solid var(--rule);border-radius:8px;padding:11px 13px;
    backdrop-filter:blur(6px)}
  #head{top:14px;left:14px;max-width:330px}
  #head h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:.2px}
  #head p{margin:0;color:var(--dim);font-size:11.5px}
  #legend{bottom:14px;left:14px}
  #status{top:14px;right:14px;min-width:210px;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;gap:7px;margin-top:5px}
  .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .k{color:var(--dim)}
  .v{margin-left:auto;font-weight:600}
  #now{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:11.5px;min-height:17px}
  .live{color:#3fb950} .cold{color:#f85149}
  #log{position:fixed;z-index:3;bottom:14px;right:14px;width:280px;max-height:34vh;
    overflow:hidden;display:flex;flex-direction:column-reverse;gap:2px;
    font-size:11.5px;font-variant-numeric:tabular-nums;pointer-events:none}
  .le{background:rgba(11,13,17,.8);border:1px solid var(--rule);border-radius:5px;
    padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .le b{font-weight:600}
  label{cursor:pointer;user-select:none}
  select,button.rp{font:11.5px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(24,32,44,.9);border:1px solid var(--rule);border-radius:4px;
    padding:3px 6px}
  button.rp{cursor:pointer}
  button.rp:disabled{opacity:.45;cursor:default}
  button.rp:hover:not(:disabled){border-color:var(--anon)}
  #tip{position:fixed;z-index:4;display:none;pointer-events:none;
    background:rgba(11,13,17,.95);border:1px solid var(--rule);border-radius:6px;
    padding:6px 9px;font-size:11.5px;max-width:250px}
</style>

<canvas id="c"></canvas>

<div class="panel" id="head">
  <h1>The library</h1>
  <p>Floors are epistemic strata, shelves are dependency tiers, books are
     entries. A book lights when an agent opens it.</p>
  <div class="row" style="margin-top:8px">
    <label><input type="checkbox" id="edges" checked> relations</label>
    <label><input type="checkbox" id="spin"> turn</label>
    <label><input type="checkbox" id="sectors" checked> sectors</label>
    <label><input type="checkbox" id="canopy" checked> disciplines</label>
    <label><input type="checkbox" id="districts" checked> projects</label>
    <label><input type="checkbox" id="apps" checked> applications</label>
    <label><input type="checkbox" id="demo"> demo</label>
  </div>
  <div class="row" style="margin-top:7px">
    <select id="field"><option value="">no field selected</option></select>
    <select id="district"><option value="">all projects</option></select>
    <select id="sessions"><option value="">loading history…</option></select>
    <button class="rp" id="play" disabled>replay</button>
  </div>
</div>

<div class="panel" id="status">
  <div class="row"><span class="k">trace</span><span class="v" id="conn">…</span></div>
  <div class="row"><span class="k">books opened</span><span class="v" id="nreads">0</span></div>
  <div class="row"><span class="k">edits landed</span><span class="v" id="nedits">0</span></div>
  <div id="now">idle — the loop is not running</div>
  <div id="axis" style="color:var(--dim);font-size:11.5px;margin-top:4px"></div>
</div>

<div class="panel" id="legend">
  <div class="row"><span class="sw" style="background:var(--author)"></span>
    <span class="k">eng</span><span style="color:var(--dim)">— author, drafts the change</span></div>
  <div class="row"><span class="sw" style="background:var(--ex0)"></span>
    <span class="k">sci</span><span style="color:var(--dim)">— first critic</span></div>
  <div class="row"><span class="sw" style="background:var(--ex1)"></span>
    <span class="k">web</span><span style="color:var(--dim)">— second critic</span></div>
  <div class="row"><span class="sw" style="background:var(--anon)"></span>
    <span class="k">unattributed</span><span style="color:var(--dim)">— read outside a run</span></div>
</div>

<div id="log"></div>
<div id="tip"></div>

// ── camera: lifted from kb3d so the two views are the same building ─────────
let rotX = -0.94, rotY = 0.52, zoom = 0.72, dragging = false, lx = 0, ly = 0;
const RING = 30, LIFT = 172, R_OUT = 74 + 7.4 * RING;

// The angular-centroid placement lived here and was REMOVED on 2026-09-12.
// Keeping the note because the idea is attractive and will be proposed again:
// it put 13 of 21 multi-tag entries into a wedge they were not tagged with,
// because position is single-valued and Subjects are not. Affiliation lines to
// the canopy replaced it. Do not bring it back.

// A book is SHELVED in one genre and CATALOGUED in several - that is how a real
// library resolves this, and it is why the wedges can be genres without lying.
//
//   shelf     = primary genre = sub[0]        single-valued, so placeable
//   catalogue = every other tag              drawn as cross-reference lines
//
// The earlier attempt placed a book at the angular CENTROID of all its genres,
// which put 13 of 21 multi-genre entries into a wedge they were not tagged with
// (five PED+PHYS lecture SOPs landed in BIO). Averaging positions is not how a
// catalogue works: a librarian picks a shelf and writes cross-references.
const primaryGenre = n => {
  for (const s of (n.sub || [])) {
    const v = SUBJECT_ANGLES[String(s).toUpperCase()];
    if (v !== null && v !== undefined) return String(s).toUpperCase();
  }
  return null;
};

function place(n, i) {
  // height = epistemic stratum, radius = dependency tier, angle = PRIMARY GENRE.
  // Each axis still carries exactly one single-valued fact; the multi-valued
  // part left position entirely and became lines.
  const j = ((i * 2654435761) % 1000) / 1000;
  const g = primaryGenre(n);

  let deg, rad;
  if (!g) {
    // Uncatalogued. The centre is the one place no genre claims - an acquisition
    // not yet shelved. It drains as the classification loop works.
    deg = (i * 37) % 360;
    rad = 10 + j * 46;
  } else {
    deg = SUBJECT_ANGLES[g];
    rad = 74 + n.r * RING + j * 30;
  }

  const a = deg * Math.PI / 180;
  return { x: Math.cos(a + (j - .5) * .22) * rad, y: Math.sin(a + (j - .5) * .22) * rad,
           z: (5 - n.z) * LIFT, j };
}


// Disciplines are the default axis. Domains were the default until 2026-09-12,
// which meant the building's wedges were Cole's PROJECT namespaces (TF, DSL,
// ECDO) sitting alongside genuine fields (PHYS, PED, BIO) - the same conflation
// the Subjects vocabulary exists to undo. A project is a DISTRICT drawn over the
// wedges it spans, never a wedge. Unchecking the box restores the old view.
const BY_SUBJECT = true;    // wedges are ALWAYS genres now; projects never get one
let P = D.nodes.map(place);
function relayout() { P = D.nodes.map(place); }

// index by entry id so a read can find its book
// n.i is the entry id (SOP-ENG-002). n.l is the LAYER (shared/ai/human), not
// a label — there is no display name in the payload, the id IS the name.
// (No backticks in here: this whole page is a template literal.)
const BY_ID = {};
D.nodes.forEach((n, k) => { if (n.i) BY_ID[String(n.i).toUpperCase()] = k; });

function project(p, w, h) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
  const x1 = p.x * cy - p.y * sy, y1 = p.x * sy + p.y * cy;
  const y2 = y1 * cx - p.z * sx, z2 = y1 * sx + p.z * cx;
  const s = zoom * 1.05;
  return { x: w / 2 + x1 * s, y: h / 2 + (y2 - 2.5 * LIFT * Math.sin(-rotX)) * s * .86, depth: z2 };
}

// ── live state ──────────────────────────────────────────────────────────────
// A read is an EVENT with a decay, not a state. Each one owns its own clock so
// several can burn at once without interfering — which is the whole point when
// three agents read in parallel.
const flares = [];    // {i, t0, thread}
const arcs = [];      // {a, b, t0, thread}  attention travelling between books
const newEdges = [];  // {a, b, t0}          an edit landing
const lastByThread = {};
let nReads = 0, nEdits = 0;
const FLARE_MS = 2600, ARC_MS = 1800, EDGE_MS = 1400;

function logLine(html) {
  const el = document.createElement('div');
  el.className = 'le'; el.innerHTML = html;
  const box = document.getElementById('log');
  box.appendChild(el);
  while (box.children.length > 14) box.removeChild(box.firstChild);
}

function openBook(id, thread, at) {
  const i = BY_ID[String(id).toUpperCase()];
  const col = THREAD_COLOR[thread] || THREAD_COLOR.anon;
  nReads++;
  document.getElementById('nreads').textContent = nReads;
  const hhmm = new Date(at).toLocaleTimeString([], {hour12:false});
  if (i === undefined) {
    // A miss is a real event: the system reached for a book that is not on the
    // shelf. Worth showing, and it has nowhere to flare.
    logLine('<span style="color:#f85149">' + hhmm + ' ✕ ' + id + '</span> not shelved');
    return;
  }
  flares.push({ i, t0: performance.now(), thread });
  const prev = lastByThread[thread];
  if (prev !== undefined && prev !== i) arcs.push({ a: prev, b: i, t0: performance.now(), thread });
  lastByThread[thread] = i;
  const role = THREAD_ROLE[thread] ? ' (' + THREAD_ROLE[thread] + ')' : '';
  logLine('<span style="color:' + col + '">' + hhmm + ' ▸ <b>' + id + '</b></span> '
    + '<span style="color:#8b949e">' + (D.STRATUM_LABEL[D.nodes[i].z] || '').split(/[^a-zA-Z ]/)[0].trim()
    + (thread && thread !== 'anon' ? '  · ' + thread + role : '') + '</span>');
}

function landEdit(fromId, toId) {
  const a = BY_ID[String(fromId).toUpperCase()], b = BY_ID[String(toId).toUpperCase()];
  nEdits++;
  document.getElementById('nedits').textContent = nEdits;
  logLine('<span style="color:#3fb950">✚ <b>' + fromId + '</b> → ' + toId + '</span>');
  if (a === undefined || b === undefined) return;
  newEdges.push({ a, b, t0: performance.now() });
  D.links.push([a, b]);
}

// ── domain sectors ─────────────────────────────────────────────────
// Angle already IS domain — make-kb3d sites every node by DOMAIN_ANGLES. These
// wedges do not move anything; they draw the division that was always there, so
// the cylinder reads as a building with wings rather than one round room.
//
// ⚠ Sectors are DOMAIN (which shelf an entry lives on), not SUBJECT (what it is
// about). The two vocabularies nearly coincide — PHYS, ENG, PED, DSL, TF, ECDO,
// BIO, PHIL appear in both — which makes them easy to conflate, but a tool on
// the ai_shared shelf can be ABOUT physics. Subjects cut across these wedges by
// design and must never be drawn as them.
const DOMAIN_TINT = {
  PHIL:'#bc8cff', PHYS:'#58a6ff', DSL:'#79c0ff', TF:'#56d364', PED:'#f0b72f',
  ai_shared:'#8b949e', ENG:'#d29922', ECDO:'#db6d28', BIO:'#3fb950',
};
// Halfway to each neighbour. The spacing is a uniform 40 degrees, so a 40-wide
// wedge tiles the disc with no gap and no overlap.
const SECTOR_HALF = 20 * Math.PI / 180;
const SUBJECT_TINT = {
  RHET:'#e9d5ff', PHIL:'#bc8cff', HIST:'#d8b4fe', EPI:'#a78bfa', MATH:'#c084fc', PHYS:'#58a6ff', ASTRO:'#7dd3fc',
  GEO:'#34d399', BIO:'#3fb950', ANTH:'#a3a380', SOC:'#f0b72f', PDGY:'#fbbf24',
  CS:'#8b949e', ENGR:'#d29922', OPS:'#db6d28',
};
// The wedges are the genres of the library. A project is a COLLECTION of books
// scattered across genres, never a genre itself, so DOMAIN_SECTORS is gone.
const SECTORS = Object.entries(SUBJECT_ANGLES)
  .filter(([, v]) => v !== null && v !== undefined)
  .map(([k, v]) => ({ k, a: v * Math.PI / 180 }));

function sectorPath(w, h, z, s, rIn, rOut) {
  const N = 10;
  X.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = s.a - SECTOR_HALF + (2 * SECTOR_HALF) * i / N;
    const q = project({ x: Math.cos(a) * rOut, y: Math.sin(a) * rOut, z: (5 - z) * LIFT }, w, h);
    i ? X.lineTo(q.x, q.y) : X.moveTo(q.x, q.y);
  }
  for (let i = N; i >= 0; i--) {
    const a = s.a - SECTOR_HALF + (2 * SECTOR_HALF) * i / N;
    const q = project({ x: Math.cos(a) * rIn, y: Math.sin(a) * rIn, z: (5 - z) * LIFT }, w, h);
    X.lineTo(q.x, q.y);
  }
  X.closePath();
}

function drawSectors(w, h, z) {
  if (!document.getElementById('sectors').checked) return;
  for (const s of SECTORS) {
    sectorPath(w, h, z, s, 74, R_OUT);
    X.fillStyle = (BY_SUBJECT ? SUBJECT_TINT : DOMAIN_TINT)[s.k] + '14';          // ~8% — a tint, never a block
    X.fill();
    X.strokeStyle = (BY_SUBJECT ? SUBJECT_TINT : DOMAIN_TINT)[s.k] + '2e';
    X.lineWidth = 1; X.stroke();
  }
}

// Labels go on the BASE floor only, and outside the rim. Repeating nine names on
// seven floors is 63 labels for nine facts; and the base is the one height where
// nothing stands, so a label cannot land in front of a shelf of books.
function drawSectorLabels(w, h) {
  if (!document.getElementById('sectors').checked) return;
  const zBase = STRATA_USED[STRATA_USED.length - 1];
  X.font = '10px Segoe UI';
  for (const s of SECTORS) {
    const q = project({ x: Math.cos(s.a) * (R_OUT + 44), y: Math.sin(s.a) * (R_OUT + 44),
                        z: (5 - zBase) * LIFT }, w, h);
    const txt = BY_SUBJECT ? s.k : (DOMAIN_NAMES[s.k] || s.k);
    const tw = X.measureText(txt).width;
    X.fillStyle = 'rgba(11,13,17,.82)';
    X.fillRect(q.x - tw / 2 - 4, q.y - 8, tw + 8, 14);
    X.fillStyle = (BY_SUBJECT ? SUBJECT_TINT : DOMAIN_TINT)[s.k];
    X.fillText(txt, q.x - tw / 2, q.y + 2);
  }
}

// ── cross-references ───────────────────────────────────────────────

const GENRE_COUNT = {};
for (const n of D.nodes)
  for (const s of (n.sub || [])) {
    const k = String(s).toUpperCase();
    if (SUBJECT_ANGLES[k] != null) GENRE_COUNT[k] = (GENRE_COUNT[k] || 0) + 1;
  }

function drawCrossRefs(w, h, pts) {
  const g = document.getElementById('field').value;
  if (!g || !document.getElementById('canopy').checked) return;
  const col = SUBJECT_TINT[g] || '#8b949e';
  const ga = SUBJECT_ANGLES[g] * Math.PI / 180;

  for (let i = 0; i < D.nodes.length; i++) {
    const n = D.nodes[i];
    const tags = (n.sub || []).map(s => String(s).toUpperCase());
    if (!tags.includes(g)) continue;
    const shelved = primaryGenre(n) === g;
    const p = pts[i];
    if (shelved) {
      // Already on this shelf - mark it, no line needed.
      X.strokeStyle = col; X.lineWidth = 1.6;
      X.beginPath(); X.arc(p.x, p.y, 6, 0, 7); X.stroke();
    } else {
      // Catalogued here but shelved elsewhere: draw the cross-reference to this
      // genre's rim, at the book's own floor.
      const q = project({ x: Math.cos(ga) * R_OUT, y: Math.sin(ga) * R_OUT,
                          z: (5 - n.z) * LIFT }, w, h);
      X.strokeStyle = col + '66'; X.lineWidth = 1;
      X.beginPath(); X.moveTo(p.x, p.y); X.lineTo(q.x, q.y); X.stroke();
      X.fillStyle = col;
      X.beginPath(); X.arc(p.x, p.y, 3.4, 0, 7); X.fill();
    }
  }
  X.lineWidth = 1;
}

// ── application links (PROTOTYPE) ──────────────────────────────────
// A SECOND relation, drawn differently from a genre cross-reference on purpose.
//
//   genre cross-reference  solid line, book -> its genre's rim, same floor
//   application            dashed line, book -> the PROJECT band above
//
// The two answer different questions. A cross-reference says "this also belongs
// to mathematics". An application says "this feeds Thermofluidic Finance" - not
// a field of study at all, which is exactly why forcing it into Subjects kept
// producing tags Cole rejected.
//
// Drawn from Notes prose today. A real Applications: field would replace the
// keyword matching with a declaration.
function drawAppLinks(w, h, pts) {
  if (!document.getElementById('apps').checked) return;
  const zTop = (5 - STRATA_USED[STRATA_USED.length - 1]) * LIFT;
  for (let i = 0; i < D.nodes.length; i++) {
    const projs = APP_LINKS[D.nodes[i].i];
    if (!projs) continue;
    for (const name of projs) {
      const di = DISTRICTS.findIndex(d => d.name === name);
      if (di === -1) continue;
      const dist = DISTRICTS[di];
      const doms = (dist.domains || []).map(k => SECTORS.find(s => s.k === k)).filter(Boolean);
      // Aim at the district's band. For a domain-based district use its first
      // wing; the band is where the project actually lives in this view.
      const a = doms.length ? doms[0].a
        : ((D.DOMAIN_ANGLES[D.nodes[i].d] || 0) * Math.PI / 180);
      const q = project({ x: Math.cos(a) * (R_OUT + 20), y: Math.sin(a) * (R_OUT + 20), z: zTop }, w, h);
      const p = pts[i];
      const col = dist.color || '#8b949e';
      X.setLineDash([3, 4]);
      X.strokeStyle = col + '99'; X.lineWidth = 1.3;
      X.beginPath(); X.moveTo(p.x, p.y); X.lineTo(q.x, q.y); X.stroke();
      X.setLineDash([]);
      X.fillStyle = col;
      X.beginPath(); X.arc(p.x, p.y, 3.6, 0, 7); X.fill();
    }
  }
  X.lineWidth = 1;
}

// ── project districts ────────────────────────────────────────────
// A district is a PROJECT drawn over the domain wedges it occupies. Two kinds:
//
//   domains: ['DSL','PHYS']   a set of wings
//   nodes:   ['PHYS-013',...] named books, scattered
//
// ⚠ A multi-domain district is drawn as ONE ARC PER DOMAIN, never as a single
// sweep between its first and last. PSCPR is PHIL (0deg) and PED (160deg); a
// single sweep would silently annex PHYS, DSL and TF, claiming four wings for a
// project that occupies two. Non-adjacent is the normal case, not the exception.
const DIST_R0 = R_OUT + 10, DIST_R1 = R_OUT + 30;

function districtArc(w, h, z, a0, a1, r0, r1) {
  const N = 12;
  X.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = a0 + (a1 - a0) * i / N;
    const q = project({ x: Math.cos(a) * r1, y: Math.sin(a) * r1, z: (5 - z) * LIFT }, w, h);
    i ? X.lineTo(q.x, q.y) : X.moveTo(q.x, q.y);
  }
  for (let i = N; i >= 0; i--) {
    const a = a0 + (a1 - a0) * i / N;
    const q = project({ x: Math.cos(a) * r0, y: Math.sin(a) * r0, z: (5 - z) * LIFT }, w, h);
    X.lineTo(q.x, q.y);
  }
  X.closePath();
}

// Screen-space convex hull (monotone chain) for node-listed districts. Recomputed
// each frame because the hull of a rotating point cloud is not rotation-invariant.
function hull(pts) {
  if (pts.length < 3) return pts;
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i];
    while (up.length >= 2 && cross(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop();
  return lo.concat(up);
}

function drawDistricts(w, h, pts) {
  if (!document.getElementById('districts').checked) return;
  const focus = document.getElementById('district').value;
  const zBase = STRATA_USED[STRATA_USED.length - 1];
  X.font = '10px Segoe UI';

  DISTRICTS.forEach((dist, di) => {
    const on = focus === '' || focus === String(di);
    const col = dist.color || '#8b949e';
    X.globalAlpha = on ? 1 : 0.22;

    if (dist.domains && dist.domains.length) {
      let label = null;
      for (const dom of dist.domains) {
        const s = SECTORS.find(x => x.k === dom);
        if (!s) continue;                       // a domain with no angle has no wing
        districtArc(w, h, zBase, s.a - SECTOR_HALF, s.a + SECTOR_HALF, DIST_R0, DIST_R1);
        X.fillStyle = col + (on ? '3a' : '18'); X.fill();
        X.strokeStyle = col + (on ? 'cc' : '44'); X.lineWidth = on ? 1.4 : 1; X.stroke();
        if (!label) label = { a: s.a };
      }
      // Named once, at its first wing — a project has one name however many
      // wings it spans. Names only when ONE project is picked: nine labels on a
      // ring of nine bands collide into unreadable mush, and the bands already
      // show the shape. The dropdown is what asks "which one is this?".
      if (label && on && focus !== '') {
        const q = project({ x: Math.cos(label.a) * (DIST_R1 + 30), y: Math.sin(label.a) * (DIST_R1 + 30),
                            z: (5 - zBase) * LIFT }, w, h);
        const tw = X.measureText(dist.name).width;
        X.fillStyle = 'rgba(11,13,17,.9)';
        X.fillRect(q.x - tw / 2 - 5, q.y - 8, tw + 10, 15);
        X.fillStyle = col;
        X.fillText(dist.name, q.x - tw / 2, q.y + 3);
      }
    }

    if (dist.nodes && dist.nodes.length) {
      // A district of named books: ring each one, then draw the region that
      // contains them. Scattered members are the point, so no wedge would do.
      const mem = dist.nodes.map(id => BY_ID[String(id).toUpperCase()])
        .filter(i => i !== undefined).map(i => pts[i]);
      if (!mem.length) return;
      for (const m of mem) {
        X.strokeStyle = col + (on ? 'dd' : '55'); X.lineWidth = 1.4;
        X.beginPath(); X.arc(m.x, m.y, 7, 0, 7); X.stroke();
      }
      const hp = hull(mem);
      if (hp.length >= 3) {
        X.beginPath(); hp.forEach((q, i) => i ? X.lineTo(q.x, q.y) : X.moveTo(q.x, q.y)); X.closePath();
        X.fillStyle = col + (on ? '1e' : '0c'); X.fill();
        X.setLineDash([4, 3]);
        X.strokeStyle = col + (on ? 'aa' : '33'); X.lineWidth = 1.2; X.stroke();
        X.setLineDash([]);
      }
      if (on && focus !== '') {
        const c = mem.reduce((a, m) => ({ x: a.x + m.x / mem.length, y: a.y + m.y / mem.length }), { x: 0, y: 0 });
        const tw = X.measureText(dist.name).width;
        X.fillStyle = 'rgba(11,13,17,.9)';
        X.fillRect(c.x - tw / 2 - 5, c.y - 30, tw + 10, 15);
        X.fillStyle = col;
        X.fillText(dist.name, c.x - tw / 2, c.y - 19);
      }
    }
    X.globalAlpha = 1; X.lineWidth = 1;
  });
}

// ── the draw ────────────────────────────────────────────────────────────────
function floorPath(w, h, z, R) {
  X.beginPath();
  for (let k = 0; k <= 64; k++) {
    const a = k / 64 * Math.PI * 2;
    const q = project({ x: Math.cos(a) * R, y: Math.sin(a) * R, z: (5 - z) * LIFT }, w, h);
    k ? X.lineTo(q.x, q.y) : X.moveTo(q.x, q.y);
  }
  X.closePath();
}

function draw() {
  const now = performance.now();
  const w = C.width = innerWidth, h = C.height = innerHeight;
  X.fillStyle = '#0b0d11'; X.fillRect(0, 0, w, h);
  if (document.getElementById('spin').checked) rotY += .0022;

  const pts = P.map(p => project(p, w, h));

  // how hot is each floor right now — a floor glows under the book being read
  const heat = {};
  for (const f of flares) {
    const k = 1 - (now - f.t0) / FLARE_MS;
    if (k <= 0) continue;
    const z = D.nodes[f.i].z;
    heat[z] = Math.max(heat[z] || 0, k);
  }

  // floors, back to front, so near floors occlude far ones
  const order = STRATA_USED.slice().sort((a, b) =>
    project({x:0,y:0,z:(5-a)*LIFT}, w, h).depth - project({x:0,y:0,z:(5-b)*LIFT}, w, h).depth);

  for (const s of order) {
    const hot = heat[s] || 0;
    // the slab. Filled, faintly, so it reads as a floor rather than a wire ring
    floorPath(w, h, s, R_OUT);
    X.fillStyle = 'rgba(24,32,44,' + (0.50 + hot * 0.30) + ')';
    X.fill();
    // shelves — the dependency tiers, ruled on the floor
    for (let t = 1; t <= 7; t++) {
      floorPath(w, h, s, 74 + t * RING);
      X.strokeStyle = 'rgba(88,166,255,' + (0.045 + hot * 0.05) + ')';
      X.lineWidth = 1; X.stroke();
    }
    drawSectors(w, h, s);
    // rim
    floorPath(w, h, s, R_OUT);
    X.strokeStyle = 'rgba(88,166,255,' + (0.16 + hot * 0.44) + ')';
    X.lineWidth = hot > 0 ? 1.8 : 1.1; X.stroke(); X.lineWidth = 1;

    // Edge label, opaque ink, never sitting on what it labels — house rule.
    const lab = project({ x: -R_OUT - 58, y: 0, z: (5 - s) * LIFT }, w, h);
    X.font = '11px Segoe UI';
    const txt = D.STRATUM_LABEL[s] || ('stratum ' + s), tw = X.measureText(txt).width;
    X.fillStyle = 'rgba(11,13,17,.88)';
    X.fillRect(lab.x - tw - 8, lab.y - 10, tw + 10, 15);
    X.fillStyle = hot > 0.15 ? '#e6edf3' : '#8b949e';
    X.fillText(txt, lab.x - tw - 3, lab.y + 1);
  }

  drawSectorLabels(w, h);

  // relations
  if (document.getElementById('edges').checked) {
    for (const [a, b] of D.links) {
      if (!D.nodes[a] || !D.nodes[b]) continue;
      const crosses = D.nodes[a].z !== D.nodes[b].z;
      // Much fainter than kb3d's. There are 1217 of these and the books have to
      // read through them — relations are the room's structure, not its subject.
      X.strokeStyle = crosses ? 'rgba(240,183,47,.055)' : 'rgba(120,140,170,.022)';
      X.beginPath(); X.moveTo(pts[a].x, pts[a].y); X.lineTo(pts[b].x, pts[b].y); X.stroke();
    }
  }

  // an edit drawing itself in
  for (let k = newEdges.length - 1; k >= 0; k--) {
    const e = newEdges[k], u = (now - e.t0) / EDGE_MS;
    if (u > 1) { newEdges.splice(k, 1); continue; }
    const A = pts[e.a], B = pts[e.b];
    X.strokeStyle = 'rgba(63,185,80,' + (1 - u * 0.4) + ')'; X.lineWidth = 2;
    X.beginPath(); X.moveTo(A.x, A.y);
    X.lineTo(A.x + (B.x - A.x) * Math.min(1, u * 1.4), A.y + (B.y - A.y) * Math.min(1, u * 1.4));
    X.stroke(); X.lineWidth = 1;
  }

  // ── the books ─────────────────────────────────────────────────────────────
  // Upright spines, not dots. Height from fan-in: a much-depended-on entry is a
  // thick volume. Drawn far-to-near.
  const flareOf = {};
  for (const f of flares) {
    const k = 1 - (now - f.t0) / FLARE_MS;
    if (k > (flareOf[f.i]?.k || 0)) flareOf[f.i] = { k, thread: f.thread };
  }

  const ord = D.nodes.map((_, i) => i).sort((a, b) => pts[a].depth - pts[b].depth);
  for (const i of ord) {
    const n = D.nodes[i], p = pts[i], q = P[i];
    const fl = flareOf[i];
    const k = fl ? fl.k : 0;
    // spine height, in world units, then projected so it foreshortens correctly
    const hgt = 16 + Math.min(30, Math.sqrt(n.f || 0) * 9);
    const top = project({ x: q.x, y: q.y, z: q.z + hgt * (1 + k * 0.55) }, w, h);
    const wide = Math.max(1.6, 1.6 + Math.sqrt(n.f || 0) * 0.55) * zoom * 1.4;
    const col = TYPE_COLOR[n.t] || '#8b949e';

    if (k > 0) {
      // the floor rings under a book being opened
      const R = Math.hypot(q.x, q.y);
      const glow = X.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46 * k * zoom * 1.6 + 10);
      const tc = THREAD_COLOR[fl.thread] || THREAD_COLOR.anon;
      glow.addColorStop(0, tc + 'aa'); glow.addColorStop(1, tc + '00');
      X.fillStyle = glow;
      X.beginPath(); X.arc(p.x, p.y, 46 * k * zoom * 1.6 + 10, 0, 7); X.fill();
    }

    // the spine
    X.globalAlpha = n.a ? (0.62 + k * 0.38) : 0.28;
    X.strokeStyle = k > 0 ? (THREAD_COLOR[fl.thread] || '#fff') : col;
    X.lineWidth = wide;
    X.beginPath(); X.moveTo(p.x, p.y); X.lineTo(top.x, top.y); X.stroke();
    // the top edge catches light
    X.fillStyle = k > 0 ? '#ffffff' : col;
    X.globalAlpha = n.a ? (0.75 + k * 0.25) : 0.3;
    X.beginPath(); X.arc(top.x, top.y, wide * 0.5, 0, 7); X.fill();
    X.globalAlpha = 1; X.lineWidth = 1;
  }

  drawDistricts(w, h, pts);
  drawCrossRefs(w, h, pts);
  drawAppLinks(w, h, pts);

  // ── attention moving between books ────────────────────────────────────────
  for (let k = arcs.length - 1; k >= 0; k--) {
    const a = arcs[k], u = (now - a.t0) / ARC_MS;
    if (u > 1) { arcs.splice(k, 1); continue; }
    const A = pts[a.a], B = pts[a.b];
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 - Math.hypot(B.x - A.x, B.y - A.y) * 0.22;
    const tc = THREAD_COLOR[a.thread] || THREAD_COLOR.anon;
    // the trail
    X.strokeStyle = tc + '44'; X.lineWidth = 1.2;
    X.beginPath(); X.moveTo(A.x, A.y); X.quadraticCurveTo(mx, my, B.x, B.y); X.stroke();
    // the head, travelling
    const t = Math.min(1, u * 1.25), it = 1 - t;
    const hx = it*it*A.x + 2*it*t*mx + t*t*B.x, hy = it*it*A.y + 2*it*t*my + t*t*B.y;
    X.fillStyle = tc; X.globalAlpha = 1 - u * 0.7;
    X.beginPath(); X.arc(hx, hy, 3.4, 0, 7); X.fill();
    X.globalAlpha = 1; X.lineWidth = 1;
  }

  // expire flares
  for (let k = flares.length - 1; k >= 0; k--)
    if (now - flares[k].t0 > FLARE_MS) flares.splice(k, 1);

  requestAnimationFrame(draw);
}

// ── the feed ────────────────────────────────────────────────────────────────
// Two polls. Reads are the pulse; runs tell us WHOSE pulse it is, by the same
// time-join the Room card uses to match an ask to its ledger record: a read at
// time t belongs to whichever node was executing at t.
const API = location.origin.startsWith('http') ? location.origin : 'http://localhost:3001';
let since = 0, windows = [], live = null;

function threadAt(t) {
  for (const w of windows) if (t >= w.from && (w.to === null || t <= w.to)) return w.node;
  return 'anon';
}

async function pollRuns() {
  try {
    const r = await fetch(API + '/api/room/runs');
    const j = await r.json();
    const runs = j.runs || j || [];
    const wins = [];
    let active = null;
    for (const run of runs) {
      const nodes = run.nodes || run.state || {};
      for (const [id, st] of Object.entries(nodes)) {
        if (!['author', 'examiner-0', 'examiner-1'].includes(id)) continue;
        const at = st.startedAt || st.at || st.started || null;
        if (!at) continue;
        const done = st.status === 'complete' ? (st.finishedAt || st.at || null) : null;
        wins.push({ node: id, from: new Date(at).getTime(), to: done ? new Date(done).getTime() : null });
        if (st.status === 'executing') active = id;
      }
    }
    windows = wins;
    const el = document.getElementById('now');
    if (active) { el.innerHTML = '<span class="live">● ' + active + ' is reading</span>'; }
    else if (runs.length) { el.textContent = runs.length + ' run(s) known — none executing'; }
    else { el.textContent = 'idle — no runs in memory'; }
  } catch (e) { /* leave the last known state */ }
}

async function pollReads() {
  try {
    const r = await fetch(API + '/api/room/kb/reads?since=' + since);
    const j = await r.json();
    if (live !== true) {
      live = true;
      document.getElementById('conn').innerHTML = '<span class="live">live</span>';
    }
    for (const rd of (j.reads || [])) {
      if (rd.at <= since) continue;
      since = Math.max(since, rd.at);
      // rd.by is the agent naming itself (?by= in the brief). threadAt is the
      // fallback for reads with no ?by: hand-run curls, and anything from
      // before the brief carried it. It cannot separate the two examiners,
      // which is exactly why ?by exists.
      openBook(rd.id, rd.by || threadAt(rd.at), rd.at);
    }
  } catch (e) {
    if (live !== false) {
      live = false;
      document.getElementById('conn').innerHTML = '<span class="cold">offline</span>';
    }
  }
}

// A demo, clearly labelled as one, so the page is legible before the loop next
// runs. It invents nothing about the KB — it walks real entries along real
// dependency edges, which is what a real read sequence looks like.
let demoTimer = null;
function demoStep() {
  const threads = ['author', 'examiner-0', 'examiner-1'];
  const th = threads[Math.floor(Math.random() * 3)];
  const prev = lastByThread[th];
  let next;
  if (prev !== undefined) {
    const nbrs = D.links.filter(([a, b]) => a === prev || b === prev)
      .map(([a, b]) => a === prev ? b : a);
    if (nbrs.length) next = nbrs[Math.floor(Math.random() * nbrs.length)];
  }
  if (next === undefined) next = Math.floor(Math.random() * D.nodes.length);
  const n = D.nodes[next];
  if (n && n.i) openBook(n.i, th, Date.now());
  demoTimer = setTimeout(demoStep, 380 + Math.random() * 900);
}
document.getElementById('demo').addEventListener('change', e => {
  if (e.target.checked) demoStep();
  else { clearTimeout(demoTimer); demoTimer = null; }
});
if (location.hash.includes('demo')) {
  document.getElementById('demo').checked = true;
  demoStep();
}

// ── replay ──────────────────────────────────────────────────────────────────
// The trace is persisted now, so a run that happened at 02:00 can be watched
// afterwards. A dump of the whole history would flare everything at once, which
// shows what was read but not the READING — so this re-emits the events with
// their real gaps.
//
// Long gaps are compressed. An agent thinks for tens of seconds between fetches
// and a faithful replay would be mostly empty screen; the cap is stated in the
// UI rather than hidden, because a silently re-timed replay is a lie about how
// the system worked.
const GAP_CAP_MS = 1600;
let sessions = [], replaying = false;

function splitSessions(reads) {
  // A gap over five minutes is a different sitting, not a pause for thought.
  const out = [];
  let cur = null;
  for (const r of reads) {
    if (!cur || r.at - cur[cur.length - 1].at > 5 * 60 * 1000) { cur = []; out.push(cur); }
    cur.push(r);
  }
  return out.filter(s => s.length > 1);
}

async function loadSessions() {
  const sel = document.getElementById('sessions'), btn = document.getElementById('play');
  try {
    const j = await (await fetch(API + '/api/room/kb/reads?since=0')).json();
    sessions = splitSessions((j.reads || []).slice().sort((a, b) => a.at - b.at));
    if (!sessions.length) { sel.innerHTML = '<option value="">no history yet</option>'; return; }
    sel.innerHTML = sessions.map((s, i) => {
      const t0 = new Date(s[0].at);
      const who = [...new Set(s.map(r => r.by).filter(Boolean))];
      const span = Math.round((s[s.length - 1].at - s[0].at) / 1000);
      return '<option value="' + i + '">'
        + t0.toLocaleDateString([], {month:'short', day:'numeric'}) + ' '
        + t0.toLocaleTimeString([], {hour12:false})
        + '  ·  ' + s.length + ' reads, ' + span + 's'
        + (who.length ? '  ·  ' + who.length + ' agent' + (who.length > 1 ? 's' : '') : '')
        + '</option>';
    }).reverse().join('');
    sel.value = String(sessions.length - 1);
    btn.disabled = false;
  } catch (e) { sel.innerHTML = '<option value="">history unavailable</option>'; }
}

async function playSession(i) {
  const s = sessions[i]; if (!s || replaying) return;
  replaying = true;
  const btn = document.getElementById('play');
  btn.disabled = true; btn.textContent = 'replaying…';
  logLine('<span style="color:#8b949e">— replay of ' + new Date(s[0].at).toLocaleString() + ' —</span>');
  for (let k = 0; k < s.length; k++) {
    const r = s[k];
    openBook(r.id, r.by || 'anon', r.at);
    const gap = k + 1 < s.length ? s[k + 1].at - r.at : 0;
    if (gap > 0) await new Promise(res => setTimeout(res, Math.min(gap, GAP_CAP_MS)));
  }
  btn.disabled = false; btn.textContent = 'replay';
  replaying = false;
}

document.getElementById('play').addEventListener('click', () => {
  const v = document.getElementById('sessions').value;
  if (v !== '') playSession(Number(v));
});
// Selecting a field asks a QUESTION of the library rather than rearranging it:
// every book affiliated with that discipline lights and draws its line to the
// anchor. Nothing moves, so nothing can be mis-placed by the act of asking.
const fieldSel = document.getElementById('field');
fieldSel.innerHTML = '<option value="">all genres</option>'
  + SECTORS.map(s => '<option value="' + s.k + '">' + s.k
      + '  · ' + (GENRE_COUNT[s.k] || 0) + '</option>').join('');
fieldSel.addEventListener('change', () => {
  const f = fieldSel.value;
  document.getElementById('axis').textContent = f
    ? (GENRE_COUNT[f] || 0) + ' catalogued under ' + f
    : (D.nodes.filter(n => (n.sub || []).length).length) + ' of ' + D.nodes.length + ' classified';
});
fieldSel.dispatchEvent(new Event('change'));

// Only after the listener above exists. The first cut put this earlier in the
// file and the dispatched event had nobody to hear it: the checkbox showed
// ticked and nothing moved, which looks exactly like a broken toggle.
document.getElementById('district').innerHTML =
  '<option value="">all projects</option>'
  + DISTRICTS.map((d, i) => '<option value="' + i + '">' + d.name + '</option>').join('');

loadSessions();
setInterval(loadSessions, 60000);

// The live trace only exists on Cole's machine. Published to peirastes.com this
// page is a static map of the building, so polling would be a 404 every 1.1s
// against GitHub Pages forever. Say "local only" rather than "offline": offline
// implies something is broken, and nothing is.
const LOCAL = /^(localhost|127.0.0.1)$/.test(location.hostname) || location.protocol === 'file:';
if (LOCAL) {
  setInterval(pollReads, 1100);
  setInterval(pollRuns, 3000);
  pollReads(); pollRuns();
} else {
  document.getElementById('conn').textContent = 'local only';
  document.getElementById('now').textContent = 'the reading trace runs on the local machine';
  const rp = document.getElementById('play'); if (rp) rp.disabled = true;
  const ss = document.getElementById('sessions');
  if (ss) ss.innerHTML = '<option value="">no history here</option>';
}

// ── interaction ─────────────────────────────────────────────────────────────
C.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('wheel', e => { zoom = Math.max(.25, Math.min(2.2, zoom * (e.deltaY > 0 ? .93 : 1.075))); }, {passive:true});
addEventListener('mousemove', e => {
  if (dragging) {
    rotY += (e.clientX - lx) * .006; rotX += (e.clientY - ly) * .006;
    lx = e.clientX; ly = e.clientY; return;
  }
  const w = innerWidth, h = innerHeight;
  let best = -1, bd = 100;
  for (let i = 0; i < P.length; i++) {
    const p = project(P[i], w, h);
    const d = Math.hypot(p.x - e.clientX, p.y - e.clientY);
    if (d < 11 && d < bd) { bd = d; best = i; }
  }
  const tip = document.getElementById('tip');
  if (best >= 0) {
    const n = D.nodes[best];
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 13) + 'px'; tip.style.top = (e.clientY + 13) + 'px';
    tip.innerHTML = '<b>' + (n.i || '?') + '</b>'
      + '<br><span style="color:#8b949e">' + (D.STRATUM_LABEL[n.z] || '')
      + '<br>' + (n.d || '?') + ' · ' + (n.l || '?') + ' layer'
      + '<br>' + (n.f || 0) + ' depend on it</span>';
  } else tip.style.display = 'none';
});

draw();
</script>
