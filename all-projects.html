<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Peirastes</title>
    <meta name="description" content="Complete portfolio of projects spanning physics, engineering, natural philosophy, and interactive instruments.">
    <meta property="og:title" content="Projects - Peirastes">
    <meta property="og:description" content="Complete portfolio of projects spanning physics, engineering, natural philosophy, and interactive instruments.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://peirastes.com/all-projects.html">
    <meta property="og:image" content="https://peirastes.com/images/PeirastesBanner.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0d10">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cinematic.css">
</head>
<body>

    <!-- Background layers -->
    <div class="bg" aria-hidden="true">
        <div class="bg__image"></div>
        <div class="bg__vignette"></div>
        <div class="bg__grain"></div>
    </div>

    <!-- Chrome -->
    <a class="chrome-wordmark" href="/"><h1>PEIRASTES</h1></a>

    <div class="profile">
        <div class="profile__mark">P</div>
        <div class="profile__meta">
            <span class="profile__name">Peirastes</span>
            <span class="profile__sub">Visitor</span>
        </div>
    </div>

    <div class="hints">
        <span class="hint"><kbd>Esc</kbd> Home</span>
    </div>

    <main class="page">
        <header class="page-hero">
            <div class="page-hero__inner">
                <h1 class="page-hero__title">Projects</h1>
                <p class="page-hero__subtitle">Treatises, Instruments, and Discourses</p>
                <div class="page-hero__stats">
                    <div class="page-hero__stat">
                        <span class="page-hero__stat-value" data-quest-count data-stat="total">—</span>
                        <span class="page-hero__stat-label">Showing</span>
                    </div>
                    <div class="page-hero__stat">
                        <span class="page-hero__stat-value" data-stat="active">—</span>
                        <span class="page-hero__stat-label">Active</span>
                    </div>
                    <div class="page-hero__stat">
                        <span class="page-hero__stat-value" data-stat="completed">—</span>
                        <span class="page-hero__stat-label">Completed</span>
                    </div>
                    <div class="page-hero__stat">
                        <span class="page-hero__stat-value" data-stat="inactive">—</span>
                        <span class="page-hero__stat-label">On Hold</span>
                    </div>
                </div>
            </div>
        </header>

        <article class="page-body page-body--wide">
            <div class="page-body__inner">

                <div class="filter-rail">
                    <div class="filter-group">
                        <span class="filter-group__label">Status</span>
                        <button class="filter-pill is-active" data-group="status" data-filter="all">All</button>
                        <button class="filter-pill" data-group="status" data-filter="active">● Active</button>
                        <button class="filter-pill" data-group="status" data-filter="completed">◆ Completed</button>
                        <button class="filter-pill" data-group="status" data-filter="inactive">◐ On Hold</button>
                    </div>
                    <div class="filter-group">
                        <span class="filter-group__label">Type</span>
                        <button class="filter-pill is-active" data-group="type" data-filter="all">All</button>
                        <button class="filter-pill" data-group="type" data-filter="treatise">Treatise</button>
                        <button class="filter-pill" data-group="type" data-filter="instrument">Instrument</button>
                        <button class="filter-pill" data-group="type" data-filter="discourse">Discourse</button>
                    </div>
                </div>

                <div class="quest-grid" data-quest-grid>
                    <!-- Quest cards rendered here by js/cinematic.js after fetching projects.json -->
                    <div class="empty-state">Loading projects…</div>
                </div>

            </div>
        </article>
    </main>

    <script src="js/cinematic.js"></script>
</body>
</html>
