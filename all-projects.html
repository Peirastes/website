<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Peirastes</title>
    <meta name="description" content="Complete portfolio of projects spanning physics, engineering, natural philosophy, and interactive instruments.">
    <meta property="og:title" content="Projects - Peirastes">
    <meta property="og:description" content="Complete portfolio of projects spanning physics, engineering, natural philosophy, and interactive instruments.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://peirastes.com/all-projects.html">
    <meta property="og:image" content="https://peirastes.com/images/IMG_0712.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
    <style>
        .content { flex-direction: column; }
        main { width: 100%; max-width: 900px; margin: 0 auto; padding: 1rem 1.5rem 2rem; }

        /* --- Filter bar --- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            gap: 0.25rem;
        }
        .filter-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            align-self: center;
            margin-right: 0.25rem;
        }
        .filter-btn {
            background: none;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .filter-btn:hover { border-color: var(--primary-accent); color: var(--text-primary); }
        .filter-btn.active {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
            color: #fff;
        }
        .sort-select {
            margin-left: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }

        /* --- Project count --- */
        .project-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        .project-count span { color: var(--primary-accent); font-weight: 600; }

        /* --- Project cards --- */
        .project-card {
            background: var(--bg-card);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-accent);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .project-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow-sm);
        }
        .project-card h3 {
            margin: 0 0 0.4rem;
            font-size: 1.05rem;
        }
        .project-card h3 a {
            color: var(--primary-accent);
            text-decoration: none;
        }
        .project-card h3 a:hover { text-decoration: underline; }
        .project-card h3 .no-link {
            color: var(--text-primary);
        }
        .project-card .meta-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
        }
        .badge-active { background: rgba(80, 200, 120, 0.15); color: #50c878; }
        .badge-inactive { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .badge-completed { background: rgba(110, 168, 254, 0.15); color: #6ea8fe; }
        .badge-instrument { background: rgba(0, 204, 221, 0.1); color: #00ccdd; }
        .badge-treatise { background: rgba(232, 96, 48, 0.1); color: #e86030; }
        .badge-discourse { background: rgba(192, 132, 252, 0.1); color: #c084fc; }
        .badge-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }
        .project-card p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            main { padding: 0.75rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .sort-select { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Peirastes</h1>
        <p class="tagline"><em>Probing the fidelity of Nature and Reason</em></p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="all-projects.html" class="active">Projects</a>
        <a href="timeline.html">Physics Timeline</a>
        <a href="quotes.html">Quotes</a>
    </nav>

    <div class="content">
        <main>
            <h2 style="margin-top:1.5rem;margin-bottom:0.5rem;">Projects</h2>

            <div class="filter-bar">
                <span class="filter-label">Status</span>
                <div class="filter-group" id="status-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="inactive">Inactive</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <span class="filter-label" style="margin-left:0.5rem">Type</span>
                <div class="filter-group" id="type-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="instrument">Instrument</button>
                    <button class="filter-btn" data-filter="treatise">Treatise</button>
                    <button class="filter-btn" data-filter="discourse">Discourse</button>
                </div>

                <select class="sort-select" id="sort-select">
                    <option value="date-desc">Newest first</option>
                    <option value="date-asc">Oldest first</option>
                    <option value="alpha">A — Z</option>
                </select>
            </div>

            <div class="project-count" id="project-count"></div>
            <div id="project-list"></div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Cole Prather</p>
    </footer>

    <script>
        let allProjects = [];
        let statusFilter = 'all';
        let typeFilter = 'all';
        let sortMode = 'date-desc';

        fetch('projects.json')
            .then(r => r.json())
            .then(data => { allProjects = data; render(); })
            .catch(() => {
                document.getElementById('project-list').innerHTML = '<p>Failed to load projects.</p>';
            });

        function render() {
            let filtered = allProjects.filter(p => {
                if (statusFilter !== 'all' && p.status !== statusFilter) return false;
                if (typeFilter !== 'all' && p.type !== typeFilter) return false;
                return true;
            });

            if (sortMode === 'date-desc') {
                filtered.sort((a, b) => (b.published || '').localeCompare(a.published || ''));
            } else if (sortMode === 'date-asc') {
                filtered.sort((a, b) => (a.published || '').localeCompare(b.published || ''));
            } else {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            const countEl = document.getElementById('project-count');
            countEl.innerHTML = `Showing <span>${filtered.length}</span> of <span>${allProjects.length}</span> projects`;

            const list = document.getElementById('project-list');
            list.innerHTML = filtered.map(p => {
                const date = p.published ? new Date(p.published + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'short' }) : '';
                const title = p.link
                    ? `<a href="${p.link}">${p.title}</a>`
                    : `<span class="no-link">${p.title}</span>`;
                return `<div class="project-card">
                    <h3>${title}</h3>
                    <div class="meta-row">
                        <span class="badge badge-${p.status || 'completed'}">${p.status || 'completed'}</span>
                        <span class="badge badge-${p.type || 'treatise'}">${p.type || 'treatise'}</span>
                        <span class="badge badge-date">${date}</span>
                    </div>
                    <p>${p.description || ''}</p>
                </div>`;
            }).join('');
        }

        // Filter button handlers
        document.getElementById('status-filters').addEventListener('click', e => {
            if (!e.target.matches('.filter-btn')) return;
            statusFilter = e.target.dataset.filter;
            e.target.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        });

        document.getElementById('type-filters').addEventListener('click', e => {
            if (!e.target.matches('.filter-btn')) return;
            typeFilter = e.target.dataset.filter;
            e.target.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        });

        document.getElementById('sort-select').addEventListener('change', e => {
            sortMode = e.target.value;
            render();
        });
    </script>
</body>
</html>
