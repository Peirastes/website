<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Radiating Charge Lab — PSE-II</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>
/* Shell, chrome, rail, slider and readout vocabulary from the canon (capacitor_lab.html = clone parent; sliders from optics-lab). */
:root{
  --gold:#ffae20;--gold-soft:rgba(255,174,32,.72);--gold-faint:rgba(255,174,32,.28);--gold-glow:rgba(255,174,32,.45);
  --cyan:#7dd6ff;--cyan-soft:rgba(125,214,255,.65);--cyan-faint:rgba(125,214,255,.22);--cyan-glow:rgba(125,214,255,.30);
  --red:#e05040;--void:#06080c;
  --glass-bg:rgba(10,14,22,.42);--glass-border:rgba(255,255,255,.10);--glass-blur:blur(22px) saturate(1.4);
  --glass-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  --card-bg:rgba(6,10,18,.55);--card-border:rgba(255,255,255,.07);
  --text:#e8e8e8;--text-dim:#8a8a8a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:radial-gradient(ellipse at 45% 40%,#0a0e16 0%,#06080c 55%,#04060a 100%);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.cin-grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");mix-blend-mode:overlay}

/* ── cinematic chrome ── */
.cin-flank{position:fixed;top:max(1.6rem,env(safe-area-inset-top,0px) + .6rem);z-index:100;display:flex;flex-direction:column;gap:.4rem;opacity:0;transform:translateY(-8px);animation:cin-fi 700ms ease 250ms forwards}
.cin-flank--left{left:max(1.6rem,env(safe-area-inset-left,0px) + .6rem);align-items:flex-start}
.cin-wordmark{font-family:'Cinzel',serif;font-size:.78rem;font-weight:600;letter-spacing:.28em;color:var(--gold-soft);text-decoration:none;text-shadow:0 0 8px var(--gold-glow);line-height:1}
.cin-version{font-family:'Inter',sans-serif;font-size:.56rem;font-weight:500;color:rgba(125,214,255,.55);letter-spacing:.2em;text-transform:uppercase}
.cin-title{position:fixed;top:max(1.6rem,env(safe-area-inset-top,0px) + .6rem);left:50%;transform:translateX(-50%);text-align:center;z-index:100;pointer-events:none;opacity:0;animation:cin-fic 700ms ease 350ms forwards}
.cin-title__name{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:var(--gold);letter-spacing:.24em;text-transform:uppercase;text-shadow:0 0 14px var(--gold-glow),0 0 32px rgba(255,174,32,.18);margin-bottom:4px;line-height:1}
.cin-title__sub{font-family:'Inter',sans-serif;font-size:9px;font-weight:500;color:var(--cyan-soft);letter-spacing:.22em;text-transform:uppercase}
.cin-tick{position:fixed;width:16px;height:16px;z-index:99;pointer-events:none;opacity:0;animation:cin-fi 800ms ease 600ms forwards}
.cin-tick::before,.cin-tick::after{content:'';position:absolute;background:rgba(125,214,255,.45)}
.cin-tick--tl{top:.9rem;left:.9rem}.cin-tick--tr{top:.9rem;right:.9rem}.cin-tick--bl{bottom:.9rem;left:.9rem}.cin-tick--br{bottom:.9rem;right:.9rem}
.cin-tick--tl::before{top:0;left:0;width:12px;height:1px}.cin-tick--tl::after{top:0;left:0;width:1px;height:12px}
.cin-tick--tr::before{top:0;right:0;width:12px;height:1px}.cin-tick--tr::after{top:0;right:0;width:1px;height:12px}
.cin-tick--bl::before{bottom:0;left:0;width:12px;height:1px}.cin-tick--bl::after{bottom:0;left:0;width:1px;height:12px}
.cin-tick--br::before{bottom:0;right:0;width:12px;height:1px}.cin-tick--br::after{bottom:0;right:0;width:1px;height:12px}
.cin-hints{position:fixed;bottom:max(1.6rem,env(safe-area-inset-bottom,0px) + .6rem);right:calc(1.6rem + 16px);z-index:100;display:flex;gap:.35rem;font-family:'Share Tech Mono',monospace;font-size:.62rem;letter-spacing:.1em;color:rgba(180,180,180,.45);text-transform:uppercase;opacity:0;animation:cin-fi 800ms ease 750ms forwards}
.cin-hints kbd{background:rgba(125,214,255,.06);border:1px solid var(--cyan-faint);border-radius:2px;padding:1px 5px;margin-right:.3rem;color:var(--cyan);font-size:.58rem}
@keyframes cin-fi{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cin-fic{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}

/* ── layout: the world is the full-bleed canvas; title, readouts and rail float over it ── */
.main-grid{position:fixed;top:5.5rem;left:1.6rem;right:1.6rem;bottom:1.6rem;z-index:5;pointer-events:none;animation:appfade 1100ms ease 200ms backwards}
.main-grid > *{pointer-events:auto}
@keyframes appfade{0%{opacity:0}100%{opacity:1}}
.app-title{position:absolute;top:6px;left:9px;pointer-events:none}
.app-title::before,.cin-title::before{content:'';position:absolute;inset:-28px -46px;z-index:-1;background:radial-gradient(ellipse at 50% 50%,rgba(6,8,12,.92) 35%,rgba(6,8,12,0) 72%)}
.app-title__name{font-family:'Orbitron',sans-serif;font-size:23px;font-weight:700;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 14px var(--gold-glow),0 0 34px rgba(255,174,32,.18);line-height:1}
.app-title__mode{font-family:'Orbitron',sans-serif;font-size:11.5px;font-weight:600;color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 8px var(--cyan-glow);margin-top:7px}
.app-title__scope{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--text-dim);letter-spacing:.18em;text-transform:uppercase;margin-top:5px}

.cap-rail{position:absolute;top:16px;right:16px;max-height:calc(100% - 32px);width:300px;display:flex;flex-direction:column;gap:8px;z-index:10}
.control-panel{position:relative;width:100%;flex:0 1 auto;min-height:0;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:8px;box-shadow:var(--glass-shadow);padding:16px;overflow-y:auto;flex:0 0 auto}
.info-frame{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:8px;box-shadow:var(--glass-shadow);padding:13px 15px 14px}
.info-frame > *{flex-shrink:0}
.mode-desc{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--glass-border)}
.md-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 6px var(--gold-glow);margin-bottom:6px}
.md-text{font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.5;color:rgba(230,230,230,.78)}
.md-text b{color:#fff;font-weight:600}
.eq-card{padding:1px 0 2px;text-align:center;overflow-x:auto;overflow-y:hidden}
.eq-l{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 6px var(--gold-glow);margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--gold-faint);text-align:left}
.eq-card .katex{font-size:16px}.eq-card .katex-display{margin:0;overflow:visible}
.keyrow{font-family:'Inter',sans-serif;font-size:11px;color:rgba(230,230,230,.7);display:flex;align-items:center;gap:8px;margin:4px 0}
.keyrow i{flex:0 0 22px;height:0;border-top:2.5px solid;font-style:normal}
.keyrow i.dot{flex:0 0 10px;height:10px;border:none;border-radius:50%}
.keyrow i.sq{flex:0 0 12px;height:12px;border:none;border-radius:2px}
.keysec{margin-top:10px}

/* the guided-step panel (capacitor #gP vocabulary) */
#gP{background:rgba(255,174,32,.05);border:1px solid var(--gold-faint);border-radius:6px;padding:11px 12px;margin-bottom:10px}
.gp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gp-t{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.14em}
.gp-s{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim)}
.gp-head{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:#fff;line-height:1.35}
.gp-nav{display:flex;gap:4px;margin-top:10px}
.gp-btn{flex:1 1 0;white-space:nowrap;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.08em;padding:5px 2px;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(8,12,18,.6);color:rgba(220,220,220,.6);transition:all .12s}
.gp-btn:hover:not(:disabled){color:var(--cyan);border-color:var(--cyan-faint);text-shadow:0 0 6px var(--cyan-glow)}
.gp-btn:disabled{opacity:.35;cursor:default}
.seg{display:flex;gap:5px;margin-bottom:10px}
.seg-btn{flex:1;text-align:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:600;letter-spacing:.1em;padding:6px 2px;border-radius:4px;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(20,26,36,.78),rgba(8,12,18,.88));color:rgba(220,220,220,.55);transition:all .14s}
.seg-btn:hover{color:var(--cyan);border-color:var(--cyan-faint)}
.seg-btn.on{border-color:var(--gold-faint);color:var(--gold);text-shadow:0 0 6px var(--gold-glow);background:linear-gradient(180deg,rgba(255,174,32,.18),rgba(160,104,32,.08))}
.section-label{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 6px var(--gold-glow);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.section-label small{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.04em;text-shadow:none;font-weight:400}

/* sliders — recessed channel + amber-thumbed nub (optics-lab) */
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.slider-row .sl{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text-dim);letter-spacing:.04em;white-space:nowrap;min-width:78px;font-weight:500}
.slider-row input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;background:rgba(4,6,10,.85);border:1px solid rgba(255,174,32,.20);border-radius:2px;outline:none;cursor:pointer}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);border:1px solid #ffd080;box-shadow:0 0 6px var(--gold-glow);cursor:pointer}
.slider-row input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:1px solid #ffd080;box-shadow:0 0 6px var(--gold-glow);cursor:pointer}
.slider-row .sv{font-size:12px;color:var(--cyan);text-shadow:0 0 5px var(--cyan-glow);font-family:'Share Tech Mono',monospace;min-width:62px;text-align:left}
.hint{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--text-dim);letter-spacing:.03em;margin:0 0 10px}

/* readouts: bottom-left of the world, floating on the void at the canonical inset */
.readout-band{position:absolute;left:9px;bottom:9px;display:flex;flex-direction:column;gap:6px}
.readout-band .section-label{text-shadow:0 0 6px var(--gold-glow),0 0 3px #06080c,0 0 6px #06080c}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(78px,1fr));gap:6px}
.rcard{background:rgba(6,10,18,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--card-border);border-radius:4px;padding:8px 10px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rk{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim)}
.rv{font-family:'Share Tech Mono',monospace;font-size:15px;color:var(--cyan);text-shadow:0 0 6px var(--cyan-glow)}
.rs{font-family:'Share Tech Mono',monospace;font-size:10.5px;color:rgba(255,208,128,.8)}
.gcard{background:rgba(6,10,18,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--card-border);border-radius:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);padding:6px}
.gcard canvas{display:block}

html.embed .cin-flank,html.embed .cin-title,html.embed .cin-tick,html.embed .cin-grain,html.embed .cin-hints{display:none !important}
html.embed .main-grid{top:1.6rem !important}
.control-panel::-webkit-scrollbar,.info-frame::-webkit-scrollbar{width:8px}
.control-panel::-webkit-scrollbar-track,.info-frame::-webkit-scrollbar-track{background:linear-gradient(90deg,rgba(0,0,0,.45) 0%,rgba(4,6,10,.65) 25%,rgba(4,6,10,.65) 75%,rgba(0,0,0,.45) 100%);border-radius:4px;box-shadow:inset 1px 0 3px rgba(0,0,0,.55),inset -1px 0 3px rgba(0,0,0,.55),inset 0 2px 4px rgba(0,0,0,.35);margin:4px 0}
.control-panel::-webkit-scrollbar-thumb,.info-frame::-webkit-scrollbar-thumb{border-radius:4px;background:rgba(40,52,68,.6);border-left:1px solid rgba(125,214,255,.10);border-right:1px solid rgba(255,174,32,.22);border-top:1px solid rgba(255,255,255,.14);border-bottom:.5px solid rgba(0,0,0,.22)}
@supports (-moz-appearance:none){.control-panel{scrollbar-width:thin;scrollbar-color:rgba(125,214,255,.45) rgba(4,6,10,.6)}}
</style>

<body>
<canvas id="world"></canvas>
<div class="cin-grain" aria-hidden="true"></div>
<div class="cin-flank cin-flank--left"><span class="cin-wordmark">PEIRASTES</span><span class="cin-version">v3.5</span></div>
<div class="cin-title"><div class="cin-title__name">Radiating Charge</div><div class="cin-title__sub">Kinks in the field · EM Waves · PSE-II</div></div>
<div class="cin-tick cin-tick--tl"></div><div class="cin-tick cin-tick--tr"></div><div class="cin-tick cin-tick--bl"></div><div class="cin-tick cin-tick--br"></div>

<div class="main-grid">
  <div class="app-title">
    <div class="app-title__name">Radiating Charge</div>
    <div class="app-title__mode" id="modeLine"></div>
    <div class="app-title__scope">PSE-II &bull; Ch 31 &bull; What is waving</div>
  </div>

  <div class="readout-band" id="rband"></div>

  <div class="cap-rail" id="rail">
    <div class="control-panel">
      <div id="gP">
        <div class="gp-hdr"><span class="gp-t" id="gpStep"></span><span class="gp-s" id="gpName"></span></div>
        <div class="gp-head" id="gpHead"></div>
        <div class="gp-nav"><button class="gp-btn" id="bBack">&#9664; BACK</button><button class="gp-btn" id="bNext">NEXT &#9654;</button><button class="gp-btn" id="bReplay">&#8634; REPLAY</button><button class="gp-btn" id="bPause">PAUSE</button></div>
      </div>
      <div class="seg" id="seg"></div>
      <div class="section-label">Controls</div>
      <div id="rowV"><div class="slider-row"><span class="sl">speed v</span><input type="range" id="vIn" min="0.05" max="0.6" step="0.01" value="0.2"><span class="sv" id="vVal"></span></div>
        <div class="hint" id="vHint">kept below the speed of light c</div></div>
      <div id="rowF"><div class="slider-row"><span class="sl">shake rate f</span><input type="range" id="fIn" min="0" max="1" step="0.01" value="0.5"><span class="sv" id="fVal"></span></div>
        <div class="hint">higher f, shorter wavelength: &lambda; = c / f</div></div>
    </div>
    <div class="info-frame">
      <div class="mode-desc"><div class="md-title">Overview</div><div class="md-text" id="ovText"></div></div>
      <div class="eq-l" id="eqTitle"></div><div class="eq-card" id="eqBody"></div>
      <div class="keysec"><div class="eq-l">Key</div><div id="key"></div></div>
    </div>
  </div>
</div>
<div class="cin-hints"><span><kbd>&larr;</kbd><kbd>&rarr;</kbd>Steps</span><span><kbd>Space</kbd>Pause</span><span><kbd>R</kbd>Replay</span></div>

<script>
"use strict";
// PHYSICS-BEGIN
// Units: c = 1. Lengths in screen units (the screen is 1000 units tall); times in the same units (light travels 1 per 1).
// The charge moves along x only. Field = the exact Lienard-Wiechert field of a point charge (Gaussian units, q = 1):
//   E = (n - b)(1 - b^2) / (k^3 R^2)              velocity part: falls as 1/R^2, stays with the charge
//     + n x ((n - b) x a) / (k^3 R)               acceleration part: falls as 1/R, the radiation (the kink)
//   k = 1 - n.b, everything evaluated at the retarded time t_r: |r - x(t_r)| = t - t_r.   B = n x E.
const PHYS = (() => {
  const rest = () => (t) => ({ X: 0, V: 0, A: 0 });
  const steady = (v) => (t) => ({ X: v * t, V: v, A: 0 });
  // at rest until t = 0, a steady push for a time tau up to speed v0, then coasting
  const shove = (v0, tau) => { const a = v0 / tau; return (t) => t < 0 ? { X: 0, V: 0, A: 0 }
    : t < tau ? { X: 0.5 * a * t * t, V: a * t, A: a } : { X: 0.5 * v0 * tau + v0 * (t - tau), V: v0, A: 0 }; };
  // back and forth, top speed vmax, wavelength lam = c / f
  const shake = (vmax, lam) => { const w = 2 * Math.PI / lam, A0 = vmax / w;
    return (t) => ({ X: A0 * Math.sin(w * t), V: vmax * Math.cos(w * t), A: -vmax * w * Math.sin(w * t) }); };
  function retard(T, x, y, t) {                 // Newton on g(tr) = t - tr - |r - x(tr)|, g' = -1 + n.v < 0
    let s = T(t), tr = t - Math.hypot(x - s.X, y);
    for (let i = 0; i < 60; i++) {
      s = T(tr); const dx = x - s.X, R = Math.hypot(dx, y), g = t - tr - R;
      if (Math.abs(g) < 1e-9) break;
      tr -= g / (-1 + (dx / R) * s.V);
    }
    return tr;
  }
  function field(T, x, y, t, o = {}) {
    const tr = retard(T, x, y, t), s = T(tr);
    const Rx = x - s.X, R = Math.hypot(Rx, y), nx = Rx / R, ny = y / R, b = s.V, k = 1 - nx * b, k3 = k * k * k;
    const ux = nx - b, uy = ny, cv = (1 - b * b) / (k3 * R * R), ca = 1 / (k3 * R), na = nx * s.A;
    o.vx = ux * cv; o.vy = uy * cv;                       // velocity (Coulomb-like) part
    o.ax = (ux * na - s.A * k) * ca; o.ay = uy * na * ca;  // acceleration part: (n-b)(n.a) - a (n.(n-b)), n.(n-b) = k
    o.x = o.vx + o.ax; o.y = o.vy + o.ay;
    o.bz = nx * o.ay - ny * o.ax;                         // the kink's B = n x E_acc: + out of the page
    o.R = R; o.tr = tr; return o;
  }
  return { rest, steady, shove, shake, retard, field };
})();
// PHYSICS-END

const cv = document.getElementById("world"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const TAU = 18, CAP = 2.6, HOLD = 1.6, RATE = 115;     // shove duration; caption-first pause (s); end hold (s); c in units/s
const COL = { line: "rgba(255,208,128,0.88)", news: "rgba(125,214,255,0.85)", charge: "#e05040", chargeTxt: "#ff9a8f", text: "rgba(232,232,232,0.92)", cyan: "#7dd6ff" };
let W = 0, H = 0, K = 1, DPR = 1, Ww = 1000, UW = 0;   // UW = usable width (px): canvas left edge to the rail's left edge
let vSet = 0.2, fSet = 0.5;
const lamOf = (f) => 420 - 270 * f;                     // wavelength in screen units, f slider 0..1
let si = 0, wall = 0, paused = false, last = performance.now();

const SC = [
  { name: "At Rest", v: 0.2, O: [0.5, 0.5], traj: () => PHYS.rest(), loop: false,
    head: "A charge at rest: nothing leaves.",
    body: () => `The lines are the electric field <b>E</b>, straight out from the charge in every direction. Nothing changes, so nothing travels outward and no energy leaves the charge.`,
    eqT: "Coulomb field", eq: String.raw`E = \frac{1}{4\pi\varepsilon_0}\,\frac{q}{r^{2}}` },
  { name: "Steady Motion", v: 0.5, O: [0.5, 0.5], traj: () => PHYS.steady(vSet), loop: true, steady: true,
    head: "Steady motion: still nothing leaves.",
    body: () => `Moving at a constant ${vSet.toFixed(2)}c, the lines still point straight at where the charge is <b>right now</b>. Walk alongside it and it is a charge at rest, so steady motion cannot send energy away either.`,
    eqT: "Constant velocity", eq: String.raw`\vec v = \text{const}\;\Rightarrow\;\text{no radiation}` },

    for (let y = 60; y < Math.min(60 + lam, top - lam); y += 1) { PHYS.field(T, c.X, y, t, f); if (f.bz * f.R > best) { best = f.bz * f.R; yb = y; } }
    if (best > 0 && yb + lam < top) {
      const X = sx(c.X) + 26; ctx.strokeStyle = "rgba(232,232,232,0.9)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(X - 6, sy(yb)); ctx.lineTo(X, sy(yb)); ctx.lineTo(X, sy(yb + lam)); ctx.lineTo(X - 6, sy(yb + lam)); ctx.stroke();
      label("one wavelength λ = c / f", X + 8, (sy(yb) + sy(yb + lam)) / 2 + 5, COL.text);
    }
    label("shaken back and forth", sx(c.X) + 18, sy(0) + 40, COL.chargeTxt);
  }
  updateBand(S, T, t);
}

// ---------- readouts (bottom-left), rail, steps ----------
let bandKind = "";
function updateBand(S, T, t) {
  const band = $("rband"), kind = S.heat === "ring" ? "angle" : S.graph ? "graph" : "";
  if (kind !== bandKind) {
    bandKind = kind;
    band.innerHTML = kind === "angle" ? `<div class="section-label">Kink Pattern <small>measured on screen · scaled to 1 at 90°</small></div><div class="rgrid" id="agrid"></div>`
      : kind === "graph" ? `<div class="section-label">Energy Through a Sphere <small>E² × 4πr², 1 = near the charge</small></div><div class="gcard"><canvas id="gv"></canvas></div>` : "";
  }
  if (kind === "angle") {
    const rows = t > 60 ? angleTable(T, t) : null;
    $("agrid").innerHTML = [0, 45, 90, 135, 180].map((d, i) => `<div class="rcard"><span class="rk">θ = ${d}°</span><span class="rv">${rows ? rows[i].m.toFixed(2) : "—"}</span><span class="rs">sin θ ${Math.sin(d * Math.PI / 180).toFixed(2)}</span></div>`).join("");
  } else if (kind === "graph") drawGraph($("gv"), T, t);
}
function renderEq() {
  const S = SC[si]; $("eqTitle").textContent = S.eqT;
  if (window.katex) katex.render(S.eq, $("eqBody"), { displayMode: true, throwOnError: false }); else $("eqBody").textContent = "";
}
window.renderEq = renderEq;
function keyHTML(S) {
  const row = (sw, txt) => `<div class="keyrow">${sw}<span>${txt}</span></div>`;
  let k = row(`<i style="border-color:#ffd080"></i>`, "electric field lines (E)") + row(`<i class="dot" style="background:#e05040"></i>`, "the charge");
  if (S.shell) k += row(`<i style="border-color:#7dd6ff;border-top-style:dashed"></i>`, "news of the shove, spreading at c");
  if (S.heat === "ring") k += row(`<i class="sq" style="background:rgba(125,214,255,.85)"></i>`, "kink strength (× distance, so only the angle shows)");
  if (S.heat === "wave") k += row(`<i class="sq" style="background:rgba(255,120,70,.6)"></i>`, "⊙ B out of the page") + row(`<i class="sq" style="background:rgba(70,150,255,.6)"></i>`, "⊗ B into the page (shading × distance)");
  return k;
}
function syncRail() {
  const S = SC[si];
  $("rowV").style.display = si >= 1 ? "" : "none"; $("rowF").style.display = S.heat === "wave" ? "" : "none";
  $("vVal").textContent = vSet.toFixed(2) + " c"; $("vHint").textContent = S.heat === "wave" ? "top speed while shaking; kept below c" : "kept below the speed of light c";
  $("fVal").textContent = "λ " + (lamOf(fSet) / 1000).toFixed(2) + " H";
  $("ovText").innerHTML = S.body();
}
function setScene(i, w = 0) {
  si = Math.max(0, Math.min(SC.length - 1, i)); wall = w; const S = SC[si]; vSet = S.v; $("vIn").value = S.v;
  $("modeLine").textContent = `Step ${si + 1} · ${S.name}`;
  $("gpStep").textContent = `STEP ${si + 1} / ${SC.length}`; $("gpName").textContent = S.name.toUpperCase(); $("gpHead").textContent = S.head;
  $("bBack").disabled = si === 0; $("bNext").disabled = si === SC.length - 1;
  [...$("seg").children].forEach((e, j) => e.classList.toggle("on", j === si));
  $("key").innerHTML = keyHTML(S); renderEq(); syncRail(); bandKind = "x";
}
SC.forEach((S, j) => { const e = document.createElement("button"); e.className = "seg-btn"; e.textContent = j + 1; e.title = S.name; e.onclick = () => setScene(j); $("seg").appendChild(e); });
$("bNext").onclick = () => setScene(si + 1); $("bBack").onclick = () => setScene(si - 1);
$("bReplay").onclick = () => setScene(si); $("bPause").onclick = () => { paused = !paused; $("bPause").textContent = paused ? "PLAY" : "PAUSE"; };
$("vIn").oninput = (e) => { vSet = +e.target.value; syncRail(); };
$("fIn").oninput = (e) => { fSet = +e.target.value; syncRail(); };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === "PageDown") setScene(si + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") setScene(si - 1);
  else if (e.key === " ") { e.preventDefault(); $("bPause").click(); }
  else if (e.key === "r" || e.key === "R") setScene(si);
});
addEventListener("resize", resize);
resize(); setScene(0); requestAnimationFrame(() => { resize(); });
window.__kink = { PHYS, go: (i, w) => { setScene(i, w); render(); }, setV: (v) => { vSet = v; $("vIn").value = v; syncRail(); }, setF: (f) => { fSet = f; $("fIn").value = f; syncRail(); },
  pause: (p) => { paused = p; }, angleTable: () => angleTable(SC[si].traj(), simTime(SC[si], wall)), simTime: () => simTime(SC[si], wall),
  shellLinesAt: (t) => { const S = SC[si]; OX = (S.O[0] * UW) / K; OY = S.O[1] * 1000; return shellLines(S.traj(), t).map((l) => ({ pts: l.pts, err: l.err })); },
  shellErr: (t) => { const T = SC[si].traj(); return Math.max(...shellLines(T, t).map((l) => l.err || 0)); },
  lineEnds: () => { const S = SC[si], T = S.traj(), t = simTime(S, wall); OX = (S.O[0] * UW) / K; OY = S.O[1] * 1000;
    return traceLines(T, t).map(({ pts }) => [sy(pts[pts.length - 1]), sy(-pts[pts.length - 1]), sx(pts[pts.length - 2])]); }, dims: () => ({ W, H, UW }) };
requestAnimationFrame(frame);
</script>
