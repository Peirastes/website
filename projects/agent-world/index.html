<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0c18; }
    #game-container { width: 100%; height: 100%; position: relative; }
    canvas { display: block; }

    /* DOM overlay */
    #ui-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #ui-overlay > * { pointer-events: auto; }

    /* ─── Dialog Panel ─── */
    .dialog-panel {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 680px;
      max-height: 440px;
      background: rgba(12, 14, 24, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #d0d4dc;
      padding: 20px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1);
    }
    .dialog-panel.visible { display: block; }

    .dialog-panel::-webkit-scrollbar { width: 4px; }
    .dialog-panel::-webkit-scrollbar-track { background: transparent; }
    .dialog-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .dialog-panel h3 {
      color: #8a9ab0;
      margin: 16px 0 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .dialog-panel .task-item {
      background: rgba(255,255,255,0.03);
      border-left: 2px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      margin: 4px 0;
      border-radius: 0 6px 6px 0;
      transition: background 0.15s;
    }
    .dialog-panel .task-item:hover { background: rgba(255,255,255,0.06); }
    .dialog-panel .task-item.completed { border-left-color: rgba(255,255,255,0.04); opacity: 0.5; }
    .dialog-panel .task-item.blocked { border-left-color: #ee5555; }

    .dialog-panel .task-status {
      font-size: 11px;
      color: #6a7080;
      margin-top: 2px;
    }
    .dialog-panel .task-priority {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 6px;
      letter-spacing: 0.5px;
    }
    .dialog-panel .task-priority.p1 { background: rgba(238,68,68,0.2); color: #ff6666; border: 1px solid rgba(238,68,68,0.3); }
    .dialog-panel .task-priority.p2 { background: rgba(255,136,68,0.2); color: #ffaa66; border: 1px solid rgba(255,136,68,0.3); }
    .dialog-panel .task-priority.p3 { background: rgba(220,180,60,0.2); color: #eebb44; border: 1px solid rgba(220,180,60,0.3); }
    .dialog-panel .task-priority.p4 { background: rgba(68,170,255,0.15); color: #66bbff; border: 1px solid rgba(68,170,255,0.2); }
    .dialog-panel .task-priority.p5 { background: rgba(136,136,136,0.15); color: #999; border: 1px solid rgba(136,136,136,0.2); }

    .dialog-panel .close-hint {
      text-align: center;
      color: #444a58;
      font-size: 11px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .dialog-panel .agent-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dialog-panel .agent-avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
    }
    .dialog-panel .agent-info { flex: 1; }
    .dialog-panel .agent-info .agent-name {
      font-size: 16px;
      font-weight: 700;
      color: #e8ecf4;
    }
    .dialog-panel .agent-info .agent-role {
      font-size: 12px;
      color: #6a7080;
      margin-top: 2px;
    }

    /* ─── Status HUD ─── */
    .status-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 20;
    }
    .status-hud .agent-pip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 14, 24, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      color: #b0b4bc;
    }
    .status-hud .agent-pip .pip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      box-shadow: 0 0 4px currentColor;
    }
    .status-hud .agent-pip { cursor: pointer; transition: background 0.15s; position: relative; z-index: 21; }
    .status-hud .agent-pip:hover { background: rgba(20, 22, 36, 0.95); }
    .status-hud .agent-pip.expanded { background: rgba(20, 22, 36, 0.95); border-color: rgba(255,255,255,0.12); }
    .status-hud .pip-chevron {
      margin-left: auto;
      font-size: 8px;
      color: #555;
      transition: transform 0.15s;
    }
    .status-hud .agent-pip.expanded .pip-chevron { transform: rotate(180deg); }

    /* ─── Task Dropdown ─── */
    .pip-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 2px;
      width: 320px;
      max-height: 280px;
      overflow-y: auto;
      background: rgba(12, 14, 24, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1);
      z-index: 20;
      padding: 6px 0;
    }
    .pip-dropdown.visible { display: block; }
    .pip-dropdown::-webkit-scrollbar { width: 4px; }
    .pip-dropdown::-webkit-scrollbar-track { background: transparent; }
    .pip-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .pip-dropdown .dd-header {
      padding: 6px 12px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6a7080;
    }
    .pip-dropdown .dd-task {
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 2px solid transparent;
      margin: 0 4px;
      border-radius: 0 4px 4px 0;
    }
    .pip-dropdown .dd-task:hover { background: rgba(255,255,255,0.05); }
    .pip-dropdown .dd-task.blocked { border-left-color: #ee5555; }
    .pip-dropdown .dd-task-title {
      font-size: 12px;
      color: #d0d4dc;
      line-height: 1.4;
    }
    .pip-dropdown .dd-task-meta {
      font-size: 10px;
      color: #6a7080;
      margin-top: 2px;
    }
    .pip-dropdown .dd-empty {
      padding: 12px;
      font-size: 11px;
      color: #555;
      text-align: center;
      font-style: italic;
    }
    .pip-dropdown .dd-view-all {
      padding: 8px 12px;
      font-size: 11px;
      color: #8a9ab0;
      text-align: center;
      cursor: pointer;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 4px;
      transition: color 0.15s;
    }
    .pip-dropdown .dd-view-all:hover { color: #d0d4dc; }

    /* Quick-execute button in dropdown */
    .dd-exec {
      float: right;
      cursor: pointer;
      color: #44dd88;
      font-size: 11px;
      padding: 0 4px;
      border-radius: 3px;
      transition: background 0.15s;
      opacity: 0.7;
    }
    .dd-exec:hover { opacity: 1; background: rgba(68, 221, 136, 0.15); }

    /* ─── All Tasks Panel ─── */
    .all-tasks-panel {
      display: none;
      position: absolute;
      top: 12px;
      right: 200px;
      width: 400px;
      max-height: 70vh;
      overflow-y: auto;
      background: rgba(12, 14, 24, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #d0d4dc;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1);
      z-index: 22;
      padding: 0;
    }
    .all-tasks-panel.visible { display: block; }
    .all-tasks-panel::-webkit-scrollbar { width: 4px; }
    .all-tasks-panel::-webkit-scrollbar-track { background: transparent; }
    .all-tasks-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .atp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: rgba(12, 14, 24, 0.98);
      z-index: 1;
    }
    .atp-header-title {
      font-size: 13px;
      font-weight: 700;
      color: #e8ecf4;
    }
    .atp-close {
      cursor: pointer;
      color: #6a7080;
      font-size: 16px;
      padding: 0 4px;
      transition: color 0.15s;
    }
    .atp-close:hover { color: #d0d4dc; }

    .atp-section-header {
      padding: 8px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6a7080;
    }

    .atp-task {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 2px solid transparent;
      margin: 0 4px;
      border-radius: 0 4px 4px 0;
    }
    .atp-task:hover { background: rgba(255,255,255,0.05); }
    .atp-task.blocked { border-left-color: #ee5555; }

    .atp-agent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .atp-task-body { flex: 1; min-width: 0; }
    .atp-task-title {
      font-size: 12px;
      color: #d0d4dc;
      line-height: 1.4;
    }
    .atp-task-meta {
      font-size: 10px;
      color: #6a7080;
      margin-top: 2px;
    }
    .atp-exec {
      flex-shrink: 0;
      cursor: pointer;
      color: #44dd88;
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 3px;
      transition: background 0.15s;
      opacity: 0.7;
      margin-top: 1px;
    }
    .atp-exec:hover { opacity: 1; background: rgba(68, 221, 136, 0.15); }

    .atp-empty {
      padding: 20px 16px;
      font-size: 11px;
      color: #555;
      text-align: center;
      font-style: italic;
    }

    /* ─── Interaction Prompt ─── */
    .interact-prompt {
      display: none;
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 14, 24, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 18px;
      color: #b0c4e0;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .interact-prompt.visible { display: block; }

    /* ─── Camera Mode Indicator ─── */
    .camera-mode-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(12, 14, 24, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 4px 12px;
      color: #6a7080;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 20;
      transition: color 0.2s, border-color 0.2s;
    }
    .camera-mode-indicator.fp-active {
      color: #88ccaa;
      border-color: rgba(136, 204, 170, 0.3);
    }

    /* ─── FP Crosshair ─── */
    .fp-crosshair {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 15;
    }
    .fp-crosshair::before, .fp-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.4);
    }
    .fp-crosshair::before {
      top: 50%; left: 0; right: 0; height: 1px;
      transform: translateY(-50%);
    }
    .fp-crosshair::after {
      left: 50%; top: 0; bottom: 0; width: 1px;
      transform: translateX(-50%);
    }
    .fp-crosshair.visible { display: block; }

    /* ─── Chat Box ─── */
    .chat-box {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 320px;
      max-height: 300px;
      background: rgba(12, 14, 24, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(255,255,255,0.1);
      overflow: hidden;
    }
    .chat-header {
      padding: 10px 14px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #8a9ab0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #b0b4bc;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .chat-msg {
      margin-bottom: 6px;
    }
    .chat-name {
      font-weight: 700;
      margin-right: 4px;
    }
    .player-msg .chat-name { color: #ffffff; }
    .chat-typing {
      color: #6a7080;
      font-style: italic;
      margin-bottom: 6px;
    }
    .chat-system-msg {
      color: #6a7080;
      font-style: italic;
      margin-bottom: 6px;
    }
    .chat-input-row {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 8px 10px;
      flex-shrink: 0;
    }
    .chat-input-row input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 10px;
      color: #d0d4dc;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .chat-input-row input::placeholder { color: #4a5060; }
    .chat-input-row input:focus { border-color: rgba(255,255,255,0.15); }
    .chat-input-row input:disabled { opacity: 0.4; }

    /* ─── Deep Talk Panel ─── */
    .deep-talk-panel {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(8, 10, 18, 0.98);
      z-index: 100;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      color: #c8ccd4;
      font-size: 13px;
    }

    .dt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .dt-agent-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dt-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
    }
    .dt-agent-name {
      font-size: 14px;
      font-weight: 700;
      color: #e8ecf4;
    }
    .dt-status {
      font-size: 11px;
      color: #6a7080;
      margin-top: 2px;
    }
    .dt-controls {
      display: flex;
      gap: 8px;
    }
    .dt-btn {
      padding: 6px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      color: #b0b4bc;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dt-btn:hover { background: rgba(255,255,255,0.1); }
    .dt-stop-btn { border-color: rgba(238,68,68,0.4); color: #ff6666; }
    .dt-stop-btn:hover { background: rgba(238,68,68,0.15); }

    .dt-output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      line-height: 1.6;
    }
    .dt-output::-webkit-scrollbar { width: 6px; }
    .dt-output::-webkit-scrollbar-track { background: transparent; }
    .dt-output::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    .dt-msg { margin-bottom: 8px; }

    .dt-msg-user {
      border-left: 3px solid #4a9eff;
      background: rgba(74, 158, 255, 0.06);
      padding: 8px 14px;
      border-radius: 0 6px 6px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .dt-msg-assistant {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 4px 0;
    }
    .dt-msg-tool {
      border-left: 3px solid #44dd88;
      padding: 6px 12px;
      background: rgba(68, 221, 136, 0.04);
      border-radius: 0 6px 6px 0;
    }
    .dt-tool-badge {
      display: inline-block;
      background: rgba(68, 221, 136, 0.15);
      color: #44dd88;
      padding: 1px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 8px;
    }
    .dt-tool-inline {
      display: inline-block;
      color: #44dd88;
      font-size: 10px;
      opacity: 0.6;
      margin: 2px 4px;
    }
    .dt-tool-summary {
      color: #8a9ab0;
      font-size: 12px;
      word-break: break-all;
    }
    .dt-msg-tool-result {
      background: rgba(255,255,255,0.02);
      color: #6a7a8a;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-left: 3px;
    }
    .dt-msg-system {
      color: #6a7080;
      font-style: italic;
      font-size: 12px;
      padding: 2px 0;
    }
    .dt-error { color: #ff6666 !important; }

    .dt-input-row {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 12px 20px;
      flex-shrink: 0;
    }
    .dt-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px 14px;
      color: #d0d4dc;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .dt-input::placeholder { color: #4a5060; }
    .dt-input:focus { border-color: rgba(255,255,255,0.2); }

    /* Execute button in dialog tasks */
    .task-execute-btn {
      float: right;
      padding: 4px 12px;
      background: rgba(68, 221, 136, 0.12);
      border: 1px solid rgba(68, 221, 136, 0.3);
      border-radius: 4px;
      color: #44dd88;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .task-execute-btn:hover {
      background: rgba(68, 221, 136, 0.25);
    }

    /* ─── Forum Panel ─── */
    .forum-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(12, 12, 24, 0.97);
      backdrop-filter: blur(16px);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #d0d4dc;
    }
    .forum-panel.visible { display: flex; }

    .forum-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Roster sidebar */
    .forum-sidebar {
      width: 240px;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
      padding: 16px 0;
      flex-shrink: 0;
    }
    .forum-sidebar::-webkit-scrollbar { width: 4px; }
    .forum-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .forum-sidebar-header {
      padding: 0 16px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #e8ecf4;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
    }

    .forum-era-header {
      padding: 10px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6a7080;
    }

    .forum-thinker-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 16px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s;
    }
    .forum-thinker-row:hover { background: rgba(255,255,255,0.04); }

    .forum-thinker-cb {
      accent-color: #ffcc44;
      cursor: pointer;
      flex-shrink: 0;
    }

    .forum-tier-badge {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #000;
      flex-shrink: 0;
    }

    .forum-thinker-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Roster controls (Select All + Allow Guests) */
    .forum-roster-controls {
      padding: 8px 16px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .forum-select-all-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #8a90a0;
      cursor: pointer;
    }
    .forum-select-all-row input { accent-color: #ffcc44; cursor: pointer; }
    .forum-guests-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #8a90a0;
      cursor: pointer;
    }
    .forum-guests-toggle input { display: none; }
    .forum-toggle-track {
      position: relative;
      width: 28px;
      height: 14px;
      background: rgba(255,255,255,0.1);
      border-radius: 7px;
      transition: background 0.2s;
    }
    .forum-toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      background: #6a7080;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .forum-guests-toggle input:checked ~ .forum-toggle-track {
      background: rgba(136, 204, 170, 0.3);
    }
    .forum-guests-toggle input:checked ~ .forum-toggle-track .forum-toggle-thumb {
      transform: translateX(14px);
      background: #88ccaa;
    }

    /* Main debate area */
    .forum-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .forum-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .forum-title {
      font-size: 16px;
      font-weight: 700;
      color: #e8ecf4;
    }
    .forum-close-btn {
      cursor: pointer;
      color: #6a7080;
      font-size: 18px;
      padding: 0 6px;
      transition: color 0.15s;
      background: none;
      border: none;
      font-family: inherit;
    }
    .forum-close-btn:hover { color: #d0d4dc; }

    /* Topic input row */
    .forum-topic-row {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .forum-topic-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 8px 14px;
      color: #d0d4dc;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .forum-topic-input:focus { border-color: rgba(255,255,255,0.2); }
    .forum-topic-input::placeholder { color: #4a5060; }

    .forum-submit-btn {
      padding: 8px 20px;
      background: rgba(255, 204, 68, 0.15);
      border: 1px solid rgba(255, 204, 68, 0.3);
      border-radius: 6px;
      color: #ffcc44;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .forum-submit-btn:hover { background: rgba(255, 204, 68, 0.25); }
    .forum-submit-btn:disabled { opacity: 0.4; cursor: default; }

    /* Debate log */
    .forum-debate-log {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .forum-debate-log::-webkit-scrollbar { width: 4px; }
    .forum-debate-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .forum-sys-msg {
      color: #6a7080;
      font-size: 12px;
      font-style: italic;
      margin-bottom: 10px;
      padding: 4px 0;
    }
    .forum-loading {
      animation: forum-pulse 1.5s ease-in-out infinite;
    }
    @keyframes forum-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .forum-response {
      border-left: 3px solid #888;
      padding: 10px 16px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.02);
      border-radius: 0 8px 8px 0;
    }
    .forum-resp-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .forum-resp-name {
      font-size: 13px;
      font-weight: 700;
    }
    .forum-reply-to {
      font-size: 10px;
      color: #6a7080;
      font-style: italic;
    }
    .forum-resp-text {
      font-size: 13px;
      line-height: 1.6;
      color: #c8ccd4;
    }

    /* Follow-up chips */
    .forum-followups {
      padding: 0 20px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }
    .forum-followup-chip {
      padding: 4px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      font-size: 11px;
      color: #b0b4bc;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .forum-followup-chip:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
    }

    /* Follow-up input */
    .forum-followup-row {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .forum-followup-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px 14px;
      color: #d0d4dc;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .forum-followup-input:focus { border-color: rgba(255,255,255,0.15); }
    .forum-followup-input::placeholder { color: #4a5060; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="fp-crosshair" id="fp-crosshair"></div>
    <div id="ui-overlay">
      <div class="status-hud" id="status-hud"></div>
      <div class="all-tasks-panel" id="all-tasks-panel"></div>
      <div class="dialog-panel" id="dialog-panel"></div>
      <div class="chat-box" id="chat-box">
        <div class="chat-header">Campus Chatter</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Talk to the team..." autocomplete="off" />
        </div>
      </div>
      <div class="interact-prompt" id="interact-prompt">Press E to interact</div>
    </div>
  </div>

  <!-- Forum Panel (full-screen overlay) -->
  <div class="forum-panel" id="forum-panel">
    <div class="forum-layout">
      <div class="forum-sidebar">
        <div class="forum-sidebar-header">Roster</div>
        <div id="forum-roster"></div>
      </div>
      <div class="forum-main">
        <div class="forum-header">
          <span class="forum-title">The Forum — Assembly of History's Greatest Minds</span>
          <button class="forum-close-btn" id="forum-close-btn">✕</button>
        </div>
        <div class="forum-topic-row">
          <input type="text" class="forum-topic-input" id="forum-topic-input"
                 placeholder="Pose a question or topic for debate..." autocomplete="off" />
          <button class="forum-submit-btn" id="forum-submit-btn">Begin Debate</button>
        </div>
        <div class="forum-debate-log" id="forum-debate-log">
          <div class="forum-sys-msg">Select thinkers from the roster, then pose a topic to begin.</div>
        </div>
        <div class="forum-followups" id="forum-followups"></div>
        <div class="forum-followup-row">
          <input type="text" class="forum-followup-input" id="forum-followup-input"
                 placeholder="Ask a follow-up question..." autocomplete="off" />
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
