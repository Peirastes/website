    <style>
        html, body {
            height: 100%;
        }

        main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .project-detail {
            height: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        #lab-container {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
            flex: 1;
        }

        @media (max-width: 768px) {
            #lab-container {
                height: 75vh;
            }
        }

        @media (max-width: 480px) {
            #lab-container {
                height: 60vh;
            }
        }

        @media (max-height: 600px) {
            #lab-container {
                height: 85vh;
            }
        }
    </style>
    <script src="../js/main.js"></script>

<body class="fullwidth-app">

        <h1>Peirastes</h1>

    <div class="content">
        <main>
            <section class="project-detail">
                <iframe id="lab-container" src="capacitor_lab.html" title="Capacitor Dielectric Lab"></iframe>
            </section>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Cole Prather</p>
    </footer>

    <div id="lightbox-overlay">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Full Image">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const overlay = document.getElementById("lightbox-overlay");
            if (!overlay) return;

            const closeBtn = document.getElementById("lightbox-close");
            document.querySelectorAll(".lightbox-trigger").forEach(link => {
                link.addEventListener("click", function(e) {
                    e.preventDefault();
                    const img = document.getElementById("lightbox-img");
                    img.src = this.getAttribute("href");
                    overlay.style.display = "flex";
                });
            });

            closeBtn.addEventListener("click", function() {
                overlay.style.display = "none";
            });

            overlay.addEventListener("click", function(e) {
                if (e.target === overlay) {
                    overlay.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
