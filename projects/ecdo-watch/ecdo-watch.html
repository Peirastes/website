<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECDO Watch — Peirastes</title>
  <meta name="description" content="Falsification-first geophysics monitoring for ECDO theory">
  
  <!-- React and Recharts from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* ECDO Watch specific styles */
    .ecdo-container {
      background: #08080c;
      min-height: 100vh;
      color: #e8e8ed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .ecdo-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .ecdo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #252532;
    }
    
    .ecdo-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: #e8e8ed;
    }
    
    .ecdo-header .subtitle {
      color: #7a7a8c;
      font-size: 13px;
      margin: 0;
    }
    
    .ecdo-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    
    .ecdo-card {
      background: #0f0f15;
      border: 1px solid #252532;
      border-radius: 10px;
      overflow: hidden;
    }
    
    .ecdo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #252532;
      background: #16161f;
    }
    
    .ecdo-card-body {
      padding: 16px;
    }
    
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    
    @media (max-width: 1024px) {
      .span-4, .span-6, .span-8 { grid-column: span 6; }
    }
    
    @media (max-width: 768px) {
      .span-4, .span-6, .span-8, .span-12 { grid-column: span 12; }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Back link to match your site */
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #4a9eff;
      text-decoration: none;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Optional: Include your site's navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="../../index.html">Peirastes</a>
    </div>
    <div class="nav-links">
      <a href="../../index.html">Home</a>
      <a href="../../current-projects.html">Current Projects</a>
      <a href="../../about.html">About</a>
    </div>
  </nav>

  <div id="ecdo-root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, Area, AreaChart, Legend } = Recharts;

    // Data generators
    const generateKpData = () => {
      const data = [];
      const now = new Date();
      for (let i = 13; i >= 0; i--) {
        const date = new Date(now);
        date.setDate(date.getDate() - i);
        data.push({
          date: date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
          kp: Math.random() * 4 + (Math.random() > 0.85 ? 3 : 0),
        });
      }
      return data;
    };

    const generateLODData = () => {
      const data = [];
      const now = new Date();
      for (let i = 364; i >= 0; i--) {
        const date = new Date(now);
        date.setDate(date.getDate() - i);
        const seasonal = Math.sin((i / 365) * 2 * Math.PI) * 0.8;
        const noise = (Math.random() - 0.5) * 1.5;
        data.push({ date: date.toISOString().split('T')[0], z: seasonal + noise });
      }
      return data;
    };

    const generateHistoricalAA = () => {
      const data = [];
      for (let year = 1868; year <= 2026; year++) {
        const centuryTrend = 15 + ((year - 1868) / 150) * 10;
        const solarPhase = ((year - 1868) % 11) / 11 * 2 * Math.PI;
        const solarCycle = Math.sin(solarPhase) * 8;
        const noise = (Math.random() - 0.5) * 6;
        data.push({ year, aa: Math.max(5, centuryTrend + solarCycle + noise) });
      }
      return data;
    };

    const generateHistoricalPM = () => {
      const data = [];
      for (let year = 1846; year <= 2026; year++) {
        let amplitude = 170;
        if (year >= 1910 && year <= 1915) amplitude = 200;
        if (year >= 1920 && year <= 1940) amplitude = 100;
        if (year >= 2015) amplitude = 80;
        const beatPhase = ((year - 1846) % 6.3) / 6.3 * 2 * Math.PI;
        const beat = Math.sin(beatPhase) * 30;
        const noise = (Math.random() - 0.5) * 20;
        data.push({ year, amplitude: Math.max(50, amplitude + beat + noise) });
      }
      return data;
    };

    const generateMagData = () => {
      const data = [];
      const now = new Date();
      for (let i = 179; i >= 0; i--) {
        const date = new Date(now);
        date.setDate(date.getDate() - i);
        data.push({
          date: date.toISOString().split('T')[0],
          bou: (Math.random() - 0.5) * 2,
          hon: (Math.random() - 0.5) * 2,
          sjg: (Math.random() - 0.5) * 2,
          composite: (Math.random() - 0.5) * 1.5,
        });
      }
      return data;
    };

    // Components
    const StatusBanner = ({ level }) => {
      const config = {
        NOMINAL: { color: '#10b981', text: 'All parameters within historical bounds' },
        ELEVATED_DIAGNOSTIC: { color: '#f59e0b', text: 'Single-channel anomaly detected' },
        WATCH: { color: '#ef4444', text: 'Multi-channel coherent anomaly' },
      };
      const c = config[level] || config.NOMINAL;
      
      return (
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          background: '#0f0f15', border: '1px solid #252532', borderLeft: `4px solid ${c.color}`,
          borderRadius: 10, padding: '16px 20px', marginBottom: 16, flexWrap: 'wrap', gap: 16
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 12, height: 12, borderRadius: '50%', background: c.color, animation: 'pulse 2s infinite' }} />
            <div>
              <h2 style={{ fontFamily: 'monospace', fontSize: 18, margin: 0, color: '#e8e8ed' }}>{level}</h2>
              <p style={{ fontSize: 13, color: '#7a7a8c', margin: 0 }}>{c.text}</p>
            </div>
          </div>
          <div style={{ fontSize: 11, color: '#7a7a8c', maxWidth: 280, textAlign: 'right' }}>
            ⚠️ Experimental analysis tool, NOT a prediction system
          </div>
        </div>
      );
    };

    const Card = ({ step, title, status, children, span = 6 }) => {
      const statusColors = {
        OPEN: '#10b981', NOMINAL: '#10b981', OK: '#10b981',
        CLOSED: '#ef4444', SUPPRESSED: '#ef4444',
        ELEVATED: '#f59e0b',
      };
      
      return (
        <div className={`ecdo-card span-${span}`}>
          <div className="ecdo-card-header">
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {step && <span style={{
                fontFamily: 'monospace', fontSize: 10, color: '#7a7a8c',
                background: '#252532', padding: '2px 6px', borderRadius: 3
              }}>STEP {step}</span>}
              <h3 style={{ fontSize: 14, fontWeight: 600, margin: 0, color: '#e8e8ed' }}>{title}</h3>
            </div>
            <span style={{
              fontFamily: 'monospace', fontSize: 10, fontWeight: 600,
              padding: '4px 8px', borderRadius: 4, textTransform: 'uppercase',
              background: `${statusColors[status]}22`, color: statusColors[status]
            }}>{status}</span>
          </div>
          <div className="ecdo-card-body">{children}</div>
        </div>
      );
    };

    const Metric = ({ label, value, status }) => {
      const colors = { positive: '#10b981', negative: '#ef4444', warning: '#f59e0b' };
      return (
        <div style={{ flex: 1, minWidth: 70, background: '#16161f', borderRadius: 6, padding: '10px 12px' }}>
          <div style={{ fontSize: 10, color: '#7a7a8c', textTransform: 'uppercase', marginBottom: 4 }}>{label}</div>
          <div style={{ fontFamily: 'monospace', fontSize: 16, fontWeight: 600, color: colors[status] || '#e8e8ed' }}>{value}</div>
        </div>
      );
    };

    // Main Dashboard
    function ECDOWatchDashboard() {
      const kpData = useMemo(() => generateKpData(), []);
      const lodData = useMemo(() => generateLODData(), []);
      const aaData = useMemo(() => generateHistoricalAA(), []);
      const pmData = useMemo(() => generateHistoricalPM(), []);
      const magData = useMemo(() => generateMagData(), []);
      const [timeRange, setTimeRange] = useState(50);
      
      return (
        <div className="ecdo-container">
          <div className="ecdo-inner">
            <a href="../../current-projects.html" className="back-link">← Back to Projects</a>
            
            <header className="ecdo-header">
              <div>
                <h1>🌍 ECDO Watch</h1>
                <p className="subtitle">Falsification-first geophysics monitor • Tau Point approach detection</p>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontFamily: 'monospace', fontSize: 11, color: '#7a7a8c' }}>
                  Updated: {new Date().toISOString().replace('T', ' ').slice(0, 19)} UTC
                </div>
              </div>
            </header>
            
            <StatusBanner level="NOMINAL" />
            
            <div className="ecdo-grid">
              {/* Step 1: Gate */}
              <Card step={1} title="External Forcing Gate" status="OPEN" span={4}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16, padding: 16, background: '#16161f', borderRadius: 6, marginBottom: 12 }}>
                  <span style={{ fontSize: 32 }}>🛡️</span>
                  <div>
                    <div style={{ color: '#10b981', fontFamily: 'monospace', fontSize: 14, fontWeight: 600 }}>GATE OPEN</div>
                    <div style={{ color: '#7a7a8c', fontSize: 11 }}>Internal inference allowed</div>
                  </div>
                </div>
                <div style={{ height: 120 }}>
                  <ResponsiveContainer>
                    <BarChart data={kpData}>
                      <XAxis dataKey="date" tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                      <YAxis domain={[0, 9]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                      <ReferenceLine y={4} stroke="#f59e0b" strokeDasharray="3 3" />
                      <Bar dataKey="kp" fill="#4a9eff" radius={[2, 2, 0, 0]} />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <Metric label="Kp Max" value="2.3" status="positive" />
                  <Metric label="Dst" value="-12 nT" status="positive" />
                </div>
              </Card>
              
              {/* Step 2: EOP */}
              <Card step={2} title="Earth Orientation (LOD)" status="NOMINAL" span={4}>
                <div style={{ height: 140 }}>
                  <ResponsiveContainer>
                    <AreaChart data={lodData.slice(-90)}>
                      <defs>
                        <linearGradient id="lodGrad" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#4a9eff" stopOpacity={0.3}/>
                          <stop offset="95%" stopColor="#4a9eff" stopOpacity={0}/>
                        </linearGradient>
                      </defs>
                      <XAxis dataKey="date" tick={false} />
                      <YAxis domain={[-3, 3]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                      <ReferenceLine y={2.5} stroke="#f59e0b" strokeDasharray="3 3" />
                      <ReferenceLine y={-2.5} stroke="#f59e0b" strokeDasharray="3 3" />
                      <Area type="monotone" dataKey="z" stroke="#4a9eff" fill="url(#lodGrad)" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <Metric label="LOD z" value="0.82" status="positive" />
                  <Metric label="PM Drift z" value="0.41" status="positive" />
                </div>
              </Card>
              
              {/* Step 3: C20 */}
              <Card step={3} title="Mass Distribution (C20)" status="OK" span={4}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: '#16161f', borderRadius: 6, marginBottom: 12, fontSize: 11, color: '#7a7a8c' }}>
                  📡 GRACE-FO data age: <strong style={{ color: '#e8e8ed' }}>47 days</strong>
                </div>
                <div style={{ height: 100 }}>
                  <ResponsiveContainer>
                    <LineChart data={lodData.slice(-60)}>
                      <XAxis dataKey="date" tick={false} />
                      <YAxis domain={[-3, 3]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                      <ReferenceLine y={2.5} stroke="#f59e0b" strokeDasharray="3 3" />
                      <ReferenceLine y={-2.5} stroke="#f59e0b" strokeDasharray="3 3" />
                      <Line type="monotone" dataKey="z" stroke="#10b981" dot={false} strokeWidth={2} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <Metric label="C20 z" value="0.31" status="positive" />
                  <Metric label="vs GIA" value="Normal" status="positive" />
                </div>
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid #252532', fontSize: 11, color: '#7a7a8c', textAlign: 'center' }}>
                  ⏱️ Lagged confirmatory channel
                </div>
              </Card>
              
              {/* Step 4: Magnetometer */}
              <Card step={4} title="Ground Magnetic (Multi-Station)" status="NOMINAL" span={8}>
                <div style={{ height: 180 }}>
                  <ResponsiveContainer>
                    <LineChart data={magData.slice(-60)}>
                      <XAxis dataKey="date" tick={false} />
                      <YAxis domain={[-3, 3]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                      <ReferenceLine y={2} stroke="#f59e0b" strokeDasharray="3 3" />
                      <ReferenceLine y={-2} stroke="#f59e0b" strokeDasharray="3 3" />
                      <Line type="monotone" dataKey="bou" stroke="#4a9eff" dot={false} strokeWidth={1} opacity={0.5} name="Boulder" />
                      <Line type="monotone" dataKey="hon" stroke="#8b5cf6" dot={false} strokeWidth={1} opacity={0.5} name="Honolulu" />
                      <Line type="monotone" dataKey="sjg" stroke="#10b981" dot={false} strokeWidth={1} opacity={0.5} name="San Juan" />
                      <Line type="monotone" dataKey="composite" stroke="#fff" dot={false} strokeWidth={2} name="Composite" />
                      <Legend wrapperStyle={{ fontSize: 10 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
                <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <Metric label="Composite z" value="0.56" status="positive" />
                  <Metric label="Stations" value="4/4" status="positive" />
                  <Metric label="Flag" value="✓ No" status="positive" />
                </div>
              </Card>
              
              {/* Step 5: Coherence */}
              <Card step={5} title="Cross-Channel Coherence" status="NOMINAL" span={4}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
                  <div style={{ background: '#16161f', borderRadius: 6, padding: 12, textAlign: 'center' }}>
                    <div style={{ fontSize: 10, color: '#7a7a8c', marginBottom: 4 }}>QUIET DAYS</div>
                    <div style={{ fontFamily: 'monospace', fontSize: 20, fontWeight: 600, color: '#4a9eff' }}>18</div>
                  </div>
                  <div style={{ background: '#16161f', borderRadius: 6, padding: 12, textAlign: 'center' }}>
                    <div style={{ fontSize: 10, color: '#7a7a8c', marginBottom: 4 }}>PERCENTILE</div>
                    <div style={{ fontFamily: 'monospace', fontSize: 20, fontWeight: 600, color: '#10b981' }}>42nd</div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <Metric label="EOP↔MAG r" value="0.12" />
                  <Metric label="Status" value="Valid" status="positive" />
                </div>
              </Card>
              
              {/* Historical Section */}
              <Card title="📊 Century-Scale Historical Context" span={12}>
                <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
                  {[10, 50, 100, 150].map(y => (
                    <button key={y} onClick={() => setTimeRange(y)} style={{
                      background: timeRange === y ? '#4a9eff' : '#16161f',
                      border: '1px solid #252532', color: timeRange === y ? '#fff' : '#7a7a8c',
                      padding: '4px 12px', borderRadius: 4, fontSize: 11, fontFamily: 'monospace', cursor: 'pointer'
                    }}>{y}Y</button>
                  ))}
                </div>
                
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 16 }}>
                  <div>
                    <h4 style={{ fontSize: 12, color: '#7a7a8c', marginBottom: 8 }}>Geomagnetic aa Index (since 1868)</h4>
                    <div style={{ height: 200 }}>
                      <ResponsiveContainer>
                        <AreaChart data={aaData.slice(-timeRange)}>
                          <defs>
                            <linearGradient id="aaGrad" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="5%" stopColor="#f59e0b" stopOpacity={0.3}/>
                              <stop offset="95%" stopColor="#f59e0b" stopOpacity={0}/>
                            </linearGradient>
                          </defs>
                          <XAxis dataKey="year" tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                          <YAxis domain={[0, 40]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                          <Tooltip contentStyle={{ background: '#16161f', border: '1px solid #252532', borderRadius: 6 }} />
                          <Area type="monotone" dataKey="aa" stroke="#f59e0b" fill="url(#aaGrad)" />
                        </AreaChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                  
                  <div>
                    <h4 style={{ fontSize: 12, color: '#7a7a8c', marginBottom: 8 }}>Polar Motion Amplitude (since 1846)</h4>
                    <div style={{ height: 200 }}>
                      <ResponsiveContainer>
                        <AreaChart data={pmData.slice(-timeRange)}>
                          <defs>
                            <linearGradient id="pmGrad" x1="0" y1="0" x2="0" y2="1">
                              <stop offset="5%" stopColor="#10b981" stopOpacity={0.3}/>
                              <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                            </linearGradient>
                          </defs>
                          <XAxis dataKey="year" tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                          <YAxis domain={[0, 250]} tick={{ fontSize: 9, fill: '#7a7a8c' }} />
                          <Tooltip contentStyle={{ background: '#16161f', border: '1px solid #252532', borderRadius: 6 }} />
                          <Area type="monotone" dataKey="amplitude" stroke="#10b981" fill="url(#pmGrad)" />
                        </AreaChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>
                
                <div style={{ display: 'flex', gap: 16, marginTop: 16, flexWrap: 'wrap' }}>
                  <Metric label="aa Record" value="1868–Now" />
                  <Metric label="PM Record" value="1846–Now" />
                  <Metric label="LOD Record" value="1623–Now" />
                  <Metric label="Current Regime" value="Within Bounds" status="positive" />
                </div>
                
                <div style={{ marginTop: 16, padding: 12, background: '#16161f', borderRadius: 6, fontSize: 11, color: '#7a7a8c' }}>
                  📚 <strong>Data sources:</strong> aa index from IAGA/BGS (1868–present); Polar motion from IERS C01 (1846–present); LOD from IERS (yearly since 1623).
                </div>
              </Card>
            </div>
            
            <footer style={{ marginTop: 24, paddingTop: 16, borderTop: '1px solid #252532', fontSize: 11, color: '#7a7a8c', textAlign: 'center' }}>
              ⚠️ This is an experimental analysis tool, NOT a prediction system. Watch levels indicate statistical anomalies relative to historical baselines, not probabilities of future events. The ECDO theory remains a hypothesis under investigation.
            </footer>
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('ecdo-root'));
    root.render(<ECDOWatchDashboard />);
  </script>
</body>
</html>
