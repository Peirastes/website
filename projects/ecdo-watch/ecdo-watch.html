<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECDO Watch — Geophysics Monitor</title>
  
  <!-- React 18 (jsDelivr has proper CORS) -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Globe.gl (bundles three.js internally) -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Babel for JSX transpilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08080c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* Custom scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a24;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #3a3a4a;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a5a;
    }
    
    /* Button styling */
    button {
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      opacity: 0.9;
    }

    /* Leaflet dark theme overrides */
    .leaflet-container { background: #08080c; }
    .leaflet-popup-content-wrapper { background: rgba(15,15,21,0.95); color: #e8e8ed; border: 1px solid #252532; border-radius: 6px; font-size: 11px; }
    .leaflet-popup-tip { background: rgba(15,15,21,0.95); }
    .leaflet-popup-close-button { color: #7a7a8c !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Load the JSX component -->
  <script type="text/babel" src="ecdo-watch.jsx?v=20260220"></script>
  
  <!-- Mount the app -->
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ECDOWatchDashboard />);
  </script>
</body>
</html>
