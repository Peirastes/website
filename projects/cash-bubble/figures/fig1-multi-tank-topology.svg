<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <rect width="800" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#FF5500"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#FF5500"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0,0 3.5,10 7" fill="#FF5500"/>
    </marker>
    <!-- wave pattern for investment tank -->
    <pattern id="springL" patternUnits="userSpaceOnUse" width="6" height="24" patternTransform="translate(0,0)">
      <path d="M3,0 Q0,6 3,12 Q6,18 3,24" fill="none" stroke="#0088AA" stroke-width="1.5"/>
    </pattern>
    <pattern id="springR" patternUnits="userSpaceOnUse" width="6" height="24" patternTransform="translate(0,0)">
      <path d="M3,0 Q6,6 3,12 Q0,18 3,24" fill="none" stroke="#0088AA" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- ====== CHECKING TANK (open top) ====== -->
  <g transform="translate(280, 30)">
    <!-- Tank body - open top (no top line) -->
    <rect x="0" y="0" width="240" height="100" rx="4" ry="4" fill="#FFF3E0" stroke="#333333" stroke-width="2"/>
    <!-- Open top indicator: erase top border, draw side tops only -->
    <line x1="1" y1="0" x2="239" y2="0" stroke="#FFF3E0" stroke-width="3"/>
    <!-- Open-top bracket marks -->
    <line x1="0" y1="0" x2="0" y2="15" stroke="#333333" stroke-width="2.5"/>
    <line x1="240" y1="0" x2="240" y2="15" stroke="#333333" stroke-width="2.5"/>
    <line x1="0" y1="100" x2="240" y2="100" stroke="#333333" stroke-width="2"/>
    <line x1="0" y1="15" x2="0" y2="100" stroke="#333333" stroke-width="2"/>
    <line x1="240" y1="15" x2="240" y2="100" stroke="#333333" stroke-width="2"/>
    <!-- Water level fill -->
    <rect x="2" y="40" width="236" height="58" rx="2" fill="rgba(0,136,170,0.12)"/>
    <!-- Labels -->
    <text x="120" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333333">CHECKING</text>
    <text x="120" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999999" font-style="italic">(V</text>
    <text x="135" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#999999">1</text>
    <text x="140" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999999" font-style="italic">)</text>
    <text x="120" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Open tank</text>
  </g>

  <!-- Income arrow -->
  <line x1="80" y1="80" x2="270" y2="80" stroke="#FF5500" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="80" y="70" font-family="Georgia, serif" font-size="15" fill="#FF5500" font-weight="bold">Income</text>
  <text x="80" y="106" font-family="Georgia, serif" font-size="12" fill="#999999" font-style="italic">(Q<tspan font-size="9" dy="3">in</tspan><tspan dy="-3">)</tspan></text>

  <!-- Spending arrow -->
  <line x1="530" y1="80" x2="710" y2="80" stroke="#FF5500" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="630" y="70" font-family="Georgia, serif" font-size="15" fill="#FF5500" font-weight="bold">Spending</text>
  <text x="640" y="106" font-family="Georgia, serif" font-size="12" fill="#999999" font-style="italic">(Q<tspan font-size="9" dy="3">out</tspan><tspan dy="-3">)</tspan></text>

  <!-- Transfer arrow: Checking → Savings -->
  <line x1="400" y1="135" x2="400" y2="175" stroke="#FF5500" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <text x="435" y="162" font-family="Georgia, serif" font-size="13" fill="#FF5500" font-style="italic">τ<tspan font-size="9" dy="3">12</tspan></text>

  <!-- ====== SAVINGS TANK (sealed/pressurized) ====== -->
  <g transform="translate(280, 185)">
    <!-- Tank body - sealed -->
    <rect x="0" y="0" width="240" height="100" rx="4" ry="4" fill="#E0F4F4" stroke="#333333" stroke-width="2"/>
    <!-- Sealed top with lid details -->
    <line x1="-8" y1="0" x2="248" y2="0" stroke="#333333" stroke-width="3.5"/>
    <!-- Pressure gauge icon -->
    <circle cx="220" cy="15" r="8" fill="none" stroke="#0088AA" stroke-width="1.5"/>
    <line x1="220" y1="15" x2="224" y2="10" stroke="#0088AA" stroke-width="1.5"/>
    <!-- Water level fill (higher = more pressure) -->
    <rect x="2" y="30" width="236" height="68" rx="2" fill="rgba(0,136,170,0.18)"/>
    <!-- Labels -->
    <text x="120" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333333">SAVINGS</text>
    <text x="120" y="63" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999999" font-style="italic">(V<tspan font-size="10" dy="3">2</tspan><tspan dy="-3">)</tspan></text>
    <text x="120" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Pressurized</text>
  </g>

  <!-- Transfer arrow: Savings → Investment -->
  <line x1="400" y1="290" x2="400" y2="330" stroke="#FF5500" stroke-width="2.5" marker-end="url(#arrowD)"/>
  <text x="435" y="317" font-family="Georgia, serif" font-size="13" fill="#FF5500" font-style="italic">τ<tspan font-size="9" dy="3">23</tspan></text>

  <!-- ====== INVESTMENT TANK (compressible / spring sides) ====== -->
  <g transform="translate(280, 340)">
    <!-- Tank body -->
    <rect x="0" y="0" width="240" height="100" rx="4" ry="4" fill="#FFF3E0" stroke="#333333" stroke-width="2"/>
    <!-- Sealed top -->
    <line x1="-8" y1="0" x2="248" y2="0" stroke="#333333" stroke-width="3.5"/>
    <!-- Wavy/spring left side overlay -->
    <path d="M0,10 Q-12,22 0,34 Q12,46 0,58 Q-12,70 0,82 Q8,90 0,100" fill="none" stroke="#0088AA" stroke-width="2" stroke-dasharray="none"/>
    <!-- Wavy/spring right side overlay -->
    <path d="M240,10 Q252,22 240,34 Q228,46 240,58 Q252,70 240,82 Q232,90 240,100" fill="none" stroke="#0088AA" stroke-width="2"/>
    <!-- Spring arrows on sides -->
    <line x1="-20" y1="50" x2="-6" y2="50" stroke="#0088AA" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <line x1="260" y1="50" x2="246" y2="50" stroke="#0088AA" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <!-- Inner gas/bubble region -->
    <ellipse cx="120" cy="55" rx="80" ry="30" fill="rgba(255,85,0,0.08)" stroke="rgba(255,85,0,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Labels -->
    <text x="120" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333333">INVESTMENT</text>
    <text x="120" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#999999" font-style="italic">(V<tspan font-size="10" dy="3">3</tspan><tspan dy="-3">)</tspan></text>
    <text x="120" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Compressible</text>
  </g>

  <!-- Figure label -->
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Figure 1: Multi-tank topology for a three-account system.</text>
</svg>