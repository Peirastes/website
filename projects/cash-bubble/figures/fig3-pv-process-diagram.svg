<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="axArr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#333333"/>
    </marker>
    <marker id="pathArr1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#FF5500"/>
    </marker>
    <marker id="pathArr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#0088AA"/>
    </marker>
  </defs>

  <!-- Axes -->
  <!-- Y-axis (P = Price per share) -->
  <line x1="120" y1="420" x2="120" y2="50" stroke="#333333" stroke-width="2" marker-end="url(#axArr)"/>
  <text x="55" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#333333" font-style="italic" transform="rotate(-90,55,230)">P (Price per share)</text>

  <!-- X-axis (n = Shares held) -->
  <line x1="120" y1="420" x2="720" y2="420" stroke="#333333" stroke-width="2" marker-end="url(#axArr)"/>
  <text x="420" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#333333" font-style="italic">n (Shares held)</text>

  <!-- State A: high n, high P → top right -->
  <!-- A at (600, 100) in diagram coords → SVG (600, 100) -->
  <circle cx="600" cy="110" r="7" fill="#FF5500" stroke="#333333" stroke-width="1.5"/>
  <text x="620" y="100" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333333">A</text>
  <text x="620" y="120" font-family="Georgia, serif" font-size="12" fill="#999999" font-style="italic">(n₁, P₁)</text>

  <!-- State B: low n, low P → bottom left -->
  <circle cx="220" cy="360" r="7" fill="#0088AA" stroke="#333333" stroke-width="1.5"/>
  <text x="175" y="370" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#333333">B</text>
  <text x="160" y="390" font-family="Georgia, serif" font-size="12" fill="#999999" font-style="italic">(n₂, P₂)</text>

  <!-- Path 1: bows high (sell early at higher prices) — orange -->
  <!-- Shaded area under Path 1 -->
  <path d="M600,110 C480,90 320,120 220,360 L220,420 L600,420 Z" fill="rgba(255,85,0,0.12)" stroke="none"/>
  <!-- Path 1 curve -->
  <path d="M600,110 C480,90 320,120 220,360" fill="none" stroke="#FF5500" stroke-width="3" stroke-linecap="round"/>
  <!-- Path 1 arrowhead (midpoint annotation) -->
  <text x="340" y="140" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#FF5500">Path 1</text>
  <text x="340" y="158" font-family="Georgia, serif" font-size="12" fill="#FF5500">Sell early at higher P</text>

  <!-- Path 2: bows low (sell late at lower prices) — cyan -->
  <!-- Shaded area under Path 2 -->
  <path d="M600,110 C580,300 400,390 220,360 L220,420 L600,420 Z" fill="rgba(0,136,170,0.12)" stroke="none"/>
  <!-- Path 2 curve -->
  <path d="M600,110 C580,300 400,390 220,360" fill="none" stroke="#0088AA" stroke-width="3" stroke-linecap="round" stroke-dasharray="10,5"/>
  <!-- Path 2 label -->
  <text x="510" y="330" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0088AA">Path 2</text>
  <text x="510" y="348" font-family="Georgia, serif" font-size="12" fill="#0088AA">Sell late at lower P</text>

  <!-- Work annotations -->
  <!-- W₁ label near Path 1 area -->
  <text x="450" y="260" font-family="Georgia, serif" font-size="16" fill="#FF5500" font-style="italic" font-weight="bold">W₁</text>
  <!-- W₂ label near Path 2 area -->
  <text x="350" y="395" font-family="Georgia, serif" font-size="16" fill="#0088AA" font-style="italic" font-weight="bold">W₂</text>

  <!-- Annotation: W₁ > W₂ -->
  <text x="700" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#333333" font-weight="bold">W₁ &gt; W₂</text>
  <text x="700" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#999999">Path determines</text>
  <text x="700" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#999999">realized proceeds</text>

  <!-- Dashed reference lines from A and B to axes -->
  <line x1="600" y1="110" x2="600" y2="420" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="600" y1="110" x2="120" y2="110" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="220" y1="360" x2="120" y2="360" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="220" y1="360" x2="220" y2="420" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Axis labels at reference points -->
  <text x="110" y="115" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#999999" font-style="italic">P₁</text>
  <text x="110" y="365" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#999999" font-style="italic">P₂</text>
  <text x="220" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999" font-style="italic">n₂</text>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999" font-style="italic">n₁</text>

  <!-- Figure label -->
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Figure 3: P-V process diagram showing path-dependent work (realized proceeds).</text>
</svg>