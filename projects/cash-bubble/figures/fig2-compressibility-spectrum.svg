<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <rect width="800" height="280" fill="#FFFFFF"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#FF5500"/>
    </marker>
    <linearGradient id="specGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088AA"/>
      <stop offset="25%" stop-color="#3399BB"/>
      <stop offset="50%" stop-color="#AA7744"/>
      <stop offset="75%" stop-color="#DD6622"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- Title row: category labels -->
  <!-- Segment definitions: x, width, fill, category, instruments -->
  <!-- 5 segments spanning x=60..740 (680px total), each 136px wide -->

  <!-- Segment 1: Incompressible (Cash) -->
  <rect x="60" y="90" width="136" height="60" rx="0" ry="0" fill="#E0F4F4" stroke="#0088AA" stroke-width="1.5"/>
  <text x="128" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#0088AA">Incompressible</text>
  <text x="128" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333333">Cash &amp; Deposits</text>
  <text x="128" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">Checking, savings,</text>
  <text x="128" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">money market</text>

  <!-- Segment 2: Slightly compressible (Bonds) -->
  <rect x="196" y="90" width="136" height="60" rx="0" ry="0" fill="#D6EDE8" stroke="#2E998A" stroke-width="1.5"/>
  <text x="264" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#2E998A">Slightly</text>
  <text x="264" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333333">Bonds</text>
  <text x="264" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">Treasuries, munis,</text>
  <text x="264" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">investment grade</text>

  <!-- Segment 3: Moderately compressible (Real Estate) -->
  <rect x="332" y="90" width="136" height="60" rx="0" ry="0" fill="#F5E6D0" stroke="#AA7744" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#AA7744">Moderate</text>
  <text x="400" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333333">Real Estate</text>
  <text x="400" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">REITs, property,</text>
  <text x="400" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">high-yield bonds</text>

  <!-- Segment 4: Highly compressible (Equities) -->
  <rect x="468" y="90" width="136" height="60" rx="0" ry="0" fill="#FFE0C0" stroke="#DD6622" stroke-width="1.5"/>
  <text x="536" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#DD6622">Highly</text>
  <text x="536" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333333">Equities</text>
  <text x="536" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">Stocks, ETFs,</text>
  <text x="536" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">equity funds</text>

  <!-- Segment 5: Supercompressible (Derivatives) -->
  <rect x="604" y="90" width="136" height="60" rx="0" ry="0" fill="#FFD0B0" stroke="#FF5500" stroke-width="2"/>
  <text x="672" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#FF5500">Super</text>
  <text x="672" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#333333">Derivatives</text>
  <text x="672" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">Options, leveraged</text>
  <text x="672" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999">ETFs, futures</text>

  <!-- Bottom annotation brackets linking to financial metrics -->
  <!-- Duration bracket (Bonds) -->
  <line x1="196" y1="196" x2="196" y2="208" stroke="#999999" stroke-width="1"/>
  <line x1="332" y1="196" x2="332" y2="208" stroke="#999999" stroke-width="1"/>
  <line x1="196" y1="208" x2="332" y2="208" stroke="#999999" stroke-width="1"/>
  <text x="264" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999" font-style="italic">Duration</text>

  <!-- Beta bracket (Real Estate + Equities) -->
  <line x1="332" y1="196" x2="332" y2="235" stroke="#999999" stroke-width="1"/>
  <line x1="604" y1="196" x2="604" y2="235" stroke="#999999" stroke-width="1"/>
  <line x1="332" y1="235" x2="604" y2="235" stroke="#999999" stroke-width="1"/>
  <text x="468" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999" font-style="italic">Beta (β)</text>

  <!-- Delta/Gamma bracket (Derivatives) -->
  <line x1="604" y1="196" x2="604" y2="208" stroke="#999999" stroke-width="1"/>
  <line x1="740" y1="196" x2="740" y2="208" stroke="#999999" stroke-width="1"/>
  <line x1="604" y1="208" x2="740" y2="208" stroke="#999999" stroke-width="1"/>
  <text x="672" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#999999" font-style="italic">Delta (δ), Gamma (γ)</text>

  <!-- Top: right-pointing arrow for "Increasing pressure sensitivity" -->
  <line x1="60" y1="55" x2="720" y2="55" stroke="#FF5500" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="400" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FF5500" font-weight="bold">Increasing pressure sensitivity →</text>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#333333" font-weight="bold">The Compressibility Spectrum</text>

  <!-- Figure label -->
  <text x="400" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#999999">Figure 2: Financial instruments arranged by compressibility, with associated sensitivity metrics.</text>
</svg>