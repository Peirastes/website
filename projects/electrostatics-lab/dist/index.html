<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electrostatics Lab | Interactive 3D Field Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ═══════════════════════════════════════════════════════════════
         ELECTROSTATICS LAB — v3.5 CINEMATIC CHROME (Path B)
         Carbon copy of Artemis II v3.5 chrome layered over the React
         + Three.js + leva chassis. Source: ../index.html (keep in sync).
         ═══════════════════════════════════════════════════════════════ */

      :root {
        --bg-void: #06080c;
        --gold:        #ffae20;
        --gold-soft:   rgba(255, 174, 32, 0.72);
        --gold-faint:  rgba(255, 174, 32, 0.28);
        --gold-glow:   rgba(255, 174, 32, 0.45);
        --cyan:        #7dd6ff;
        --cyan-soft:   rgba(125, 214, 255, 0.65);
        --cyan-faint:  rgba(125, 214, 255, 0.22);
        --cyan-glow:   rgba(125, 214, 255, 0.30);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg-void);
        color: #e0e0e0;
      }
      /* Push React app below the chrome row */
      body { padding-top: 5.5rem; }
      #root { position: relative; z-index: 1; }

      /* Cinematic banner backdrop */
      body::before {
        content: '';
        position: fixed; inset: 0; z-index: -2;
        background-image: url('../../../images/PeirastesBanner.jpg');
        background-size: cover;
        background-position: center;
        filter: saturate(0.55) brightness(0.32) contrast(1.05);
        opacity: 0.85;
      }
      body::after {
        content: '';
        position: fixed; inset: 0; z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(6, 8, 12, 0.65) 95%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, transparent 30%, rgba(0, 0, 0, 0.55) 100%);
      }

      .cin-grain {
        position: fixed; inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.04;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
        mix-blend-mode: overlay;
      }

      /* ─── CINEMATIC CHROME — verbatim from Artemis II v3.5 ─────────── */

      .cin-flank {
        position: fixed;
        top: max(1.6rem, env(safe-area-inset-top, 0px) + 0.6rem);
        z-index: 100;
        display: flex; flex-direction: column;
        gap: 0.4rem;
        opacity: 0; transform: translateY(-8px);
        animation: cin-fade-in 700ms ease 250ms forwards;
      }
      .cin-flank--left {
        left: max(1.6rem, env(safe-area-inset-left, 0px) + 0.6rem);
        align-items: flex-start;
      }
      .cin-flank--right {
        right: max(1.6rem, env(safe-area-inset-right, 0px) + 0.6rem);
        align-items: flex-end;
        animation-delay: 400ms;
      }

      .cin-wordmark {
        font-family: 'Cinzel', serif;
        font-size: 0.78rem; font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--gold-soft);
        text-decoration: none;
        text-shadow: 0 0 8px var(--gold-glow);
        transition: color 200ms, text-shadow 200ms;
        line-height: 1;
      }
      .cin-wordmark:hover {
        color: var(--gold);
        text-shadow: 0 0 14px var(--gold-glow);
      }
      .cin-version {
        font-family: 'Inter', sans-serif;
        font-size: 0.56rem; font-weight: 500;
        color: rgba(125, 214, 255, 0.55);
        letter-spacing: 0.20em;
        white-space: nowrap;
        text-transform: uppercase;
      }

      .cin-action-row { display: flex; align-items: center; gap: 0.55rem; }
      .cin-action {
        background: linear-gradient(180deg,
          rgba(20, 26, 36, 0.82) 0%,
          rgba(8, 12, 18, 0.90) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 2px solid transparent;
        border-radius: 3px;
        color: rgba(220, 220, 220, 0.62);
        font-family: 'Inter', sans-serif;
        font-size: 13px; font-weight: 500;
        padding: 4px 9px;
        cursor: pointer;
        transition: all 0.14s ease;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center; justify-content: center;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 1px 2px rgba(0, 0, 0, 0.3);
        flex: 0 0 auto;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .cin-action__glyph { display: inline-block; line-height: 1; }
      .cin-action:hover {
        color: var(--cyan);
        background: linear-gradient(180deg,
          rgba(125, 214, 255, 0.08) 0%,
          rgba(8, 12, 18, 0.85) 100%);
        border-color: rgba(125, 214, 255, 0.30);
        box-shadow:
          inset 0 1px 0 rgba(125, 214, 255, 0.15),
          0 1px 2px rgba(0, 0, 0, 0.3),
          0 0 8px var(--cyan-glow);
      }
      .cin-action--disabled, .cin-action[disabled] {
        cursor: not-allowed; opacity: 0.4;
        color: rgba(180, 180, 180, 0.5);
        border-color: rgba(255, 255, 255, 0.06);
        border-left-color: transparent;
      }
      .cin-action--disabled:hover, .cin-action[disabled]:hover {
        background: linear-gradient(180deg,
          rgba(20, 26, 36, 0.82) 0%,
          rgba(8, 12, 18, 0.90) 100%);
        border-color: rgba(255, 255, 255, 0.06);
        color: rgba(180, 180, 180, 0.5);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 1px 2px rgba(0, 0, 0, 0.3);
      }

      .cin-title {
        position: fixed;
        top: max(1.6rem, env(safe-area-inset-top, 0px) + 0.6rem);
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        animation: cin-fade-in-centered 700ms ease 350ms forwards;
      }
      .cin-title__name {
        font-family: 'Orbitron', sans-serif;
        font-size: 18px; font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        text-shadow: 0 0 14px var(--gold-glow), 0 0 32px rgba(255, 174, 32, 0.18);
        display: flex; justify-content: center; align-items: baseline;
        gap: 4px;
        margin-bottom: 4px;
        line-height: 1;
      }
      .cin-title__name span { color: var(--gold); }
      .cin-title__sub {
        font-family: 'Inter', sans-serif;
        font-size: 9px; font-weight: 500;
        color: var(--cyan-soft);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .cin-tick {
        position: fixed; width: 16px; height: 16px;
        z-index: 99; pointer-events: none;
        opacity: 0;
        animation: cin-fade-in 800ms ease 600ms forwards;
      }
      .cin-tick::before, .cin-tick::after {
        content: ''; position: absolute; background: rgba(125, 214, 255, 0.45);
      }
      .cin-tick--tl {
        top:  max(0.9rem, env(safe-area-inset-top, 0px)  + 0.3rem);
        left: max(0.9rem, env(safe-area-inset-left, 0px) + 0.3rem);
      }
      .cin-tick--tr {
        top:   max(0.9rem, env(safe-area-inset-top, 0px)   + 0.3rem);
        right: max(0.9rem, env(safe-area-inset-right, 0px) + 0.3rem);
      }
      .cin-tick--bl {
        bottom: max(0.9rem, env(safe-area-inset-bottom, 0px) + 0.3rem);
        left:   max(0.9rem, env(safe-area-inset-left, 0px)   + 0.3rem);
      }
      .cin-tick--br {
        bottom: max(0.9rem, env(safe-area-inset-bottom, 0px) + 0.3rem);
        right:  max(0.9rem, env(safe-area-inset-right, 0px)  + 0.3rem);
      }
      .cin-tick--tl::before { top: 0; left: 0;  width: 12px; height: 1px; }
      .cin-tick--tl::after  { top: 0; left: 0;  width: 1px;  height: 12px; }
      .cin-tick--tr::before { top: 0; right: 0; width: 12px; height: 1px; }
      .cin-tick--tr::after  { top: 0; right: 0; width: 1px;  height: 12px; }
      .cin-tick--bl::before { bottom: 0; left: 0;  width: 12px; height: 1px; }
      .cin-tick--bl::after  { bottom: 0; left: 0;  width: 1px;  height: 12px; }
      .cin-tick--br::before { bottom: 0; right: 0; width: 12px; height: 1px; }
      .cin-tick--br::after  { bottom: 0; right: 0; width: 1px;  height: 12px; }

      @keyframes cin-fade-in {
        0%   { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cin-fade-in-centered {
        0%   { opacity: 0; transform: translate(-50%, -8px); }
        100% { opacity: 1; transform: translate(-50%, 0); }
      }

      @media (max-width: 768px) {
        body { padding-top: 3.2rem; }
        .cin-flank--right { display: none; }
        .cin-tick--bl, .cin-tick--br { display: none; }
        .cin-flank--left { top: 0.6rem; left: 0.7rem; gap: 0.15rem; }
        .cin-wordmark    { font-size: 0.62rem; letter-spacing: 0.18em; }
        .cin-version     { font-size: 0.48rem; }
        .cin-title       { top: 0.5rem; }
        .cin-title__name { font-size: 13px; letter-spacing: 0.22em; }
        .cin-title__sub  { font-size: 8px; }
      }
      @media (max-width: 480px) {
        .cin-title__name { font-size: 11px; letter-spacing: 0.18em; }
        .cin-title__sub { display: none; }
      }
      @media (max-height: 500px) {
        .cin-flank, .cin-title { display: none; }
        .cin-tick { width: 10px; height: 10px; }
        body { padding-top: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        body::before, body::after, .cin-grain,
        .cin-flank, .cin-title, .cin-tick {
          animation: none !important; transition: none !important;
        }
        .cin-flank, .cin-tick { opacity: 1 !important; transform: translateY(0) !important; }
        .cin-title { opacity: 1 !important; transform: translateX(-50%) !important; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-7eChdqNh.js"></script>

    <!-- notes-embed mode: hide standalone cinematic chrome when framed via ?embed -->
  <style>html.embed .cin-flank,html.embed .cin-title,html.embed .cin-tick,html.embed .cin-grain{display:none !important}html.embed body{padding-top:0 !important}</style>

  <!-- instrument-canon restyle (2026-07-29): align controls/panels/fonts to Artemis II v2 / Optics / Induction. Non-destructive CSS override (plain classes + CSS vars, no rebuild). 3D-scene charge/field colors are set in Three.js, not here, so they stay. -->
  <style>
    :root{
      --bg-primary:#080b0f;--bg-secondary:#0d131b;--bg-tertiary:#16222e;
      --text-primary:rgba(255,255,255,.92);--text-secondary:rgba(255,255,255,.58);
      --accent-blue:#ffae20;   /* UI accent -> instrument amber */
      --accent-green:#7dd6ff;  /* secondary/data -> cyan */
      --accent-red:#e0533f;
    }
    html,body,#root{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    .info-panel,.legend,.tooltip{border-color:rgba(255,174,32,.26);background:rgba(10,15,22,.93);backdrop-filter:blur(12px)}
    .info-panel h2{font-family:'Orbitron',sans-serif;letter-spacing:.04em;color:#ffae20}
    .info-panel h2::before{content:''}
    .notice-panel{background:rgba(125,214,255,.10);border-color:rgba(125,214,255,.45);color:#a9e0f5}
    .slice-content h3{font-family:'Orbitron',sans-serif;color:#ffae20}
    .slice-controls button{font-family:'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;border-color:rgba(255,174,32,.3);color:rgba(255,255,255,.6)}
    .slice-controls button.active{background:linear-gradient(180deg,#ffbc3e,#e08a10);border-color:#ffae20;color:#141414}
    .slice-controls button:hover:not(.active){border-color:#ffae20;color:#ffae20}
    .slice-content .close-btn:hover{background:#e0533f}
    .fps-counter{color:rgba(125,214,255,.7)}
    [data-leva-theme]{
      --leva-colors-accent1:#c8860f !important;--leva-colors-accent2:#ffae20 !important;--leva-colors-accent3:#ffc451 !important;
      --leva-colors-elevation1:#0b1017 !important;--leva-colors-elevation2:#111a24 !important;--leva-colors-elevation3:#18242f !important;
      --leva-colors-highlight1:rgba(255,255,255,.5) !important;--leva-colors-highlight2:rgba(255,255,255,.82) !important;--leva-colors-highlight3:#fff !important;
      --leva-fonts-mono:'JetBrains Mono',monospace !important;--leva-fonts-sans:'Inter',sans-serif !important;
    }
  </style>
</head>
  <body>

    <!-- v3.5 cinematic chrome — carbon copy of Artemis II v3.5 -->
    <div class="cin-grain" aria-hidden="true"></div>

    <div class="cin-flank cin-flank--left">
      <a class="cin-wordmark" href="https://peirastes.com/" title="Back to Peirastes">PEIRASTES</a>
      <span class="cin-version">v3.5</span>
    </div>

    <div class="cin-title" aria-label="Electrostatics Lab">
      <div class="cin-title__name">Electrostatics <span>Lab</span></div>
      <div class="cin-title__sub">3D Field Visualization &mdash; Charges &middot; Lines &middot; Equipotentials</div>
    </div>

    <div class="cin-flank cin-flank--right">
      <div class="cin-action-row">
        <button class="cin-action cin-action--disabled" id="btnInfo" title="Info (coming soon)" aria-label="Info" disabled>
          <span class="cin-action__glyph">&#9432;</span>
        </button>
        <button class="cin-action cin-action--disabled" id="btnSettings" title="Settings (coming soon)" aria-label="Settings" disabled>
          <span class="cin-action__glyph">&#9881;</span>
        </button>
      </div>
    </div>

    <div class="cin-tick cin-tick--tl" aria-hidden="true"></div>
    <div class="cin-tick cin-tick--tr" aria-hidden="true"></div>
    <div class="cin-tick cin-tick--bl" aria-hidden="true"></div>
    <div class="cin-tick cin-tick--br" aria-hidden="true"></div>

    <div id="root"></div>

    <!-- Cinematic title centering — same algorithm as Artemis II v3.5 -->
    <script>
      (function () {
        const leftFlank  = document.querySelector('.cin-flank--left');
        const rightFlank = document.querySelector('.cin-flank--right');
        const title      = document.querySelector('.cin-title');
        if (!leftFlank || !rightFlank || !title) return;
        const centerTitle = () => {
          const lRect = leftFlank.getBoundingClientRect();
          const rRect = rightFlank.getBoundingClientRect();
          if (lRect.width === 0 || rRect.width === 0) return;
          title.style.left = ((lRect.right + rRect.left) / 2) + 'px';
        };
        centerTitle();
        window.addEventListener('resize', centerTitle);
        new ResizeObserver(centerTitle).observe(rightFlank);
        new ResizeObserver(centerTitle).observe(leftFlank);
        if (document.fonts) document.fonts.ready.then(centerTitle);
      })();

      /* Leva controls portal mounts a fixed-positioned panel at top: 10px right: 10px
         which collides with the cin-flank--right action buttons. Walk body's direct
         children after mount, find the leva root (any fixed element that's not chrome
         and not #root), and push it below the chrome row. */
      (function () {
        const pushLevaDown = () => {
          for (const el of document.body.children) {
            if (el.id === 'root') continue;
            if (el.classList.contains('cin-grain')) continue;
            if (el.classList.contains('cin-flank')) continue;
            if (el.classList.contains('cin-title')) continue;
            if (el.classList.contains('cin-tick')) continue;
            const cs = getComputedStyle(el);
            if (cs.position !== 'fixed') continue;
            const t = parseFloat(cs.top);
            if (!isNaN(t) && t < 88) el.style.top = '5.5rem';
          }
        };
        const obs = new MutationObserver(pushLevaDown);
        obs.observe(document.body, { childList: true });
        pushLevaDown();
        setTimeout(pushLevaDown, 250);
        setTimeout(pushLevaDown, 1500);
      })();
    </script>
  </body>
