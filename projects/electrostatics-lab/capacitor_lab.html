<script>
var E0=8.854e-12;
var D={vacuum:{k:1,l:'VACUUM',f:'Vacuum — κ = 1.0',c:'#0a0e14'},air:{k:1.0006,l:'AIR',f:'Air — κ ≈ 1.0006',c:'#0c1018'},paper:{k:3.7,l:'PAPER',f:'Paper — κ = 3.7',c:'#18140e'},glass:{k:4.7,l:'GLASS',f:'Glass — κ = 4.7',c:'#0c1420'},mica:{k:5.4,l:'MICA',f:'Mica — κ = 5.4',c:'#14101c'},rubber:{k:7,l:'RUBBER',f:'Rubber — κ = 7.0',c:'#161210'},water:{k:80,l:'H₂O',f:'Water — κ = 80',c:'#081420'},titanate:{k:300,l:'BaTiO₃',f:'BaTiO₃ — κ ≈ 300',c:'#1a1208'},srtitanate:{k:310,l:'SrTiO₃',f:'SrTiO₃ — κ ≈ 310',c:'#1c1408'}};
function cC(a,d,k){return k*E0*(a*1e-4)/(d*1e-3)}
function fSI(v,u){if(v===0)return'0 '+u;var p=[{t:1e-12,s:'p',d:1e-12},{t:1e-9,s:'n',d:1e-9},{t:1e-6,s:'μ',d:1e-6},{t:1e-3,s:'m',d:1e-3},{t:1,s:'',d:1},{t:1e3,s:'k',d:1e3}];var a2=Math.abs(v);for(var i=0;i<p.length-1;i++)if(a2<p[i+1].t)return(v/p[i].d).toFixed(3)+' '+p[i].s+u;return(v/p[p.length-1].d).toFixed(3)+' '+p[p.length-1].s+u}
var S={supV:12,res:10,area:400,sep:2,diel:'air',pol:false,run:false,chg:true,st:0,vc:0,tr:[{t:0,v:0,r:0}],mode:'explore',gs:0,sc:'both'};
var dirty=true,aId=null,lTs=null;
function $(id){return document.getElementById(id)}

function led(c,sz,on){return'<span style="display:inline-block;width:'+sz+'px;height:'+sz+'px;border-radius:50%;flex-shrink:0;'+(on?'background:radial-gradient(circle at 40% 35%,#fff 0%,'+c+' 40%,'+c+'88 100%);box-shadow:0 0 '+sz+'px '+c+'aa,0 0 '+(sz*2.5)+'px '+c+'40;border:1px solid '+c+'50':'background:#1a1e22;box-shadow:inset 0 1px 2px #000;border:1px solid #2a2e33')+'"></span>'}
function ssd(c,on){return'<i style="background:'+(on?'linear-gradient(135deg,'+c+'cc,'+c+')':'#1c2026')+';box-shadow:'+(on?'0 0 4px '+c+'80,inset 0 1px 1px rgba(255,255,255,.2)':'inset 0 1px 2px rgba(0,0,0,.3)')+';border:.5px solid '+(on?c+'40':'#1c2026')+'"></i>'}
function bar(v,mx,c){var f=Math.min(1,Math.max(0,v/mx)),n=8,lit=Math.round(f*n);var h='<div style="display:flex;flex-direction:column-reverse;gap:1px;width:6px;height:40px">';for(var i=0;i<n;i++){var on=i<lit;var cc=i>=n*.85?'#ff2244':i>=n*.65?'#ffaa22':c;h+='<div style="flex:1;border-radius:1px;background:'+(on?cc:'rgba(30,34,38,.4)')+';box-shadow:'+(on?'0 0 3px '+cc+'80':'none')+'"></div>'}return h+'</div>'}
function ktx(tex){
  if(window._katexReady){try{return katex.renderToString(tex,{throwOnError:false,displayMode:false})}catch(e){}}
  return'<span style="font-family:Share Tech Mono,monospace">'+tex+'</span>';
}
function ro(tex,val,un,c){
  var uTex=un?(un.indexOf('\\')>=0?un:'\\text{'+un+'}'):'';
  var full=tex+'='+val+(uTex?'\\;\\small{'+uTex+'}':'');
  return'<div class="ro-box" style="--eq-glow:'+c+'12;--eq-glow2:'+c+'06">'
    +'<div class="eq-frame"></div>'
    +'<div class="ro-visor"></div>'
    +'<div class="ro-inner">'
    +'<div class="ro-ktx" style="color:'+c+';text-shadow:0 0 10px '+c+'50,0 0 20px '+c+'18;animation:hum 3s infinite">'+ktx(full)+'</div>'
    +'</div></div>';}

function knob(id,val,mn,mx,c,lb,un){
  var sz=54,r=sz/2-4,f=(val-mn)/(mx-mn),ag=-135+f*270,rd=(ag-90)*Math.PI/180,cx=sz/2,cy=sz/2;
  var kO=r-1,kI=r-6,kM=(kO+kI)/2,pR=r-11;
  var ix=cx+pR*Math.cos(rd),iy=cy+pR*Math.sin(rd);
  var nx=cx+kM*Math.cos(rd),ny=cy+kM*Math.sin(rd);
  var s='<svg width="'+sz+'" height="'+sz+'" style="cursor:ns-resize;touch-action:none;overflow:visible" data-knob="'+id+'">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(kO+1.5)+'" fill="none" stroke="#1c2026" stroke-width="1"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+kM+'" fill="none" stroke="#1e2024" stroke-width="'+(kO-kI+1)+'"/>';
  s+='<g transform="rotate('+ag+','+cx+','+cy+')">';
  for(var i=0;i<48;i++){var a=i*360/48*Math.PI/180;s+='<line x1="'+(cx+kI*Math.cos(a))+'" y1="'+(cy+kI*Math.sin(a))+'" x2="'+(cx+kO*Math.cos(a))+'" y2="'+(cy+kO*Math.sin(a))+'" stroke="'+(i%2===0?'#383e44':'#1c2026')+'" stroke-width="1.2"/>';}
  s+='</g>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+kO+'" fill="none" stroke="#1c2026" stroke-width=".5"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+kI+'" fill="none" stroke="#1c2026" stroke-width=".5"/>';
  s+='<circle cx="'+nx+'" cy="'+ny+'" r="2.5" fill="'+c+'" style="filter:drop-shadow(0 0 3px '+c+')"/>';
  for(var i=0;i<28;i++){var a2=(-135+i*(270/27)-90)*Math.PI/180;var act=i/27<=f;s+='<circle cx="'+(cx+(kO+4)*Math.cos(a2))+'" cy="'+(cy+(kO+4)*Math.sin(a2))+'" r="'+(act?1.5:.5)+'" fill="'+(act?c:'#1c2026')+'"/>';}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(kI-2)+'" fill="#111418" stroke="#1c2026" stroke-width=".5"/>';
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ix+'" y2="'+iy+'" stroke="'+c+'" stroke-width="2.5" stroke-linecap="round"/>';
  s+='<circle cx="'+ix+'" cy="'+iy+'" r="2.5" fill="'+c+'"/>';
  var hp='';for(var i=0;i<6;i++){var a3=(i*60-30)*Math.PI/180;hp+=(cx+5*Math.cos(a3))+','+(cy+5*Math.sin(a3))+' ';}
  s+='<polygon points="'+hp+'" fill="#1e2024" stroke="#3e444a" stroke-width=".8"/><circle cx="'+cx+'" cy="'+cy+'" r="2" fill="'+c+'50"/></svg>';
  var vs=val>=100?val.toFixed(0):val>=10?val.toFixed(1):val.toFixed(2);
  var uTex=un.indexOf('\\')>=0?un:'\\text{'+un+'}';
  var texStr=lb+'='+vs+'\\;'+uTex;
  var rendered=ktx(texStr);
  return'<div style="display:flex;flex-direction:column;align-items:center;gap:1px;user-select:none"><div style="width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#383e44,#282c30 30%,#111418 70%,#1c2026);border:2px solid #3e444a;border-top:2px solid #383e44;border-bottom:3px solid #1c2026;box-shadow:inset 0 3px 5px rgba(255,255,255,.04),inset 0 -2px 4px rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.5),0 2px 3px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.25)">'+s+'</div><div class="knob-ktx" style="text-align:center;margin-top:-2px;color:'+c+';text-shadow:0 0 8px '+c+'60,0 0 18px '+c+'20">'+rendered+'</div></div>';}

function dome(id,lb,c,sz,pr){var lit=!pr;
  return'<div style="display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none" id="'+id+'"><div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .1s;'+(pr?'transform:translateY(2px);background:radial-gradient(circle at 50% 50%,#111418,#1c2026 60%);box-shadow:inset 0 3px 6px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.3)':'background:radial-gradient(circle at 50% 45%,'+c+'30,#111418 60%,#1c2026);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4),inset 0 2px 3px '+c+'10,0 3px 1px #1c2026,0 5px 10px rgba(0,0,0,.5),0 0 12px '+c+'15')+'"><div style="width:'+(sz-10)+'px;height:'+(sz-10)+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .1s;'+(lit?'background:radial-gradient(circle at 45% 38%,'+c+'cc,'+c+' 40%,'+c+'88);box-shadow:inset 0 2px 4px rgba(255,255,255,.25),inset 0 -2px 3px rgba(0,0,0,.3),0 0 8px '+c+'60':'background:radial-gradient(circle at 50% 50%,#282c30,#1e2024 60%,#111418);box-shadow:inset 0 2px 4px rgba(0,0,0,.3)')+'">'+(lit?'<div style="width:32%;height:16%;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(1px);position:relative;top:-20%"></div>':'')+'</div></div><div style="font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;color:'+(pr?c:'#506070')+';text-shadow:'+(pr?'0 0 4px '+c+'40':'none')+'">'+lb+'</div></div>';}

function pbtn(k,lb,a){return'<div class="pbtn" data-mat="'+k+'" style="'+(a?'padding:5px 7px 3px;color:#ffaa22;text-shadow:0 0 6px rgba(255,170,34,.3);background:linear-gradient(180deg,#111418,#1e2024);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 8px rgba(255,170,34,.15),0 1px 1px rgba(0,0,0,.3);transform:translateY(1px)':'color:#506070;background:linear-gradient(180deg,#383e44,#282c30 40%,#1e2024);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 1px #1c2026,0 4px 6px rgba(0,0,0,.4),0 2px 2px rgba(0,0,0,.3)')+'"><div style="position:absolute;top:2px;left:50%;transform:translateX(-50%);height:2px;border-radius:1px;width:'+(a?'10':'6')+'px;background:'+(a?'#ffaa22':'#1c2026')+';box-shadow:'+(a?'0 0 4px #ffaa22,0 0 8px rgba(255,170,34,.3)':'none')+';transition:all .08s"></div><span style="display:block;margin-top:3px">'+lb+'</span></div>';}
function updDOM(){
  var R=S.res*1e3,C=cC(S.area,S.sep,D[S.diel].k),tau=R*C,tw=Math.max(tau*5,1e-6),mV=Math.ceil(S.supV/5)*5||5;
  var Q=C*S.vc,U=.5*C*S.vc*S.vc,I=(S.chg?1:-1)*(S.supV/R)*Math.exp(-S.st/tau);
  var VR=S.chg?S.supV-S.vc:S.vc,PR=I*I*R;
  // Mode btns
  var eb=$('btnE'),gb=$('btnG');
  eb.style.color=S.mode==='explore'?'#00ddee':'#506070';eb.style.textShadow=S.mode==='explore'?'0 0 8px rgba(0,221,238,.3)':'none';eb.style.borderColor=S.mode==='explore'?'rgba(0,221,238,.4)':'#3e444a';eb.style.boxShadow=S.mode==='explore'?'0 0 10px rgba(0,221,238,.3)':'none';
  gb.style.color=S.mode==='guided'?'#ffaa22':'#506070';gb.style.textShadow=S.mode==='guided'?'0 0 8px rgba(255,170,34,.3)':'none';gb.style.borderColor=S.mode==='guided'?'rgba(255,170,34,.4)':'#3e444a';gb.style.boxShadow=S.mode==='guided'?'0 0 10px rgba(255,170,34,.3)':'none';

  s+='<rect x="'+(cx-gW/2)+'" y="'+pTop+'" width="'+gW+'" height="'+pH+'" fill="'+d.c+'" stroke="rgba(0,221,238,.06)" stroke-width=".5"/>';
  if(useTex)s+='<rect x="'+(cx-gW/2)+'" y="'+pTop+'" width="'+gW+'" height="'+pH+'" fill="url(#txD)"/>';
  if(d.k>5){var gc=d.k>50?'rgba(0,180,255,.06)':'rgba(200,180,100,.04)';s+='<rect x="'+(cx-gW/2+1)+'" y="'+(pTop+1)+'" width="'+(gW-2)+'" height="'+(pH-2)+'" fill="none" stroke="'+gc+'" stroke-width="2" rx="1"/>';}
  // Plates
  s+='<rect x="'+(cx-gW/2-th)+'" y="'+pTop+'" width="'+th+'" height="'+pH+'" fill="url(#plPos)" stroke="#4a4e52" stroke-width="2"/>';
  s+='<rect x="'+(cx+gW/2)+'" y="'+pTop+'" width="'+th+'" height="'+pH+'" fill="url(#plNeg)" stroke="#4a4e52" stroke-width="2"/>';
  // Charge symbols
  var nM=Math.min(5,Math.floor(pH/20));for(var i=0;i<nM;i++){var yy=pTop+(i+1)*pH/(nM+1);
    s+='<text x="'+(cx-gW/2-th/2)+'" y="'+(yy+3)+'" text-anchor="middle" font-size="9" fill="#ffaaaa" font-weight="bold">+</text>';
    s+='<text x="'+(cx+gW/2+th/2)+'" y="'+(yy+3)+'" text-anchor="middle" font-size="9" fill="#aabbff" font-weight="bold">−</text>'}
  // E-field arrows
  if(!S.pol){var nE=Math.min(4,Math.floor(pH/25));for(var i=0;i<nE;i++){var yy2=pTop+(i+1)*pH/(nE+1);s+='<line x1="'+(cx-gW/2+6)+'" y1="'+yy2+'" x2="'+(cx+gW/2-6)+'" y2="'+yy2+'" stroke="#00ddee" stroke-width="1" marker-end="url(#aE)" opacity=".4"/>'}}
  // Polarization dipoles
  if(S.pol&&d.k>1.01){var nR=Math.min(6,Math.floor(pH/18)),nC=Math.min(4,Math.floor(gW/18)),aL=Math.min(12,gW/(nC+1)*.6);for(var r2=0;r2<nR;r2++)for(var c2=0;c2<nC;c2++){var px=cx-gW/2+(c2+1)*gW/(nC+1),py=pTop+(r2+1)*pH/(nR+1);s+='<circle cx="'+(px-aL/2)+'" cy="'+py+'" r="2.5" fill="#4466dd" opacity=".5"/><circle cx="'+(px+aL/2)+'" cy="'+py+'" r="2.5" fill="#ee4444" opacity=".5"/><line x1="'+(px-aL/2+2.5)+'" y1="'+py+'" x2="'+(px+aL/2-2.5)+'" y2="'+py+'" stroke="#ffcc44" stroke-width=".8" marker-end="url(#aP)" opacity=".6"/>'}}

  $('appSvg').innerHTML=s}
// Simulation
function sim(ts){if(!lTs)lTs=ts;var R=S.res*1e3,C=cC(S.area,S.sep,D[S.diel].k),tau=R*C,tw=Math.max(tau*5,1e-6);
  var dt=((ts-lTs)/1000)*(tw/4);lTs=ts;S.st+=dt;
  var v=S.chg?S.supV*(1-Math.exp(-S.st/tau)):S.supV*Math.exp(-S.st/tau);
  var vR=S.chg?S.supV-v:v;S.vc=v;
  S.tr.push({t:S.st,v:v,r:vR});S.tr=S.tr.filter(function(p){return p.t<=tw*1.05});
  if(S.st>=tw)S.run=false;dirty=true;if(S.run)aId=requestAnimationFrame(sim)}
function doChg(){if(S.run)return;S.chg=true;S.st=0;S.tr=[{t:0,v:0,r:S.supV}];S.vc=0;S.run=true;lTs=null;aId=requestAnimationFrame(sim);dirty=true}
function doDis(){if(S.run)return;S.chg=false;S.st=0;S.tr=[{t:0,v:S.supV,r:S.supV}];S.vc=S.supV;S.run=true;lTs=null;aId=requestAnimationFrame(sim);dirty=true}
function doStp(){S.run=false;if(aId)cancelAnimationFrame(aId);dirty=true}
function setMode(m){S.mode=m;if(m==='guided')S.gs=0;dirty=true}
// Knob drag
var dK=null,dSY=0,dSV=0;
var kC={supV:{mn:1,mx:50,st:.5},res:{mn:.1,mx:100,st:.1},area:{mn:25,mx:2500,st:25},sep:{mn:.5,mx:40,st:.5}};
document.addEventListener('pointerdown',function(e){var svg=e.target.closest('[data-knob]');if(!svg)return;
  dK=svg.dataset.knob;dSY=e.clientY;dSV=S[dK];svg.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',function(e){if(!dK)return;var c=kC[dK];
  var v=dSV+(dSY-e.clientY)*((c.mx-c.mn)/150);v=Math.round(v/c.st)*c.st;S[dK]=Math.max(c.mn,Math.min(c.mx,v));dirty=true});
document.addEventListener('pointerup',function(){dK=null});
// Click handlers
document.addEventListener('click',function(e){
  var mat=e.target.closest('[data-mat]');if(mat){S.diel=mat.dataset.mat;dirty=true;return}
  var ch=e.target.closest('[data-ch]');if(ch){S.sc=ch.dataset.ch;dirty=true;return}
  if(e.target.closest('#dC')){doChg();return}
  if(e.target.closest('#dD')){doDis();return}
  if(e.target.closest('#dH')){doStp();return}});
document.addEventListener('change',function(e){if(e.target.id==='chkP'){S.pol=e.target.checked;dirty=true}});
// Header LEDs
(function(){var h=$('hLeds');var cs=['#ff2244','#ff2244','#ffaa22','#33ee55','#33ee55','#ff2244','#ffaa22','#4488ff','#33ee55','#ff2244','#ffaa22','#33ee55'];h.innerHTML=cs.map(function(c){return led(c,3,true)}).join('')})();
// Main loop
function ml(){if(dirty){dirty=false;updDOM()}requestAnimationFrame(ml)}
requestAnimationFrame(ml);
</script>

<script>
/* v3.5 chrome wiring — title centering */
(function() {
  const leftFlank  = document.querySelector('.cin-flank--left');
  const rightFlank = document.querySelector('.cin-flank--right');
  const title      = document.querySelector('.cin-title');
  if (leftFlank && rightFlank && title) {
    const centerTitle = () => {
      const lRect = leftFlank.getBoundingClientRect();
      const rRect = rightFlank.getBoundingClientRect();
      if (lRect.width === 0 || rRect.width === 0) return;
      title.style.left = ((lRect.right + rRect.left) / 2) + 'px';
    };
    centerTitle();
    window.addEventListener('resize', centerTitle);
    new ResizeObserver(centerTitle).observe(rightFlank);
    new ResizeObserver(centerTitle).observe(leftFlank);
    if (document.fonts) document.fonts.ready.then(centerTitle);
  }
})();
</script>
