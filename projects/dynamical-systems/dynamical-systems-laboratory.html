<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamical Systems Laboratory</title>
  
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- THREE.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Babel for JSX transpilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* Custom scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a24;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #3a3a4a;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a5a;
    }
    
    /* Range input styling for dark theme */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2a2a34;
      border-radius: 2px;
      outline: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #4a9eff;
      border-radius: 50%;
      cursor: pointer;
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #4a9eff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    
    /* Checkbox styling */
    input[type="checkbox"] {
      accent-color: #4a9eff;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Load the JSX component -->
  <script type="text/babel" src="dynamical-systems-laboratory.jsx?v=2026-03-01"></script>
  
  <!-- Mount the app -->
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UnifiedPhysicsLab />);
  </script>
</body>
</html>
