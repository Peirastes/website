<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamical Systems Laboratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- THREE.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Babel for JSX transpilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- KaTeX for equation rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
        integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"
          integrity="sha384-Rma6DA2IPUwhNxmrB/7S3Tno0YY7sFu9WSYMCuulLhIqYSGZ2gKCJWIqhBWqMQfh" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
    
    /* Custom scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #1a1a24;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #3a3a4a;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a5a;
    }
    
    /* Range input styling for dark theme */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2a2a34;
      border-radius: 2px;
      outline: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #4a9eff;
      border-radius: 50%;
      cursor: pointer;
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #4a9eff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    
    /* Checkbox styling */
    input[type="checkbox"] {
      accent-color: #4a9eff;
    }

    /* KaTeX equation styling for dark theme */
    .katex-equation .katex { color: inherit; }
    .katex-equation .katex .mord,
    .katex-equation .katex .mop,
    .katex-equation .katex .mbin,
    .katex-equation .katex .mrel,
    .katex-equation .katex .mpunct,
    .katex-equation .katex .mopen,
    .katex-equation .katex .mclose { color: inherit; }
    .peirastes-home {
      position: fixed;
      top: 8px; left: 12px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(224, 224, 224, 0.3);
      text-decoration: none;
      letter-spacing: 0.08em;
      z-index: 9999;
      transition: color 0.2s ease;
    }
    .peirastes-home:hover { color: #e07050; }
  </style>
</head>
<body>

<a href="https://peirastes.com" class="peirastes-home" title="Back to Peirastes">Peirastes</a>

  <div id="root"></div>

  <!-- Load the JSX component -->
  <script type="text/babel" src="dynamical-systems-laboratory.jsx?v=2026-03-01"></script>
  
  <!-- Mount the app -->
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UnifiedPhysicsLab />);
  </script>
</body>
</html>
