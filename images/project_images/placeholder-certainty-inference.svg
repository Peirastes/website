<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-cic">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-cic)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#4A3728"/>
    <!-- Subtle overlapping circles (Venn diagram) -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Three overlapping circles forming a Venn diagram -->
      <!-- Certainty (left) -->
      <circle cx="75" cy="75" r="35"/>
      <!-- Inference (right) -->
      <circle cx="130" cy="75" r="35"/>
      <!-- Comprehension (bottom center) -->
      <circle cx="102" cy="125" r="35"/>
    </g>
    <!-- Inner intersection region hints -->
    <g stroke="white" fill="none" opacity="0.06" stroke-width="0.8">
      <!-- Secondary rings to suggest depth -->
      <circle cx="75" cy="75" r="25"/>
      <circle cx="130" cy="75" r="25"/>
      <circle cx="102" cy="125" r="25"/>
    </g>
    <!-- Small dots at intersection centers -->
    <g fill="white" opacity="0.08">
      <!-- Pairwise intersections -->
      <circle cx="102" cy="68" r="2.5"/>
      <circle cx="85" cy="105" r="2.5"/>
      <circle cx="120" cy="105" r="2.5"/>
      <!-- Triple intersection -->
      <circle cx="102" cy="90" r="3.5"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">CIC</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>