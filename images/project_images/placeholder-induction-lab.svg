<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-il">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <linearGradient id="emfGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a06820" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#f0a030" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a06820" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="phiGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#208878" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#40e8d0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#208878" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-il)">
    <rect width="200" height="200" rx="12" fill="#0a0e14"/>

    <!-- Faint grid -->
    <g stroke="#1a1d24" stroke-width="0.5">
      <line x1="0" y1="50" x2="200" y2="50"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
      <line x1="50" y1="0" x2="50" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
    </g>

    <!-- Flux trace (cyan, cosine) -->
    <path d="M 5 100 Q 17 60 30 60 Q 43 60 55 100 Q 67 140 80 140 Q 93 140 105 100 Q 117 60 130 60 Q 143 60 155 100 Q 167 140 180 140 Q 193 140 195 120"
          stroke="url(#phiGrad)" stroke-width="2" fill="none" opacity="0.75"/>

    <!-- EMF trace (amber, sine — 90° shifted) -->
    <path d="M 5 100 Q 17 140 30 140 Q 43 140 55 100 Q 67 60 80 60 Q 93 60 105 100 Q 117 140 130 140 Q 143 140 155 100 Q 167 60 180 60 Q 193 60 195 80"
          stroke="url(#emfGrad)" stroke-width="2.5" fill="none" opacity="0.95"/>

    <!-- Center axis line -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#2a2d35" stroke-width="0.5" stroke-dasharray="2,3"/>

    <!-- Rotating loop motif, top-right corner -->
    <g transform="translate(160,40)">
      <ellipse cx="0" cy="0" rx="22" ry="8" stroke="#f0a030" stroke-width="2" fill="none" opacity="0.85"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#f0a030" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="2" fill="#40e8d0"/>
    </g>

    <!-- Bar magnet motif, bottom-left -->
    <g transform="translate(40,160)">
      <rect x="-16" y="-6" width="16" height="12" fill="#3060c0" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
      <rect x="0" y="-6" width="16" height="12" fill="#e05040" stroke="#fff" stroke-width="0.5" opacity="0.85"/>
      <text x="-8" y="3" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">S</text>
      <text x="8" y="3" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">N</text>
    </g>

    <!-- Title initials -->
    <text x="100" y="105" font-family="Orbitron, monospace" font-size="22" font-weight="700"
          fill="#f0a030" text-anchor="middle" dominant-baseline="central" opacity="0.9"
          letter-spacing="2">EMF</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#f0a030" rx="0"/>
  </g>
</svg>
