<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-rs">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-rs)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Rotating disk -->
    <circle cx="100" cy="105" r="70" fill="none" stroke="#2d5875" stroke-width="1" opacity="0.6"/>
    <circle cx="100" cy="105" r="70" fill="#1a2a3a" opacity="0.35"/>

    <!-- Radial slot (the channel the ball slides in) -->
    <g transform="rotate(-28 100 105)">
      <rect x="100" y="103" width="68" height="4" rx="2" fill="#0c0d10" stroke="#6ea4c4" stroke-width="1" opacity="0.85"/>
    </g>

    <!-- Spiral trace of ball trajectory in lab frame -->
    <path d="M 100 105 Q 110 100 118 96 Q 132 87 138 75 Q 142 60 132 50"
          fill="none" stroke="#e07a3c" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.85"/>

    <!-- Ball at current position -->
    <circle cx="138" cy="75" r="4" fill="#e07a3c"/>

    <!-- Angular velocity arrow on rim -->
    <path d="M 162 105 A 62 62 0 0 1 155 135" fill="none" stroke="#c89b3c" stroke-width="1.4" opacity="0.85"/>
    <polygon points="155,135 152,128 159,131" fill="#c89b3c" opacity="0.9"/>
    <text x="170" y="100" font-family="Share Tech Mono, monospace" font-size="9" fill="#c89b3c" opacity="0.85">&#969;</text>

    <!-- Center pin -->
    <circle cx="100" cy="105" r="2.8" fill="#bda07a"/>

    <!-- Initials top center -->
    <text x="100" y="28" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="15" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.88" letter-spacing="2">r&#x0307;, &#952;&#x0307;</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#e07a3c" rx="0"/>
  </g>
</svg>
