<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-kb">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-kb)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Edges of the knowledge graph -->
    <g stroke="#2d5875" stroke-width="1" opacity="0.7">
      <line x1="58"  y1="60"  x2="100" y2="92"/>
      <line x1="142" y1="58"  x2="100" y2="92"/>
      <line x1="100" y1="92"  x2="62"  y2="138"/>
      <line x1="100" y1="92"  x2="140" y2="138"/>
      <line x1="62"  y1="138" x2="140" y2="138"/>
      <line x1="58"  y1="60"  x2="142" y2="58"/>
      <line x1="62"  y1="138" x2="40"  y2="172"/>
      <line x1="140" y1="138" x2="162" y2="172"/>
      <line x1="100" y1="92"  x2="100" y2="172" stroke-dasharray="2 3" opacity="0.5"/>
    </g>

    <!-- Highlighted dependency chain -->
    <g stroke="#e07a3c" stroke-width="1.8" opacity="0.92">
      <line x1="100" y1="92" x2="140" y2="138"/>
      <line x1="140" y1="138" x2="162" y2="172"/>
    </g>

    <!-- Nodes -->
    <circle cx="58"  cy="60"  r="6"   fill="#6ea4c4" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="142" cy="58"  r="6.5" fill="#c89b3c" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="100" cy="92"  r="8"   fill="#e07a3c" stroke="#0c0d10" stroke-width="1.2"/>
    <circle cx="62"  cy="138" r="5.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="140" cy="138" r="6.5" fill="#e07a3c" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="40"  cy="172" r="4.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>
    <circle cx="100" cy="172" r="4.5" fill="#bda07a" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>
    <circle cx="162" cy="172" r="5.5" fill="#e07a3c" stroke="#0c0d10" stroke-width="1"/>

    <!-- Initials -->
    <text x="100" y="28" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="15" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.88" letter-spacing="2">claims</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#e07a3c" rx="0"/>
  </g>
</svg>
