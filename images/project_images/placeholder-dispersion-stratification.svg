<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-ds">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <linearGradient id="techGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d5875" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e07a3c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="socGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d5875" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6ea4c4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-ds)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Tech wave packet (warm) — leading band right, dispersed tail left -->
    <path d="M 8 92 Q 30 90 55 86 Q 80 78 105 60 Q 130 42 155 35 Q 175 32 192 38 L 192 96 L 8 96 Z"
          fill="url(#techGrad)" opacity="0.85"/>
    <path d="M 8 92 Q 30 90 55 86 Q 80 78 105 60 Q 130 42 155 35 Q 175 32 192 38"
          stroke="#e07a3c" stroke-width="1.2" fill="none" opacity="0.9"/>

    <!-- Social wave packet (cool) — broader, lower amplitude, lagging -->
    <path d="M 8 165 Q 35 162 60 156 Q 85 148 105 132 Q 125 116 150 110 Q 175 108 192 112 L 192 168 L 8 168 Z"
          fill="url(#socGrad)" opacity="0.85"/>
    <path d="M 8 165 Q 35 162 60 156 Q 85 148 105 132 Q 125 116 150 110 Q 175 108 192 112"
          stroke="#6ea4c4" stroke-width="1.2" fill="none" opacity="0.9"/>

    <!-- Baseline lines -->
    <line x1="0" y1="96" x2="200" y2="96" stroke="#2a2d35" stroke-width="0.5"/>
    <line x1="0" y1="168" x2="200" y2="168" stroke="#2a2d35" stroke-width="0.5"/>

    <!-- Strategic lever symbol (gold), top right -->
    <line x1="170" y1="14" x2="186" y2="22" stroke="#c89b3c" stroke-width="2"/>
    <circle cx="170" cy="14" r="3" fill="#c89b3c"/>

    <!-- Initials -->
    <text x="100" y="100" font-family="Georgia, serif" font-style="italic" font-size="38" font-weight="400"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.95">D&amp;S</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#c89b3c" rx="0"/>
  </g>
</svg>
