<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-pac">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-pac)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#3D5A3E"/>
    <!-- Subtle connected nodes / network pattern -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1">
      <!-- Network edges (connections between nodes) -->
      <line x1="45" y1="50" x2="100" y2="35"/>
      <line x1="100" y1="35" x2="155" y2="55"/>
      <line x1="45" y1="50" x2="60" y2="100"/>
      <line x1="100" y1="35" x2="100" y2="80"/>
      <line x1="155" y1="55" x2="145" y2="100"/>
      <line x1="60" y1="100" x2="100" y2="80"/>
      <line x1="100" y1="80" x2="145" y2="100"/>
      <line x1="60" y1="100" x2="80" y2="150"/>
      <line x1="145" y1="100" x2="125" y2="150"/>
      <line x1="80" y1="150" x2="125" y2="150"/>
      <line x1="100" y1="80" x2="80" y2="150"/>
      <line x1="100" y1="80" x2="125" y2="150"/>
    </g>
    <!-- Network nodes -->
    <g fill="white" opacity="0.12">
      <circle cx="45" cy="50" r="4"/>
      <circle cx="100" cy="35" r="4"/>
      <circle cx="155" cy="55" r="4"/>
      <circle cx="60" cy="100" r="3.5"/>
      <circle cx="100" cy="80" r="5"/>
      <circle cx="145" cy="100" r="3.5"/>
      <circle cx="80" cy="150" r="4"/>
      <circle cx="125" cy="150" r="4"/>
    </g>
    <!-- Subtle secondary connection halos -->
    <g stroke="white" fill="none" opacity="0.05" stroke-width="0.8">
      <circle cx="100" cy="80" r="12"/>
      <circle cx="45" cy="50" r="8"/>
      <circle cx="155" cy="55" r="8"/>
    </g>
    <!-- Initials -->
    <text x="100" y="112" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">PA+</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>