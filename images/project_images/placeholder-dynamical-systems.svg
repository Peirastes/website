<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-ods">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-ods)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#1B3A5C"/>
    <!-- Subtle phase-space spiral / attractor pattern -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Concentric elliptical orbits suggesting phase space -->
      <ellipse cx="100" cy="100" rx="30" ry="20" transform="rotate(-20 100 100)"/>
      <ellipse cx="100" cy="100" rx="50" ry="35" transform="rotate(-20 100 100)"/>
      <ellipse cx="100" cy="100" rx="70" ry="50" transform="rotate(-20 100 100)"/>
      <ellipse cx="100" cy="100" rx="88" ry="65" transform="rotate(-20 100 100)"/>
    </g>
    <!-- Subtle flow arrows along one orbit -->
    <g stroke="white" fill="white" opacity="0.12">
      <circle cx="145" cy="78" r="2"/>
      <circle cx="55" cy="122" r="2"/>
      <circle cx="100" cy="55" r="2"/>
      <circle cx="100" cy="145" r="2"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">ODS</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>