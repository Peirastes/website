<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-ol">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-ol)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#0d1a2a"/>
    <!-- Media boundary line -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="white" stroke-width="1" opacity="0.12"/>
    <!-- Incident ray -->
    <line x1="40" y1="30" x2="100" y2="100" stroke="#7c6aef" stroke-width="2" opacity="0.25"/>
    <!-- Refracted ray -->
    <line x1="100" y1="100" x2="145" y2="175" stroke="#7c6aef" stroke-width="2" opacity="0.20"/>
    <!-- TIR reflected ray -->
    <line x1="100" y1="100" x2="160" y2="30" stroke="#4ae0ff" stroke-width="1.5" opacity="0.15"/>
    <!-- Normal dashed -->
    <line x1="100" y1="25" x2="100" y2="175" stroke="white" stroke-width="0.8" opacity="0.08" stroke-dasharray="4,4"/>
    <!-- Lens hint -->
    <g stroke="white" opacity="0.08" stroke-width="1.2" fill="none">
      <ellipse cx="100" cy="100" rx="6" ry="45"/>
    </g>
    <!-- Spectral fan hint -->
    <g opacity="0.12" stroke-width="1.2">
      <line x1="100" y1="100" x2="155" y2="160" stroke="#ff3344"/>
      <line x1="100" y1="100" x2="148" y2="168" stroke="#ff8822"/>
      <line x1="100" y1="100" x2="140" y2="172" stroke="#ffcc00"/>
      <line x1="100" y1="100" x2="132" y2="175" stroke="#33ff66"/>
      <line x1="100" y1="100" x2="125" y2="176" stroke="#00ccdd"/>
      <line x1="100" y1="100" x2="118" y2="175" stroke="#7c6aef"/>
    </g>
    <!-- Initials -->
    <text x="100" y="105" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">OL</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>
