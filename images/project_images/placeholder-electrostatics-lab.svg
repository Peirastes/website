<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-el">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-el)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#0066CC"/>
    <!-- Subtle electric field lines radiating from two charges -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1">
      <!-- Field lines from positive charge (top-left area) -->
      <path d="M60,70 Q80,50 110,50"/>
      <path d="M60,70 Q70,80 60,110"/>
      <path d="M60,70 Q80,70 100,80"/>
      <path d="M60,70 Q65,55 80,40"/>
      <path d="M60,70 Q45,75 30,90"/>
      <!-- Field lines from negative charge (bottom-right area) -->
      <path d="M140,130 Q120,150 90,150"/>
      <path d="M140,130 Q130,120 140,90"/>
      <path d="M140,130 Q120,130 100,120"/>
      <path d="M140,130 Q155,125 170,110"/>
      <path d="M140,130 Q145,145 160,160"/>
    </g>
    <!-- Charge symbols -->
    <g opacity="0.15" stroke="white" stroke-width="1.5">
      <circle cx="60" cy="70" r="8" fill="none"/>
      <line x1="55" y1="70" x2="65" y2="70"/>
      <line x1="60" y1="65" x2="60" y2="75"/>
      <circle cx="140" cy="130" r="8" fill="none"/>
      <line x1="135" y1="130" x2="145" y2="130"/>
    </g>
    <!-- Subtle equipotential curves -->
    <g stroke="white" fill="none" opacity="0.07" stroke-width="0.8">
      <circle cx="60" cy="70" r="25"/>
      <circle cx="60" cy="70" r="40"/>
      <circle cx="140" cy="130" r="25"/>
      <circle cx="140" cy="130" r="40"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">EL</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>