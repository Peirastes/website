<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-sma">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-sma)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#6B3FA0"/>
    <!-- Subtle bar chart pattern -->
    <g stroke="white" stroke-width="1.5" opacity="0.1" fill="none">
      <rect x="30" y="130" width="16" height="40"/>
      <rect x="52" y="110" width="16" height="60"/>
      <rect x="74" y="90" width="16" height="80"/>
      <rect x="96" y="120" width="16" height="50"/>
      <rect x="118" y="80" width="16" height="90"/>
      <rect x="140" y="100" width="16" height="70"/>
      <rect x="162" y="60" width="16" height="110"/>
    </g>
    <!-- Subtle ascending trend line -->
    <polyline points="38,128 60,108 82,88 104,118 126,78 148,98 170,58"
              stroke="white" stroke-width="1.2" fill="none" opacity="0.15"/>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">SMA</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>