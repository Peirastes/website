<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-pa">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-pa)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#2E4A3D"/>
    <!-- Subtle three parallel arrows (source -> field -> force) -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Top arrow: Source -->
      <line x1="30" y1="50" x2="160" y2="50"/>
      <polyline points="155,45 165,50 155,55" fill="none"/>
      <!-- Middle arrow: Field -->
      <line x1="30" y1="80" x2="160" y2="80"/>
      <polyline points="155,75 165,80 155,85" fill="none"/>
      <!-- Bottom arrow: Force -->
      <line x1="30" y1="110" x2="160" y2="110"/>
      <polyline points="155,105 165,110 155,115" fill="none"/>
    </g>
    <!-- Vertical mapping lines between arrow rows -->
    <g stroke="white" fill="none" opacity="0.06" stroke-width="0.8" stroke-dasharray="3,3">
      <!-- Left vertical connectors -->
      <line x1="55" y1="55" x2="55" y2="75"/>
      <line x1="55" y1="85" x2="55" y2="105"/>
      <!-- Center vertical connectors -->
      <line x1="100" y1="55" x2="100" y2="75"/>
      <line x1="100" y1="85" x2="100" y2="105"/>
      <!-- Right vertical connectors -->
      <line x1="140" y1="55" x2="140" y2="75"/>
      <line x1="140" y1="85" x2="140" y2="105"/>
    </g>
    <!-- Labels suggesting analogy layers -->
    <g fill="white" opacity="0.07" font-family="Georgia, serif" font-size="10">
      <text x="175" y="53">S</text>
      <text x="175" y="83">F</text>
      <text x="175" y="113">A</text>
    </g>
    <!-- Subtle tilde / equivalence symbols between layers -->
    <g fill="white" opacity="0.08" font-family="Arial, Helvetica, sans-serif" font-size="14">
      <text x="18" y="68">~</text>
      <text x="18" y="98">~</text>
    </g>
    <!-- Initials -->
    <text x="100" y="115" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">PA</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>