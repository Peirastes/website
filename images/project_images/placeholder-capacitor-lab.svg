<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-cl">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-cl)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#1a3a4a"/>
    <!-- Capacitor plates -->
    <g stroke="white" fill="none" opacity="0.15" stroke-width="2">
      <line x1="75" y1="35" x2="75" y2="95"/>
      <line x1="125" y1="35" x2="125" y2="95"/>
    </g>
    <!-- Dielectric fill between plates -->
    <rect x="80" y="40" width="40" height="50" fill="white" opacity="0.06" rx="2"/>
    <!-- E-field arrows between plates -->
    <g stroke="white" fill="white" opacity="0.10">
      <line x1="90" y1="50" x2="110" y2="50" stroke-width="1"/>
      <polygon points="110,47 116,50 110,53"/>
      <line x1="90" y1="65" x2="110" y2="65" stroke-width="1"/>
      <polygon points="110,62 116,65 110,68"/>
      <line x1="90" y1="80" x2="110" y2="80" stroke-width="1"/>
      <polygon points="110,77 116,80 110,83"/>
    </g>
    <!-- Subtle RC circuit wires -->
    <g stroke="white" opacity="0.08" stroke-width="1" fill="none">
      <path d="M75,65 L40,65 L40,150 L100,150"/>
      <path d="M125,65 L160,65 L160,150 L100,150"/>
      <!-- Resistor zigzag -->
      <path d="M40,100 L45,95 L55,105 L65,95 L70,100" stroke-width="1.2"/>
    </g>
    <!-- Oscilloscope waveform hint -->
    <g stroke="white" opacity="0.08" stroke-width="1" fill="none">
      <rect x="30" y="155" width="140" height="35" rx="3"/>
      <path d="M40,175 Q55,175 65,165 Q80,155 100,162 Q120,168 140,170 L160,170"/>
    </g>
    <!-- Initials -->
    <text x="100" y="120" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">CDL</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>
