<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-room">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <radialGradient id="resonance" cx="100" cy="120" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e07a3c" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e07a3c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2d5875" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#clip-room)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Concentric resonance arcs emanating from a focal point inside the chamber -->
    <g fill="none" stroke="#e07a3c" stroke-width="0.8" opacity="0.85">
      <circle cx="100" cy="120" r="22"  opacity="0.85"/>
      <circle cx="100" cy="120" r="38"  opacity="0.62"/>
      <circle cx="100" cy="120" r="54"  opacity="0.42"/>
      <circle cx="100" cy="120" r="70"  opacity="0.28"/>
      <circle cx="100" cy="120" r="86"  opacity="0.18"/>
      <circle cx="100" cy="120" r="102" opacity="0.10"/>
    </g>

    <!-- Stone-chamber outline (passage tomb cross-section) -->
    <path d="M 50 168 L 50 110 Q 50 80 78 64 Q 100 52 122 64 Q 150 80 150 110 L 150 168 Z"
          fill="none" stroke="#bda07a" stroke-width="1.6" opacity="0.85"/>
    <!-- Floor / horizon -->
    <line x1="35" y1="168" x2="165" y2="168" stroke="#bda07a" stroke-width="1.2" opacity="0.7"/>
    <!-- Lintel / capstone hint -->
    <line x1="60" y1="64" x2="140" y2="64" stroke="#bda07a" stroke-width="1.2" opacity="0.55"/>

    <!-- Voice source — small filled dot at the focal point -->
    <circle cx="100" cy="120" r="2.6" fill="#e07a3c"/>

    <!-- 110 Hz waveform along the bottom — single sine cycle indicating the matching frequency -->
    <path d="M 22 188 Q 33 178 44 188 T 66 188 T 88 188 T 110 188 T 132 188 T 154 188 T 176 188"
          fill="none" stroke="#6ea4c4" stroke-width="1" opacity="0.7"/>

    <!-- Initials -->
    <text x="100" y="34" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="16" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.85">110&#8201;Hz</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#e07a3c" rx="0"/>
  </g>
</svg>
