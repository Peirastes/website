<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-id">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-id)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#008080"/>
    <!-- Subtle Bayesian / probability distribution curves -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Prior distribution (wider) -->
      <path d="M30,160 Q50,150 70,120 Q85,90 100,70 Q115,90 130,120 Q150,150 170,160"/>
      <!-- Posterior distribution (narrower, shifted) -->
      <path d="M50,160 Q70,155 85,140 Q95,120 110,100 Q120,120 135,140 Q145,155 165,160"/>
    </g>
    <!-- Subtle network / inference graph -->
    <g stroke="white" fill="none" opacity="0.08" stroke-width="0.8">
      <!-- Nodes connected by edges -->
      <circle cx="50" cy="45" r="6"/>
      <circle cx="100" cy="35" r="6"/>
      <circle cx="150" cy="45" r="6"/>
      <circle cx="75" cy="70" r="4"/>
      <circle cx="125" cy="70" r="4"/>
      <!-- Edges -->
      <line x1="55" y1="48" x2="72" y2="68"/>
      <line x1="96" y1="40" x2="78" y2="67"/>
      <line x1="104" y1="40" x2="122" y2="67"/>
      <line x1="145" y1="48" x2="128" y2="68"/>
      <line x1="75" y1="74" x2="100" y2="85"/>
      <line x1="125" y1="74" x2="100" y2="85"/>
    </g>
    <!-- Subtle arrow of inference -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1" stroke-linecap="round">
      <line x1="100" y1="85" x2="100" y2="55"/>
      <polyline points="96,60 100,55 104,60"/>
    </g>
    <!-- Subtle sigma / integral symbol watermark -->
    <g fill="white" opacity="0.05" font-family="Georgia, serif" font-size="100">
      <text x="140" y="175" font-style="italic">P</text>
    </g>
    <!-- Initials -->
    <text x="100" y="115" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">ID</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>