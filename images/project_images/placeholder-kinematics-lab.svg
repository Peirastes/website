<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-kl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-kl)"/>

  <!-- Ground line -->
  <line x1="40" y1="240" x2="380" y2="240" stroke="#9ca3af" stroke-width="1.5" opacity="0.7"/>

  <!-- Grid (faint) -->
  <g stroke="#9ca3af" stroke-width="0.5" opacity="0.15">
    <line x1="40"  y1="180" x2="380" y2="180"/>
    <line x1="40"  y1="120" x2="380" y2="120"/>
    <line x1="40"  y1="60"  x2="380" y2="60"/>
    <line x1="120" y1="60"  x2="120" y2="240"/>
    <line x1="200" y1="60"  x2="200" y2="240"/>
    <line x1="280" y1="60"  x2="280" y2="240"/>
  </g>

  <!-- Projectile parabolic trajectory (45° launch) -->
  <!-- Sampled approx: x(t)=20cos45·t, y(t)=20sin45·t - 0.5·9.81·t² -->
  <path d="M 40 240 Q 200 60 360 240" fill="none" stroke="#6e9bc0" stroke-width="2.2"/>
  <!-- Halo behind -->
  <path d="M 40 240 Q 200 60 360 240" fill="none" stroke="#6e9bc0" stroke-width="5" opacity="0.15"/>

  <!-- Particle dot at apex -->
  <circle cx="200" cy="60" r="5" fill="#d4a865" stroke="#0a0f15" stroke-width="1"/>

  <!-- Velocity vector at apex (horizontal, since vy=0 at peak) -->
  <line x1="200" y1="60" x2="245" y2="60" stroke="#d4a865" stroke-width="2.4"/>
  <polygon points="245,60 237,56 237,64" fill="#d4a865"/>
  <text x="220" y="50" font-family="Orbitron, sans-serif" font-size="11" font-weight="bold" fill="#d4a865" text-anchor="middle">v⃗</text>

  <!-- Range tick on ground at landing -->
  <line x1="360" y1="233" x2="360" y2="247" stroke="#d4a865" stroke-width="1.8"/>
  <text x="360" y="262" font-family="'Share Tech Mono', monospace" font-size="10" fill="#d4a865" text-anchor="middle">R</text>

  <!-- Max-height dashed -->
  <line x1="40" y1="60" x2="200" y2="60" stroke="#d4a865" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <text x="48" y="55" font-family="'Share Tech Mono', monospace" font-size="10" fill="#d4a865">H</text>

  <!-- Launch angle indicator -->
  <line x1="40" y1="240" x2="80" y2="200" stroke="#b8c8d2" stroke-width="1.5" opacity="0.7"/>
  <path d="M 60 240 A 20 20 0 0 0 56 226" fill="none" stroke="#b8c8d2" stroke-width="1" opacity="0.7"/>
  <text x="68" y="232" font-family="Orbitron, sans-serif" font-size="9" fill="#b8c8d2" opacity="0.85">θ₀</text>

  <!-- Title -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="18" fill="#eee" text-anchor="middle" font-weight="bold">Kinematics Lab</text>
</svg>
