<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-cl">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-cl)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#0d1a2a"/>
    <!-- Particle 1 approaching -->
    <circle cx="55" cy="95" r="14" fill="none" stroke="#40e8d0" stroke-width="1.5" opacity="0.3"/>
    <line x1="30" y1="95" x2="50" y2="95" stroke="#40e8d0" stroke-width="1.5" opacity="0.2" marker-end="none"/>
    <!-- Particle 2 stationary -->
    <circle cx="120" cy="105" r="18" fill="none" stroke="#f0a030" stroke-width="1.5" opacity="0.3"/>
    <!-- Impact angle line -->
    <line x1="55" y1="95" x2="120" y2="105" stroke="white" stroke-width="0.8" opacity="0.08" stroke-dasharray="4,4"/>
    <!-- Post-collision trajectories -->
    <line x1="120" y1="105" x2="170" y2="70" stroke="#40e8d0" stroke-width="1.5" opacity="0.15"/>
    <line x1="120" y1="105" x2="175" y2="145" stroke="#f0a030" stroke-width="1.5" opacity="0.15"/>
    <!-- Normal axis -->
    <line x1="120" y1="40" x2="120" y2="170" stroke="white" stroke-width="0.8" opacity="0.06" stroke-dasharray="3,3"/>
    <!-- Energy bar hints -->
    <rect x="20" y="160" width="40" height="4" rx="1" fill="#40e8d0" opacity="0.15"/>
    <rect x="20" y="168" width="30" height="4" rx="1" fill="#f0a030" opacity="0.15"/>
    <!-- Initials -->
    <text x="100" y="105" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">CL</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>
