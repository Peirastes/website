<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-tbf">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-tbf)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#36454F"/>
    <!-- Subtle two bodies with gravitational attraction -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1">
      <!-- Body 1 (larger, upper area) -->
      <circle cx="75" cy="55" r="18"/>
      <circle cx="75" cy="55" r="12" opacity="0.6"/>
      <!-- Body 2 (smaller, lower area) -->
      <circle cx="130" cy="150" r="10"/>
      <circle cx="130" cy="150" r="6" opacity="0.6"/>
      <!-- Gravitational field lines / attraction path -->
      <path d="M82,70 Q100,100 125,142" stroke-dasharray="4,3"/>
      <path d="M78,72 Q95,105 122,144" stroke-dasharray="4,3" opacity="0.6"/>
      <!-- Downward arrows suggesting free fall -->
      <line x1="75" y1="78" x2="75" y2="95"/>
      <polyline points="71,91 75,95 79,91"/>
      <line x1="130" y1="165" x2="130" y2="180"/>
      <polyline points="126,176 130,180 134,176"/>
    </g>
    <!-- Subtle radial gravity wells -->
    <g stroke="white" fill="none" opacity="0.06" stroke-width="0.8">
      <circle cx="75" cy="55" r="30"/>
      <circle cx="75" cy="55" r="42"/>
      <circle cx="130" cy="150" r="20"/>
      <circle cx="130" cy="150" r="30"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">TBF</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>