<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-we">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <linearGradient id="forceGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d5875" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e07a3c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-we)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Path of motion — horizontal arrow -->
    <line x1="32" y1="120" x2="160" y2="120" stroke="#bda07a" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
    <polygon points="160,120 152,116 152,124" fill="#bda07a" opacity="0.85"/>

    <!-- Force vector applied to the body -->
    <line x1="64" y1="120" x2="116" y2="84" stroke="url(#forceGrad)" stroke-width="2.2"/>
    <polygon points="116,84 110,86 113,92" fill="#e07a3c"/>
    <text x="120" y="80" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="12" fill="#e07a3c" opacity="0.9">F</text>

    <!-- Body (block) sliding along the path -->
    <rect x="50" y="112" width="18" height="14" fill="#2d5875" stroke="#6ea4c4" stroke-width="0.8" opacity="0.95"/>

    <!-- Displacement arc -->
    <path d="M 68 138 Q 100 146 132 138" fill="none" stroke="#6ea4c4" stroke-width="1.1" opacity="0.7"/>
    <text x="100" y="156" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="11" fill="#6ea4c4" text-anchor="middle" opacity="0.85">dx</text>

    <!-- The principle -->
    <text x="100" y="40" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="18" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.92">W = &#8710;K</text>
    <text x="100" y="62" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="11"
          fill="#c89b3c" text-anchor="middle" dominant-baseline="central" opacity="0.85">&#8747; F&#8901;dx</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#c89b3c" rx="0"/>
  </g>
</svg>
