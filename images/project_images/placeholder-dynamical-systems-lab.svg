<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-dsl">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-dsl)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#4682B4"/>
    <!-- Subtle Lorenz-like attractor / double spiral -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1">
      <!-- Left wing of attractor -->
      <path d="M60,90 Q40,70 50,50 Q65,35 80,50 Q90,65 75,80 Q60,95 55,85"/>
      <!-- Right wing of attractor -->
      <path d="M140,90 Q160,70 150,50 Q135,35 120,50 Q110,65 125,80 Q140,95 145,85"/>
      <!-- Connecting path -->
      <path d="M75,80 Q100,100 125,80"/>
    </g>
    <!-- Subtle coordinate axes -->
    <g stroke="white" opacity="0.08" stroke-width="1">
      <line x1="25" y1="170" x2="175" y2="170"/>
      <line x1="25" y1="170" x2="25" y2="30"/>
      <!-- Tick marks -->
      <line x1="60" y1="168" x2="60" y2="172"/>
      <line x1="100" y1="168" x2="100" y2="172"/>
      <line x1="140" y1="168" x2="140" y2="172"/>
    </g>
    <!-- Subtle trajectory dots -->
    <g fill="white" opacity="0.12">
      <circle cx="50" cy="50" r="1.5"/>
      <circle cx="65" cy="42" r="1.5"/>
      <circle cx="80" cy="50" r="1.5"/>
      <circle cx="120" cy="50" r="1.5"/>
      <circle cx="135" cy="42" r="1.5"/>
      <circle cx="150" cy="50" r="1.5"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">DSL</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>