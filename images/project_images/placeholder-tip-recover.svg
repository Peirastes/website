<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Hinge axis (vertical dashed reference) -->
  <line x1="120" y1="40" x2="120" y2="250" stroke="#533483" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Door + shelf + cylinder, swung slightly open (lab-frame snapshot) -->
  <g transform="rotate(-10 120 50)">
    <!-- Door panel (edge-on) -->
    <line x1="120" y1="50" x2="120" y2="245" stroke="#0f3460" stroke-width="6"/>
    <!-- Shelf surface extending forward from the door -->
    <line x1="120" y1="170" x2="285" y2="170" stroke="#9ca3af" stroke-width="3"/>
    <!-- Shelf front rail -->
    <line x1="285" y1="158" x2="285" y2="182" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <!-- Cylinder, leaning at the tip-recover moment -->
    <g transform="translate(215 170) rotate(-20)">
      <rect x="-12" y="-68" width="24" height="68" fill="none" stroke="#ffae20" stroke-width="2" rx="2"/>
      <!-- Top-centre dot -->
      <circle cx="0" cy="-68" r="3.5" fill="#7dd6ff"/>
    </g>
  </g>

  <!-- Hinge cap -->
  <circle cx="120" cy="40" r="5" fill="#e94560"/>

  <!-- Lab-frame trace of the top-centre dot (the arc it sweeps) -->
  <path d="M 240 80 Q 200 55 165 95" fill="none" stroke="#7dd6ff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- Title -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="18" fill="#eee" text-anchor="middle" font-weight="bold">Tip-Recover</text>
</svg>
