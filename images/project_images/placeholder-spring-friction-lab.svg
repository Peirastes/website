<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-sf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-sf)"/>

  <!-- Ground line + hatching -->
  <line x1="30" y1="210" x2="300" y2="210" stroke="#9ca3af" stroke-width="1.5" opacity="0.7"/>
  <g stroke="#9ca3af" stroke-width="0.8" opacity="0.3">
    <line x1="40" y1="210" x2="32" y2="220"/><line x1="64" y1="210" x2="56" y2="220"/>
    <line x1="88" y1="210" x2="80" y2="220"/><line x1="112" y1="210" x2="104" y2="220"/>
    <line x1="136" y1="210" x2="128" y2="220"/><line x1="160" y1="210" x2="152" y2="220"/>
    <line x1="184" y1="210" x2="176" y2="220"/><line x1="208" y1="210" x2="200" y2="220"/>
  </g>

  <!-- Wall (left) + hatching -->
  <line x1="40" y1="210" x2="40" y2="150" stroke="#b8c8d2" stroke-width="1.8" opacity="0.8"/>
  <g stroke="#b8c8d2" stroke-width="0.8" opacity="0.4">
    <line x1="40" y1="158" x2="31" y2="166"/><line x1="40" y1="170" x2="31" y2="178"/>
    <line x1="40" y1="182" x2="31" y2="190"/><line x1="40" y1="194" x2="31" y2="202"/>
  </g>

  <!-- Compressed spring (zigzag) -->
  <polyline points="40,184 48,176 56,192 64,176 72,192 80,176 88,184"
            fill="none" stroke="#7dd6ff" stroke-width="2.2"/>

  <!-- Block -->
  <rect x="88" y="166" width="40" height="38" rx="4" fill="#243446" stroke="#7fb0d8" stroke-width="2"/>
  <text x="108" y="190" font-family="Orbitron, sans-serif" font-size="13" font-weight="bold" fill="#cfe0ee" text-anchor="middle">m</text>

  <!-- Friction arrow on block -->
  <line x1="120" y1="200" x2="98" y2="200" stroke="#ff4d5e" stroke-width="2"/>
  <polygon points="98,200 104,196 104,204" fill="#ff4d5e"/>

  <!-- Natural-length dashed reference + Δx bracket -->
  <line x1="152" y1="150" x2="152" y2="222" stroke="#7dd6ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <line x1="88" y1="226" x2="152" y2="226" stroke="#7dd6ff" stroke-width="1.2" opacity="0.8"/>
  <text x="120" y="240" font-family="'Share Tech Mono', monospace" font-size="11" fill="#7dd6ff" text-anchor="middle">Δx</text>

  <!-- Energy ledger (right) — spring PE (short, cyan) vs friction toll (tall, gold) -->
  <line x1="250" y1="200" x2="370" y2="200" stroke="#9ca3af" stroke-width="1" opacity="0.4"/>
  <rect x="262" y="160" width="34" height="40" fill="#7dd6ff" opacity="0.85"/>
  <rect x="320" y="110" width="34" height="90" fill="#ffae20" opacity="0.9"/>
  <text x="279" y="152" font-family="'Share Tech Mono', monospace" font-size="10" fill="#7dd6ff" text-anchor="middle">PE</text>
  <text x="337" y="102" font-family="'Share Tech Mono', monospace" font-size="10" fill="#ffae20" text-anchor="middle">μmgΔx</text>
  <text x="310" y="225" font-family="'Share Tech Mono', monospace" font-size="9" fill="#9ca3af" text-anchor="middle" opacity="0.7">ENERGY LEDGER</text>

  <!-- v² negative tag -->
  <text x="200" y="58" font-family="Orbitron, sans-serif" font-size="14" font-weight="bold" fill="#ff4d5e" text-anchor="middle">v² &lt; 0  ·  NO LAUNCH</text>

  <!-- Title -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="18" fill="#eee" text-anchor="middle" font-weight="bold">Spring–Friction Lab</text>
</svg>
