<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-ss">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <radialGradient id="plume" cx="100" cy="170" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e07a3c" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#c89b3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2d5875" stop-opacity="0.02"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#clip-ss)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Plume backdrop -->
    <rect width="200" height="200" fill="url(#plume)"/>

    <!-- Smoke streamlines — curling vortex pattern -->
    <g fill="none" stroke="#e07a3c" stroke-width="1.2" opacity="0.85">
      <path d="M 90 180 Q 86 150 100 130 Q 120 110 110 88 Q 96 70 110 50"/>
      <path d="M 110 180 Q 116 150 102 132 Q 84 112 96 88 Q 112 66 100 46" opacity="0.7"/>
      <path d="M 78 180 Q 70 152 84 134 Q 100 116 86 96 Q 70 78 86 58" opacity="0.55"/>
    </g>

    <!-- Curl swirl in upper region -->
    <g fill="none" stroke="#6ea4c4" stroke-width="1" opacity="0.7">
      <path d="M 130 60 Q 150 56 156 72 Q 158 88 142 90 Q 130 90 130 78"/>
      <path d="M 60 70 Q 44 66 40 82 Q 38 98 54 100" opacity="0.6"/>
    </g>

    <!-- Vector field arrows -->
    <g stroke="#bda07a" stroke-width="0.9" opacity="0.55" fill="#bda07a">
      <line x1="40" y1="40" x2="50" y2="34"/><polygon points="50,34 47,38 51,37"/>
      <line x1="160" y1="40" x2="170" y2="34"/><polygon points="170,34 167,38 171,37"/>
      <line x1="34" y1="120" x2="44" y2="116"/><polygon points="44,116 41,120 45,119"/>
      <line x1="166" y1="120" x2="176" y2="116"/><polygon points="176,116 173,120 177,119"/>
    </g>

    <!-- Initials -->
    <text x="100" y="115" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="22" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.92">&#8711;&#8901;u = 0</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#e07a3c" rx="0"/>
  </g>
</svg>
