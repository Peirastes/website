<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-ap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1420;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06080c;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="ball-ap" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe0a0"/>
      <stop offset="55%" stop-color="#ffae20"/>
      <stop offset="100%" stop-color="#8a6410"/>
    </radialGradient>
    <linearGradient id="tube-ap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142240"/>
      <stop offset="1" stop-color="#0a101f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-ap)"/>

  <!-- anchor baseline -->
  <line x1="28" y1="150" x2="300" y2="150" stroke="#506070" stroke-width="1" stroke-dasharray="3 6" opacity="0.55"/>
  <!-- prediction boundary -->
  <line x1="210" y1="60" x2="210" y2="240" stroke="#ffae20" stroke-width="1" stroke-dasharray="2 5" opacity="0.5"/>

  <!-- observed history trace (cyan) -->
  <polyline points="28,168 52,150 74,158 96,132 120,140 146,112 172,120 210,96"
            fill="none" stroke="#7dd6ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- structured future (green, up) -->
  <polyline points="210,96 232,80 256,70 282,56"
            fill="none" stroke="#40d870" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- apophenic / noise alternative (coral, faint) -->
  <polyline points="210,96 234,120 258,104 284,140"
            fill="none" stroke="#ff7a6f" stroke-width="2" stroke-dasharray="3 4" opacity="0.55"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- fluid tube + ball (right) -->
  <rect x="320" y="52" width="46" height="196" rx="12" fill="url(#tube-ap)" stroke="#1D2A44" stroke-width="1"/>
  <line x1="326" y1="150" x2="360" y2="150" stroke="#506070" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <circle cx="343" cy="96" r="12" fill="url(#ball-ap)"/>
  <circle cx="343" cy="96" r="16" fill="none" stroke="#ffae20" stroke-width="1" opacity="0.25"/>

  <!-- tagline -->
  <text x="28" y="52" font-family="Orbitron, sans-serif" font-size="12" font-weight="bold" fill="#ffae20" letter-spacing="2">STRUCTURE / NOISE ?</text>

  <!-- title -->
  <text x="200" y="285" font-family="Georgia, serif" font-size="19" fill="#eef2f8" text-anchor="middle" font-weight="bold">The Apophenia Filter</text>
</svg>
