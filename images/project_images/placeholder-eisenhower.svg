<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-etm">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-etm)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#2D6A4F"/>
    <!-- Subtle Eisenhower matrix grid -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Grid lines forming 4 quadrants -->
      <line x1="100" y1="30" x2="100" y2="170"/>
      <line x1="30" y1="100" x2="170" y2="100"/>
      <!-- Outer frame -->
      <rect x="30" y="30" width="140" height="140" rx="4"/>
    </g>
    <!-- Subtle checkmarks in quadrants -->
    <g stroke="white" fill="none" opacity="0.12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Check in Q1 (urgent+important) -->
      <polyline points="52,62 60,70 76,52"/>
      <!-- Check in Q2 -->
      <polyline points="112,62 120,70 136,52"/>
      <!-- Small dots in Q3 and Q4 suggesting tasks -->
      <circle cx="65" cy="130" r="2" fill="white"/>
      <circle cx="65" cy="140" r="2" fill="white"/>
      <circle cx="125" cy="130" r="2" fill="white"/>
    </g>
    <!-- Subtle axis labels -->
    <g fill="white" opacity="0.08" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="middle">
      <text x="65" y="26">URGENT</text>
      <text x="135" y="26">NOT URGENT</text>
      <text x="20" y="65" transform="rotate(-90 20 65)" font-size="7">IMPORTANT</text>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">ETM</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>