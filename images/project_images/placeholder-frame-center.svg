<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-fca">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-fca)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#5C4B8A"/>
    <!-- Subtle evenly spaced vertical rectangles (frames on a wall) -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1">
      <!-- Five frames arranged evenly across the canvas -->
      <rect x="18" y="40" width="24" height="32" rx="2"/>
      <rect x="55" y="50" width="20" height="40" rx="2"/>
      <rect x="88" y="35" width="28" height="36" rx="2"/>
      <rect x="128" y="45" width="22" height="30" rx="2"/>
      <rect x="162" y="38" width="20" height="38" rx="2"/>
    </g>
    <!-- Centerline / alignment guide -->
    <g stroke="white" fill="none" opacity="0.07" stroke-width="0.8" stroke-dasharray="3,3">
      <!-- Horizontal center alignment line -->
      <line x1="10" y1="60" x2="190" y2="60"/>
      <!-- Vertical center axis -->
      <line x1="100" y1="25" x2="100" y2="80"/>
    </g>
    <!-- Center target crosshair -->
    <g stroke="white" fill="none" opacity="0.09" stroke-width="1">
      <circle cx="100" cy="55" r="8"/>
      <circle cx="100" cy="55" r="3"/>
      <line x1="100" y1="45" x2="100" y2="48"/>
      <line x1="100" y1="62" x2="100" y2="65"/>
      <line x1="90" y1="55" x2="93" y2="55"/>
      <line x1="107" y1="55" x2="110" y2="55"/>
    </g>
    <!-- Spacing tick marks below frames -->
    <g stroke="white" fill="none" opacity="0.06" stroke-width="0.8">
      <line x1="30" y1="80" x2="30" y2="85"/>
      <line x1="65" y1="80" x2="65" y2="85"/>
      <line x1="102" y1="80" x2="102" y2="85"/>
      <line x1="139" y1="80" x2="139" y2="85"/>
      <line x1="172" y1="80" x2="172" y2="85"/>
      <!-- Connecting baseline -->
      <line x1="30" y1="83" x2="172" y2="83"/>
    </g>
    <!-- Initials -->
    <text x="100" y="115" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">FCA</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>