<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-dn">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-dn)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Course prerequisite tree — three tiers, branching edges -->
    <!-- Tier connectors -->
    <g stroke="#2d5875" stroke-width="1.1" opacity="0.7">
      <line x1="100" y1="58" x2="50"  y2="106"/>
      <line x1="100" y1="58" x2="100" y2="106"/>
      <line x1="100" y1="58" x2="150" y2="106"/>
      <line x1="50"  y1="106" x2="30"  y2="156"/>
      <line x1="50"  y1="106" x2="70"  y2="156"/>
      <line x1="100" y1="106" x2="100" y2="156"/>
      <line x1="150" y1="106" x2="130" y2="156"/>
      <line x1="150" y1="106" x2="170" y2="156"/>
    </g>

    <!-- Highlighted path through tree (one valid degree plan) -->
    <g stroke="#e07a3c" stroke-width="1.8" opacity="0.95" fill="none">
      <line x1="100" y1="58" x2="150" y2="106"/>
      <line x1="150" y1="106" x2="130" y2="156"/>
    </g>

    <!-- Root node -->
    <circle cx="100" cy="58" r="7" fill="#c89b3c" stroke="#0c0d10" stroke-width="1"/>

    <!-- Middle tier -->
    <circle cx="50"  cy="106" r="5.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="100" cy="106" r="5.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="150" cy="106" r="5.5" fill="#e07a3c" stroke="#0c0d10" stroke-width="1"/>

    <!-- Leaf tier -->
    <circle cx="30"  cy="156" r="4.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>
    <circle cx="70"  cy="156" r="4.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>
    <circle cx="100" cy="156" r="4.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>
    <circle cx="130" cy="156" r="4.5" fill="#e07a3c" stroke="#0c0d10" stroke-width="1"/>
    <circle cx="170" cy="156" r="4.5" fill="#6ea4c4" stroke="#0c0d10" stroke-width="1" opacity="0.85"/>

    <!-- Initials -->
    <text x="100" y="32" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="16" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.88" letter-spacing="2">B.S. plan</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#c89b3c" rx="0"/>
  </g>
</svg>
