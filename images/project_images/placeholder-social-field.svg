<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-sf">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-sf)">
    <rect width="200" height="200" rx="12" fill="#0c0d10"/>

    <!-- Domain background — two contrasting regions with a boundary -->
    <path d="M 0 0 L 200 0 L 200 90 Q 130 105 90 130 Q 50 155 0 145 Z" fill="#2d5875" opacity="0.32"/>
    <path d="M 0 145 Q 50 155 90 130 Q 130 105 200 90 L 200 200 L 0 200 Z" fill="#e07a3c" opacity="0.22"/>

    <!-- Domain boundary curve -->
    <path d="M 0 145 Q 50 155 90 130 Q 130 105 200 90"
          fill="none" stroke="#c89b3c" stroke-width="1.4" opacity="0.85"/>

    <!-- Spin arrows: up-spins in the upper domain -->
    <g stroke="#6ea4c4" stroke-width="1.4" opacity="0.85" fill="none">
      <line x1="34" y1="64" x2="34" y2="36"/><polygon points="34,33 31,41 37,41" fill="#6ea4c4"/>
      <line x1="60" y1="48" x2="60" y2="20"/><polygon points="60,17 57,25 63,25" fill="#6ea4c4"/>
      <line x1="90" y1="68" x2="90" y2="40"/><polygon points="90,37 87,45 93,45" fill="#6ea4c4"/>
      <line x1="124" y1="56" x2="124" y2="28"/><polygon points="124,25 121,33 127,33" fill="#6ea4c4"/>
      <line x1="156" y1="74" x2="156" y2="46"/><polygon points="156,43 153,51 159,51" fill="#6ea4c4"/>
    </g>

    <!-- Down-spins in the lower domain -->
    <g stroke="#e07a3c" stroke-width="1.4" opacity="0.95" fill="none">
      <line x1="28" y1="168" x2="28" y2="196"/><polygon points="28,196 25,188 31,188" fill="#e07a3c"/>
      <line x1="58" y1="174" x2="58" y2="190"/><polygon points="58,190 55,182 61,182" fill="#e07a3c"/>
      <line x1="94" y1="160" x2="94" y2="188"/><polygon points="94,188 91,180 97,180" fill="#e07a3c"/>
      <line x1="130" y1="158" x2="130" y2="186"/><polygon points="130,186 127,178 133,178" fill="#e07a3c"/>
      <line x1="166" y1="140" x2="166" y2="174"/><polygon points="166,174 163,166 169,166" fill="#e07a3c"/>
    </g>

    <!-- Initials -->
    <text x="100" y="106" font-family="Cinzel, Georgia, serif" font-style="italic" font-size="32" font-weight="500"
          fill="#e8e4d8" text-anchor="middle" dominant-baseline="central" opacity="0.92">SF</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#c89b3c" rx="0"/>
  </g>
</svg>
