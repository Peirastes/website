<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-te">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
    <linearGradient id="hotcold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e07a3c" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#c89b3c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6ea4c4" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-te)">
    <rect width="200" height="200" rx="12" fill="#0a0e14"/>

    <!-- Vertical thermal gradient backdrop -->
    <rect x="20" y="40" width="160" height="120" rx="2" fill="url(#hotcold)"/>

    <!-- Server rack outline -->
    <rect x="40" y="50" width="120" height="100" fill="none" stroke="#2d5875" stroke-width="1.2" opacity="0.85"/>

    <!-- Server unit rows -->
    <g fill="#0a0e14" stroke="#6ea4c4" stroke-width="0.6" opacity="0.85">
      <rect x="46" y="58"  width="108" height="10"/>
      <rect x="46" y="72"  width="108" height="10"/>
      <rect x="46" y="86"  width="108" height="10"/>
      <rect x="46" y="100" width="108" height="10"/>
      <rect x="46" y="114" width="108" height="10"/>
      <rect x="46" y="128" width="108" height="10"/>
    </g>
    <!-- Status LEDs -->
    <g>
      <circle cx="52" cy="63"  r="1.4" fill="#e07a3c"/>
      <circle cx="52" cy="77"  r="1.4" fill="#c89b3c"/>
      <circle cx="52" cy="91"  r="1.4" fill="#6ea4c4"/>
      <circle cx="52" cy="105" r="1.4" fill="#6ea4c4"/>
      <circle cx="52" cy="119" r="1.4" fill="#c89b3c"/>
      <circle cx="52" cy="133" r="1.4" fill="#e07a3c"/>
    </g>

    <!-- Heat-flow arrows on the right -->
    <g stroke="#e07a3c" stroke-width="1.3" opacity="0.85" fill="#e07a3c">
      <line x1="178" y1="60" x2="178" y2="40"/><polygon points="178,38 175,46 181,46"/>
      <line x1="178" y1="90" x2="178" y2="70"/><polygon points="178,68 175,76 181,76"/>
    </g>
    <!-- Cool intake on left -->
    <g stroke="#6ea4c4" stroke-width="1.3" opacity="0.85" fill="#6ea4c4">
      <line x1="22" y1="120" x2="22" y2="140"/><polygon points="22,142 19,134 25,134"/>
      <line x1="22" y1="150" x2="22" y2="170"/><polygon points="22,172 19,164 25,164"/>
    </g>

    <!-- Hot/cold labels (subtle) -->
    <text x="100" y="34" font-family="Share Tech Mono, monospace" font-size="9" fill="#e07a3c" text-anchor="middle" opacity="0.8">T&#8321;</text>
    <text x="100" y="178" font-family="Share Tech Mono, monospace" font-size="9" fill="#6ea4c4" text-anchor="middle" opacity="0.8">T&#8322;</text>

    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#6ea4c4" rx="0"/>
  </g>
</svg>
