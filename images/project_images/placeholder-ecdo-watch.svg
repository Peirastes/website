<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-ew">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-ew)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#8B1A1A"/>
    <!-- Subtle seismograph / waveform pattern -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <polyline points="15,60 30,60 35,45 40,75 45,50 50,70 55,55 60,65 70,60 85,60"/>
      <polyline points="15,80 30,80 35,72 40,88 45,76 50,84 55,80 70,80 85,80"/>
    </g>
    <!-- Subtle globe / earth outline -->
    <g stroke="white" fill="none" opacity="0.08" stroke-width="1">
      <circle cx="140" cy="60" r="28"/>
      <ellipse cx="140" cy="60" rx="14" ry="28"/>
      <line x1="112" y1="60" x2="168" y2="60"/>
      <path d="M118,45 Q140,40 162,45"/>
      <path d="M118,75 Q140,80 162,75"/>
    </g>
    <!-- Subtle magnetic field indicator lines at bottom -->
    <g stroke="white" fill="none" opacity="0.08" stroke-width="0.8">
      <path d="M30,150 Q60,135 100,150 Q140,165 170,150"/>
      <path d="M30,160 Q60,145 100,160 Q140,175 170,160"/>
      <path d="M30,170 Q60,155 100,170 Q140,185 170,170"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">EW</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>