<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Pivot point -->
  <circle cx="200" cy="60" r="6" fill="#e94560"/>
  <!-- Pendulum arm -->
  <line x1="200" y1="60" x2="300" y2="200" stroke="#0f3460" stroke-width="4" stroke-linecap="round"/>
  <!-- Propeller housing -->
  <circle cx="300" cy="200" r="18" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
  <!-- Propeller blades -->
  <ellipse cx="300" cy="200" rx="30" ry="5" fill="#e94560" opacity="0.7" transform="rotate(30 300 200)"/>
  <ellipse cx="300" cy="200" rx="30" ry="5" fill="#e94560" opacity="0.7" transform="rotate(150 300 200)"/>
  <!-- Arc showing motion -->
  <path d="M 120 220 A 140 140 0 0 1 280 220" fill="none" stroke="#533483" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Angle indicator -->
  <path d="M 200 60 L 200 120" stroke="#533483" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M 200 100 A 40 40 0 0 1 228 116" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.8"/>
  <!-- Title -->
  <text x="200" y="270" font-family="Georgia, serif" font-size="18" fill="#eee" text-anchor="middle" font-weight="bold">Aeropendulum</text>
</svg>
