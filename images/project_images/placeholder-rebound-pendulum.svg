<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-rp">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-rp)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#7B2D26"/>
    <!-- Subtle pendulum arc with ball at impact point -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Pivot point -->
      <circle cx="100" cy="25" r="3" fill="white" stroke="none" opacity="0.1"/>
      <!-- Pendulum arc (swing path) -->
      <path d="M40,140 Q55,60 100,40 Q145,60 160,140" stroke-dasharray="4,3"/>
      <!-- Pendulum rod at impact position (bottom of swing) -->
      <line x1="100" y1="25" x2="100" y2="135" stroke-width="1"/>
      <!-- Ball at impact point (bottom of arc) -->
      <circle cx="100" cy="145" r="10"/>
      <circle cx="100" cy="145" r="6" opacity="0.6"/>
    </g>
    <!-- Impact burst lines at bottom -->
    <g stroke="white" fill="none" opacity="0.08" stroke-width="0.8">
      <line x1="100" y1="155" x2="100" y2="170"/>
      <line x1="90" y1="153" x2="82" y2="165"/>
      <line x1="110" y1="153" x2="118" y2="165"/>
      <line x1="85" y1="148" x2="72" y2="155"/>
      <line x1="115" y1="148" x2="128" y2="155"/>
    </g>
    <!-- Ghost positions along the arc -->
    <g fill="white" opacity="0.06">
      <circle cx="55" cy="120" r="7"/>
      <circle cx="145" cy="120" r="7"/>
      <circle cx="70" cy="85" r="6"/>
      <circle cx="130" cy="85" r="6"/>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">RP</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>