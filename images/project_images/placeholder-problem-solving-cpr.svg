<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="clip-cpr">
      <rect width="200" height="200" rx="12"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-cpr)">
    <!-- Background -->
    <rect width="200" height="200" rx="12" fill="#CC5500"/>
    <!-- Subtle reasoning / logic tree pattern -->
    <g stroke="white" fill="none" opacity="0.1" stroke-width="1.2">
      <!-- Central branching tree of thought -->
      <line x1="100" y1="30" x2="100" y2="50"/>
      <line x1="100" y1="50" x2="60" y2="70"/>
      <line x1="100" y1="50" x2="140" y2="70"/>
      <line x1="60" y1="70" x2="40" y2="90"/>
      <line x1="60" y1="70" x2="80" y2="90"/>
      <line x1="140" y1="70" x2="120" y2="90"/>
      <line x1="140" y1="70" x2="160" y2="90"/>
    </g>
    <!-- Subtle node circles at branch points -->
    <g fill="white" opacity="0.12">
      <circle cx="100" cy="50" r="3"/>
      <circle cx="60" cy="70" r="3"/>
      <circle cx="140" cy="70" r="3"/>
      <circle cx="40" cy="90" r="2"/>
      <circle cx="80" cy="90" r="2"/>
      <circle cx="120" cy="90" r="2"/>
      <circle cx="160" cy="90" r="2"/>
    </g>
    <!-- Subtle cyclic arrows (CPR cycle metaphor) -->
    <g stroke="white" fill="none" opacity="0.08" stroke-width="1">
      <path d="M55,155 A30,30 0 1,1 145,155"/>
      <path d="M145,155 A30,30 0 1,1 55,155"/>
      <!-- Arrow tips -->
      <polyline points="140,150 145,155 140,160" fill="none"/>
      <polyline points="60,160 55,155 60,150" fill="none"/>
    </g>
    <!-- Subtle question mark watermark -->
    <g fill="white" opacity="0.06" font-family="Georgia, serif" font-size="120">
      <text x="130" y="170">?</text>
    </g>
    <!-- Initials -->
    <text x="100" y="110" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold"
          fill="white" text-anchor="middle" dominant-baseline="central">CPR</text>
    <!-- Accent bottom border -->
    <rect x="0" y="196" width="200" height="4" fill="#FF5500" rx="0"/>
  </g>
</svg>